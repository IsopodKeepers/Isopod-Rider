      while(ti<tg.length&&P.x>=tg[ti]&&P.ground&&!P.rail&&!P.ramp&&!P.loop&&!P.tube&&!(P.bail>0)){
        out.snaps[ti]=Object.assign({},P);ti++;
      }
      if(P.won){out.won=true;break;}
    }
    out.t=P.time/60; out.endX=P.x;
  }finally{
    SIM=false;
    build();
    for(const k of Object.keys(P))delete P[k]; Object.assign(P,P0);
    cam.x=cam0.x;cam.y=cam0.y;
    for(const k in key)delete key[k]; Object.assign(key,key0);
    started=st0;rec=rec0;attempts=att0;
    fx.length=0;fx.push(...fx0);dust.length=0;dust.push(...du0);
  }
  return out;
}

/* ----- state ----- */
let bSel=0, bCamX=0, bCamDY=0, bFast=false, bHeld={l:false,r:false,u:false,d:false};
let bUndo=[], bRedo=[], bRideIdx=-1, bDrag=null, bSaved=0;
const bLv=()=>LEVELS[levelIdx];
const THEME_NAMES={forest:'Forest (The Quarry)',beach:'Beach (Baja Beach)',parade:'City street (Main Street)',orbit:'Sandlot (The Sandlot)',
  jungle:'Jungle (no picture yet)',club:'Night club (no picture yet)',sunset:'Sunset forest'};
const bLocked=(L=bLv())=>!L.custom&&!L.mine;
const tuneArr=L=>{const a=[];for(let i=0;i<L.seq.length;i++)
  a.push(L.tune&&L.tune[i]?Object.assign({},L.tune[i]):null);return a;};
function setSeq(L,seq,ta){
  L.seq=seq.join('');const t={};
  ta.forEach((o,i)=>{if(o&&Object.keys(o).length)t[i]=o;});
  if(Object.keys(t).length)L.tune=t;else delete L.tune;
}
const bState=()=>JSON.stringify({seq:bLv().seq,tune:bLv().tune||null,len:bLv().len});
function bCommit(before){bUndo.push({lvl:levelIdx,s:before});if(bUndo.length>200)bUndo.shift();bRedo.length=0;}
function bUndoLast(redo){
  const from=redo?bRedo:bUndo, to=redo?bUndo:bRedo, u=from.pop(); if(!u)return;
  if(u.lvl!==levelIdx){loadLevel(u.lvl);}
  to.push({lvl:u.lvl,s:bState()});
  const s=JSON.parse(u.s), L=bLv();
  L.seq=s.seq;L.len=s.len;if(s.tune)L.tune=s.tune;else delete L.tune;
  bApply();bPanel();
}

// After any change: mark the track edited (unless it is back to how the file ships it),
// size its length to fit, rebuild, save, and re-run the preview.
function bApply(){
  const L=bLv(), i=levelIdx;
  if(L.custom)L.edited=true;
  else if(sameAsFile(L,i)){L.edited=false;L.len=fileLevel(i).len;}
  else L.edited=true;
  if(L.edited){
    loadLevel(i); LEN=MAXW-200; build();
    const last=pieceSpans[pieceSpans.length-1];
    const need=last?Math.max(last.a+5401,FINISH+200):8000;
    const F=fileLevel(i);   // a stock track only ever grows, so its checkpoints stay put
    L.len=Math.min(MAXW-200,Math.max(F&&!L.custom?F.len:(L.len0||0),Math.ceil(need/100)*100));
  }
  bestT[i]=null;ghost[i]=null;loadBest();loadGhosts();
  loadLevel(i);build();buildDecor();saveBuilder();
  bSim=null;clearTimeout(bSimTimer);
  bSimTimer=setTimeout(()=>{bSim=simGas();bStats();bMini();},120);
  bMini();
}
function bFocus(i){
  const s=pieceSpans[i]; if(!s)return;
  const w=s.b-s.a;
  bCamX=w<W-120?s.a+w/2-W/2:s.a-100; bCamDY=0;
}

/* ----- open / close / ride ----- */
function openBuilder(){
  building=true; bRideIdx=-1;
  for(const k in key)key[k]=false;
  started=true;titleUp=false;P.cd=0;P.go=0;P.won=0;P.practice=false;
  loadLevel(levelIdx);
  bSel=Math.min(bSel,Math.max(0,bLv().seq.length-1));
  bPanel();fit();bApply();bFocus(bSel);
}
function closeBuilder(){
  building=false;
  const el=document.getElementById('builder'); if(el)el.remove();
  bModalClose(); fit();
  loadLevel(levelIdx); reset(); buildDecor();
}
// Drop in just before a piece, at the speed a gas-held run carries there. Practice runs
// never touch best times or ghosts; finishing (or B) goes straight back to the builder.
function rideFrom(i){
  if(!bSim)bSim=simGas();
  const s=bSim.snaps[i];
  if(building){building=false;const el=document.getElementById('builder');if(el)el.remove();fit();}
  started=true;titleUp=false;
  reset(false,true);
  if(s){
    Object.assign(P,s);
    P.time=0;P.won=0;P.cd=CD_BEAT;P.go=0;P.bails=0;P.smY=s.y;
    P.rail=null;P.ramp=null;P.loop=null;P.tube=null;
    P.spawn={x:s.x,y:s.y};
    for(const c of checks)if(c.x<s.x)c.hit=true;
  }
  P.practice=true; bRideIdx=i;
  cam.x=P.x-W*0.36; cam.y=P.y-H/2;
  for(const k in key)key[k]=false;
  note(s?'PRACTICE \u2014 B: back to builder':'PRACTICE FROM THE START','#ffd23f');
}

/* ----- keys and mouse ----- */
function builderKey(e){
  const tag=e.target&&e.target.tagName;
  const typing=tag==='INPUT'&&e.target.type!=='range'||tag==='TEXTAREA'||tag==='SELECT';
  if(!building){
    if(e.code==='KeyB'&&!typing){openBuilder();e.preventDefault();return true;}
    if(P.practice&&e.code==='Escape'){openBuilder();e.preventDefault();return true;}
    if(P.practice&&e.code==='KeyR'){rideFrom(bRideIdx);e.preventDefault();return true;}
    return false;
  }
  if(typing){if(e.code==='Escape')e.target.blur();return true;}
  if(e.code==='KeyB'||e.code==='Escape'){
    if(document.getElementById('bModal'))bModalClose();else closeBuilder();
    e.preventDefault();return true;}
  if((e.ctrlKey||e.metaKey)&&(e.code==='KeyY'||(e.code==='KeyZ'&&e.shiftKey))){bUndoLast(true);e.preventDefault();return true;}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){bUndoLast();e.preventDefault();return true;}
  bFast=e.shiftKey;
  if(e.code==='ArrowLeft'||e.code==='KeyA')bHeld.l=true;
  else if(e.code==='ArrowRight'||e.code==='KeyD')bHeld.r=true;
  else if(e.code==='ArrowUp'||e.code==='KeyW')bHeld.u=true;
  else if(e.code==='ArrowDown'||e.code==='KeyS')bHeld.d=true;
  else if(e.code==='BracketRight'||e.code==='Period'){bSelect(bSel+1);}
  else if(e.code==='BracketLeft'||e.code==='Comma'){bSelect(bSel-1);}
  else if(e.code==='Enter'){rideFrom(bSel);}
  else if(e.code==='KeyM'){toggleMusic();}
  else return true;
  e.preventDefault();return true;
}
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')bHeld.l=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')bHeld.r=false;
  if(e.code==='ArrowUp'||e.code==='KeyW')bHeld.u=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')bHeld.d=false;
  if(!e.shiftKey)bFast=false;
});
const cvX=e=>{const r=cv.getBoundingClientRect();return (e.clientX-r.left)*(W/r.width);};
cv.addEventListener('mousedown',e=>{if(!building)return;bDrag={x0:e.clientX,cam0:bCamX,mx:cvX(e),moved:false};});
addEventListener('mousemove',e=>{
  if(!building||!bDrag)return;
  const r=cv.getBoundingClientRect(), dx=(e.clientX-bDrag.x0)*(W/r.width);
  if(Math.abs(dx)>4)bDrag.moved=true;
  if(bDrag.moved)bCamX=bDrag.cam0-dx;
});
addEventListener('mouseup',()=>{
  if(!building||!bDrag)return;
  if(!bDrag.moved){
    const wx=bCamX+bDrag.mx, i=pieceSpans.findIndex(s=>wx>=s.a&&wx<s.b);
    if(i>=0){bSel=i;bPanel();}
  }
  bDrag=null;
});
cv.addEventListener('wheel',e=>{if(!building)return;bCamX+=(e.deltaY+e.deltaX)*1.5;e.preventDefault();},{passive:false});

function builderFrame(){
  const sp=bFast?40:14;
  if(bHeld.l)bCamX-=sp; if(bHeld.r)bCamX+=sp;
  if(bHeld.u)bCamDY-=sp; if(bHeld.d)bCamDY+=sp;
  bCamX=Math.max(-300,Math.min(LEN-W+300,bCamX));
  cam.x=bCamX; cam.y=gAt(bCamX+W/2)-H*0.55+bCamDY;
  draw(); drawBuilder();
}

/* ----- on-canvas overlay ----- */
function drawBuilder(){
  const CX=Math.round(cam.x),CY=Math.round(cam.y);
  ctx.save();
  ctx.font='bold 10px Verdana,sans-serif';ctx.textBaseline='top';
  pieceSpans.forEach((s,i)=>{
    const a=s.a-CX,b=s.b-CX; if(b<-10||a>W+10)return;
    const sel=i===bSel;
    if(sel){ctx.fillStyle='rgba(255,210,63,0.10)';ctx.fillRect(a,0,b-a,H);}
    ctx.strokeStyle=sel?'rgba(255,210,63,0.9)':'rgba(255,255,255,0.35)';
    ctx.setLineDash([6,5]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(a+0.5,22);ctx.lineTo(a+0.5,H);ctx.stroke();ctx.setLineDash([]);
    const lbl=(i+1)+'  '+PIECES[s.k].name.toUpperCase()+(bLv().tune&&bLv().tune[s.i]?'  *':'');
    const tw=ctx.measureText(lbl).width+10, lx=Math.max(a,Math.min(b-tw,4));
    ctx.fillStyle=sel?'#ffd23f':'rgba(10,20,16,0.75)';ctx.fillRect(lx,24,tw,16);
    ctx.fillStyle=sel?'#1a1405':'#e8f0d8';ctx.fillText(lbl,lx+5,27);
  });
  if(bSim){
    const p=bSim.pts;
    ctx.lineWidth=2.5;ctx.strokeStyle='#ffd23f';
    ctx.beginPath();let on=false;
    for(let k=0;k<p.length;k+=3){
      const x=p[k]-CX,y=p[k+1]-CY;
      if(p[k+2]&&x>-40&&x<W+40){if(!on)ctx.moveTo(x,y);else ctx.lineTo(x,y);on=true;}
      else if(on){ctx.stroke();ctx.beginPath();on=false;}
    }
    if(on)ctx.stroke();
    // a dot every half second, so you can read speed off the spacing
    ctx.fillStyle='#fff6c8';
    for(let k=0;k<p.length;k+=90){const x=p[k]-CX,y=p[k+1]-CY;
      if(x>-5&&x<W+5){ctx.beginPath();ctx.arc(x,y,2.5,0,6.3);ctx.fill();}}
    for(let k=0;k<bSim.bails.length;k+=2){
      const x=bSim.bails[k]-CX,y=bSim.bails[k+1]-CY; if(x<-20||x>W+20)continue;
      ctx.strokeStyle='#ff4d4d';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-7,y-7);ctx.lineTo(x+7,y+7);ctx.moveTo(x+7,y-7);ctx.lineTo(x-7,y+7);ctx.stroke();
      ctx.fillStyle='#ff4d4d';ctx.fillText('BAIL',x-12,y-22);
    }
  }
  ctx.fillStyle='rgba(10,20,16,0.85)';ctx.fillRect(0,0,W,20);
  ctx.fillStyle='#ffd23f';ctx.fillText('TRACK BUILDER',6,5);
  ctx.fillStyle='#cfe0bb';
  ctx.fillText(bSim?('yellow line = holding gas the whole way  \u00b7  '+
    (bSim.won?'finishes in '+bSim.t.toFixed(2)+'s':'does NOT finish')+
    (bSim.bails.length?'  \u00b7  '+bSim.bails.length+' bail'+(bSim.bails.length>1?'s':''):''))
    :'working out the line\u2026',110,5);
  ctx.restore();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bPanel(){
  let el=document.getElementById('builder');

    el=document.createElement('div');el.id='builder';document.body.appendChild(el);

  }

      ||'<div class="tip">This piece has no sliders yet.</div>';
  }
  const cutFrom=pieceSpans.length;
  el.innerHTML=`<h2><span>TRACK BUILDER</span><button data-act="close" title="B or Esc">Close \u2715</button></h2>
  <div class="row"><select data-act="level">${LEVELS.map((T,i)=>`<option value="${i}" ${i===levelIdx?'selected':''}>${esc(T.n)}${T.edited?' (edited)':''}</option>`).join('')}</select>
   <button data-act="new">+ New track</button></div>
  ${bLocked()?`<div class="lock"><b>Locked:</b> one of the original tracks: you can look and ride, not change it.
   <button class="go" data-act="copytrack">Copy as my own track</button></div>`:''}
  ${L.custom?`<div class="row">Name <input type="text" data-act="name" value="${esc(L.n)}" style="width:150px">
   Look <select data-act="theme">${Object.keys(THEMES).map(t=>`<option value="${t}" ${t===L.th?'selected':''}>${THEME_NAMES[t]||t}</option>`).join('')}</select>
   <label><input type="checkbox" data-act="flat" ${L.flat?'checked':''}> flat</label></div>`:''}
  <div id="bStats"></div>

function bStats(){
  const el=document.getElementById('bStats'); if(!el)return;
  const L=bLv();
  if(!bSim){el.innerHTML='Working out the gas-held line\u2026';return;}

   ${bSaved<0?'<span class="bad">Could not save in this browser</span>':bSaved?`<span class="ok">\u2713 Saved ${new Date(bSaved).toLocaleTimeString()}</span>`:'Changes save automatically'}`;

function bMini(){
  const c=document.getElementById('bMini'); if(!c)return;
  const g=c.getContext('2d'), w=c.width, h=c.height, x1=Math.max(1000,FINISH+300);
  let lo=1e9,hi=-1e9; for(let x=0;x<x1;x+=20){lo=Math.min(lo,G[x]);hi=Math.max(hi,G[x]);}
  const sx=w/x1, sy=(h-16)/Math.max(200,hi-lo+120), oy=8-(lo-100)*sy;
  g.clearRect(0,0,w,h);
  pieceSpans.forEach((s,i)=>{g.fillStyle=i===bSel?'rgba(255,210,63,0.30)':i%2?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.09)';
    g.fillRect(s.a*sx,0,(s.b-s.a)*sx,h);});
  g.strokeStyle='#8fb59a';g.lineWidth=2;g.beginPath();
  for(let x=0;x<x1;x+=10){const y=G[x]*sy+oy;x?g.lineTo(x*sx,y):g.moveTo(0,y);}g.stroke();
  if(bSim){g.fillStyle='#ffd23f';const p=bSim.pts;
    for(let k=0;k<p.length;k+=9)if(p[k+2])g.fillRect(p[k]*sx-1,p[k+1]*sy+oy-1,2,2);
    g.fillStyle='#ff4d4d';for(let k=0;k<bSim.bails.length;k+=2)g.fillRect(bSim.bails[k]*sx-3,bSim.bails[k+1]*sy+oy-3,6,6);}
  g.strokeStyle='#fff';g.lineWidth=1.5;g.strokeRect(cam.x*sx,1,W*sx,h-2);
  g.fillStyle='#e8f0d8';g.fillRect(FINISH*sx,0,2,h);
  c.onclick=e=>{const r=c.getBoundingClientRect(), wx=(e.clientX-r.left)/r.width*x1;
    const i=pieceSpans.findIndex(s=>wx>=s.a&&wx<s.b); if(i>=0){bSel=i;bPanel();bFocus(i);} else bCamX=wx-W/2;};
}
// The selected piece on its own, true to scale, with the gas-held line through it.
function bSec(){
  const c=document.getElementById('bSec'), s=pieceSpans[bSel]; if(!c||!s)return;
  const g=c.getContext('2d'), w=c.width, h=c.height, a=s.a-200, b=s.b+200;
  let lo=1e9,hi=-1e9;
  for(let x=Math.max(0,a);x<b;x+=5){lo=Math.min(lo,G[x]);hi=Math.max(hi,G[x]);}
  const p=bSim?bSim.pts:[];
  for(let k=0;k<p.length;k+=3)if(p[k]>a&&p[k]<b&&p[k+2])lo=Math.min(lo,p[k+1]);
  const sc=Math.min(w/(b-a),(h-20)/Math.max(60,hi-lo+40)), ox=-a*sc, oy=h-10-hi*sc-((h-20)-(hi-lo)*sc)/2;
  g.clearRect(0,0,w,h);
  g.fillStyle='#24422f';g.beginPath();g.moveTo(0,h);
  for(let x=a;x<=b;x+=2)g.lineTo(x*sc+ox,G[Math.max(0,Math.min(MAXW-1,x))]*sc+oy);
  g.lineTo(w,h);g.closePath();g.fill();
  g.strokeStyle='#8fb59a';g.lineWidth=2;g.stroke();
  g.strokeStyle='rgba(255,210,63,0.6)';g.setLineDash([5,4]);g.lineWidth=1;
  for(const x of [s.a,s.b]){g.beginPath();g.moveTo(x*sc+ox,0);g.lineTo(x*sc+ox,h);g.stroke();}
  g.setLineDash([]);
  if(bSim){
    g.strokeStyle='#ffd23f';g.lineWidth=2.5;g.beginPath();let on=false;
    for(let k=0;k<p.length;k+=3){const x=p[k];
      if(x>a&&x<b){const X=x*sc+ox,Y=(p[k+1]+R)*sc+oy;
        if(p[k+2]){on?g.lineTo(X,Y):g.moveTo(X,Y);on=true;}else if(on){g.stroke();g.beginPath();on=false;}}}
    if(on)g.stroke();
    g.fillStyle='#ff4d4d';
    for(let k=0;k<bSim.bails.length;k+=2){const x=bSim.bails[k];
      if(x>a&&x<b)g.fillRect(x*sc+ox-5,(bSim.bails[k+1]+R)*sc+oy-5,10,10);}
  }
  g.fillStyle='#cfe0bb';g.font='18px Verdana';g.fillText('start',s.a*sc+ox+4,20);g.fillText('end',s.b*sc+ox-36,20);
}
function bSelect(i){
  const n=bLv().seq.length; if(!n)return;
  bSel=(i+n)%n;bPanel();bFocus(bSel);
}
function bEdit(fn){const before=bState();fn();if(bState()!==before){bCommit(before);bApply();}bPanel();}
function bClick(e){
  const pick=e.target.closest('[data-pick]');
  if(pick){bSel=+pick.dataset.pick;bPanel();bFocus(bSel);return;}
  const b=e.target.closest('button'); if(!b)return;
  const L=bLv(), seq=L.seq.split(''), ta=tuneArr(L), i=bSel, act=b.dataset.act;
  if(bLocked()&&['up','down','dup','del','add','rpiece','revert'].includes(act))return;
  if(act==='close')closeBuilder();
  else if(act==='copytrack')bNewTrack(L);
  else if(act==='up'&&i>0)bEdit(()=>{[seq[i-1],seq[i]]=[seq[i],seq[i-1]];[ta[i-1],ta[i]]=[ta[i],ta[i-1]];setSeq(L,seq,ta);bSel--;});
  else if(act==='down'&&i<seq.length-1)bEdit(()=>{[seq[i+1],seq[i]]=[seq[i],seq[i+1]];[ta[i+1],ta[i]]=[ta[i],ta[i+1]];setSeq(L,seq,ta);bSel++;});
  else if(act==='dup'&&seq.length)bEdit(()=>{seq.splice(i+1,0,seq[i]);ta.splice(i+1,0,ta[i]?Object.assign({},ta[i]):null);setSeq(L,seq,ta);bSel++;});
  else if(act==='del'&&seq.length)bEdit(()=>{seq.splice(i,1);ta.splice(i,1);setSeq(L,seq,ta);bSel=Math.max(0,i-1);});
  else if(act==='add'){const k=document.querySelector('#builder [data-act=addk]').value;
    bEdit(()=>{const at=seq.length?i+1:0;seq.splice(at,0,k);ta.splice(at,0,null);setSeq(L,seq,ta);bSel=at;});bFocus(bSel);}
  else if(act==='rpiece')bEdit(()=>{ta[i]=null;setSeq(L,seq,ta);});
  else if(act==='ride')rideFrom(i);
  else if(act==='undo')bUndoLast();
  else if(act==='redo')bUndoLast(true);
  else if(act==='new')bNewTrack();
  else if(act==='revert')bRevert();
  else if(act==='export')bExport();
}
let bKnobBefore=null;
function bInput(e){
  const id=e.target.dataset.knob; if(!id||bLocked())return;
  const L=bLv(), seq=L.seq.split(''), ta=tuneArr(L), k=seq[bSel];
  if(bKnobBefore===null)bKnobBefore=bState();
  const val=+e.target.value, p=id==='space'?{def:defSpace(k)}:PIECES[k].ps.find(q=>q.id===id);
  const o=ta[bSel]||{};
  if(Math.abs(val-p.def)<1e-9)delete o[id];else o[id]=val;
  ta[bSel]=Object.keys(o).length?o:null; setSeq(L,seq,ta);
  const lab=document.getElementById('bv_'+id); if(lab)lab.textContent=+val.toFixed(3);
  bApply();
}
function bChange(e){
  const act=e.target.dataset.act, L=bLv();
  if(e.target.dataset.knob){if(bKnobBefore!==null&&bKnobBefore!==bState())bCommit(bKnobBefore);bKnobBefore=null;bPanel();return;}
  if(e.target.dataset.knob&&bLocked())return;
  if(act==='level'){loadLevel(+e.target.value);bSel=0;bApply();bPanel();bFocus(0);}
  else if(act==='name'){const nm=e.target.value.trim().toUpperCase();
    if(nm&&!LEVELS.some(T=>T!==L&&T.n===nm)){PROPS[nm]=PROPS[L.n];L.n=nm;}bApply();bPanel();}
  else if(act==='theme'){L.th=e.target.value;bApply();}
  else if(act==='flat'){bEdit(()=>{L.flat=e.target.checked;});}
}
function bNewTrack(from){
  let nm=(prompt('Name for the new track?',from?'MY '+from.n:'MY TRACK')||'').trim().toUpperCase(); if(!nm)return;
  while(LEVELS.some(T=>T.n===nm))nm+=' 2';
  const T={n:nm,seq:'kWj',len:20000,fg:1.6,th:bLv().th,flat:true,nofin:true,par:30,custom:true,edited:true};
  if(from){for(const k of ['seq','len','fg','th','flat','par'])if(from[k]!==undefined)T[k]=from[k];
    T.len0=from.len;T.from=from.from||from.n;   // same length as the original, so the copy rides the same
    if(from.tune)T.tune=JSON.parse(JSON.stringify(from.tune));if(!from.flat)delete T.flat;}
  LEVELS.push(T);
  bestT.push(null);ghost.push(null);
  loadLevel(LEVELS.length-1);bSel=0;bApply();bPanel();bFocus(0);
}
function bRevert(){
  const L=bLv(), i=levelIdx;
  if(L.custom){
    if(!confirm('Delete the track "'+L.n+'"? This cannot be undone.'))return;
    LEVELS.splice(i,1);bestT.splice(i,1);ghost.splice(i,1);loadLevel(0);
  }else{
    if(!confirm('Put "'+L.n+'" back the way the game file has it? (Undo can bring your version back.)'))return;
    bCommit(bState());
    const F=fileLevel(i);L.seq=F.seq;L.len=F.len;if(F.tune)L.tune=F.tune;else delete L.tune;
  }
  bSel=0;bApply();bPanel();bFocus(0);
}

/* ----- export: the level lines, ready to go into the game file ----- */
function jsVal(v){
  if(typeof v==='string')return "'"+v.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";
  if(Array.isArray(v))return '['+v.map(jsVal).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).map(k=>(/^[A-Za-z_]\w*$|^\d+$/.test(k)?k:jsVal(k))+':'+jsVal(v[k])).join(', ')+'}';
  return String(v);
}
function levelLine(L,i){
  const F=fileLevel(i), o={};
  for(const k of ['n','from','seq','len','len0','fg','th','flat','nofin','par','md','lay','tune'])if(L[k]!==undefined&&L[k]!==false)o[k]=L[k];
  o.mine=true;
  if(L.custom&&bSim&&levelIdx===i&&bSim.won)o.par=Math.round(bSim.t);
  if(F&&!L.custom)o.lay=(F.lay||1)+1;        // a new layout: old best times don't carry over
  if(L.custom)delete o.md;
  return '  '+jsVal(o)+',   // made in the track builder';
}
function exportBlock(src){
  const a=src.indexOf('const LEVELS=['); if(a<0)return null;
  const b=src.indexOf('\n];',a); if(b<0)return null;
  const done=new Set();
  // untouched tracks keep their original line, comments and all
  const out=src.slice(a,b).split('\n').map(line=>{
    const m=line.match(/^\s*\{n:'([^']*)'/); if(!m)return line;
    const i=LEVELS.findIndex(L=>L.n===m[1]); if(i<0)return line;
    done.add(i); return LEVELS[i].edited?levelLine(LEVELS[i],i):line;
  });
  LEVELS.forEach((L,i)=>{if(!done.has(i)&&L.custom)out.push(levelLine(L,i));});
  return src.slice(0,a)+out.join('\n')+src.slice(b);
}
function bModalClose(){const m=document.getElementById('bModal');if(m)m.remove();}
function bExport(){
  bModalClose();
  const lines=LEVELS.map((L,i)=>L.edited?levelLine(L,i):null).filter(Boolean);
  const m=document.createElement('div');m.id='bModal';
  m.innerHTML=`<div><h2 style="color:#ffd23f;font-size:14px">Export tracks</h2>
  ${lines.length?`<p>These are the tracks you changed or made. <b>Download game file</b> gives you
  <code>isopod-rider.html</code> with them built in: upload it to the repo in place of the old one
  (GitHub: Add file \u2192 Upload files). Or copy the lines below and paste them to Devin or Claude.</p>
  <textarea readonly>${esc(lines.join('\n'))}</textarea>
  <div class="row" style="display:flex;gap:6px"><button data-x="dl">Download game file</button><button data-x="copy">Copy lines</button><button data-x="close">Close</button></div>
  <p id="bExMsg" style="color:#8fb59a;margin-top:6px"></p>`
  :`<p>Nothing to export yet \u2014 every track is the same as in the game file.</p><button data-x="close">Close</button>`}</div>`;
  document.body.appendChild(m);
  m.addEventListener('click',async e=>{
    const x=e.target.dataset&&e.target.dataset.x, msg=document.getElementById('bExMsg');
    if(x==='close'||e.target===m)bModalClose();
    if(x==='copy'){const t=m.querySelector('textarea');t.select();
      try{await navigator.clipboard.writeText(t.value);}catch(err){document.execCommand('copy');}
      if(msg)msg.textContent='Copied.';}
    if(x==='dl'){
      let src=null;
      try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(r.ok)src=await r.text();}catch(err){}
      if(!src){const d=document.documentElement.cloneNode(true);
        for(const id of ['builder','bModal','bCss']){const n=d.querySelector('#'+id);if(n)n.remove();}
        src='<!DOCTYPE html>\n'+d.outerHTML;}
      const out=exportBlock(src);
      if(!out){if(msg)msg.textContent='Could not find the track list in the file \u2014 use Copy lines instead.';return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));
      a.download='isopod-rider.html';document.body.appendChild(a);a.click();a.remove();
      if(msg)msg.textContent='Downloaded isopod-rider.html.';
    }
  });
}

if(PODS[podIdx].locked)podStep(1);
loadBest();loadGhosts();loadLevel(0);reset();buildDecor();requestAnimationFrame(loop);
})();
