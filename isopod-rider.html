    ctx.textAlign='left';
  }
}
function draw(){
  const CX=Math.round(cam.x),CY=Math.round(cam.y);
  const th=TH();
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,th.sky[0]);sky.addColorStop(1,th.sky[1]);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(th.crown==='crowd'){
    // BUNTING strung across the street, two runs at different depths
    for(let L=0;L<2;L++){
      const sc=L?0.34:0.18, yb=L?96:58, sag=L?26:18;
      const off=-CX*sc;
      ctx.strokeStyle=L?'#5d6689':'#78809f';ctx.lineWidth=2;
      ctx.beginPath();
      for(let px=-40;px<=W+40;px+=10){
        const ph=Math.sin((px-off)/150)*sag;
        if(px===-40)ctx.moveTo(px,yb+ph);else ctx.lineTo(px,yb+ph);
      }
      ctx.stroke();
      for(let px=-40;px<=W+40;px+=26){
        const ph=Math.sin((px-off)/150)*sag;
        const c2=['#e8455f','#f0c24a','#4ec2e8','#8ad46b','#f08a3c'][Math.abs(Math.round((px-off)/26))%5];
        ctx.fillStyle=c2;
        ctx.beginPath();ctx.moveTo(px-6,yb+ph);ctx.lineTo(px+6,yb+ph);
        ctx.lineTo(px,yb+ph+15);ctx.closePath();ctx.fill();
      }
    }
    // CONFETTI drifting down across the whole screen
    for(let i=0;i<52;i++){
      const cx2=((i*173+ -CX*0.30)%(W+140))-70;
      const cy2=((i*97+P.time*1.15)%(H+80))-40;
      ctx.fillStyle=['#e8455f','#f0c24a','#4ec2e8','#8ad46b','#f08a3c','#fdfdf6'][i%6];
      const spin=Math.sin(P.time*0.06+i)*2.4;
      ctx.fillRect(Math.round(cx2),Math.round(cy2),3,Math.max(1,Math.round(3+spin)));
    }
  }

  // FOREST BACKDROP: a warm clearing burning through a cool canopy, with shafts of
  // light raking down through it. Everything here is behind the parallax trees.
  // SPACE backdrop. Edges were blended to match, so it plain-tiles seamlessly.
  if(th.crown==='none'&&spaceReady){
    const dh=H*1.16, dw=Math.ceil(dh*(BG_SPACE.width/BG_SPACE.height));
    // one extra tile at each end -- the tight bounds left a gap at the far end of the
    // track where the last tile stopped just short of the screen edge
    // generous bounds: the tight version left a one-frame gap right on the finish line
    const ox=CX*0.14, first=Math.floor(ox/dw);
    for(let n=first-3;n*dw<ox+W+dw*3;n++){
      const x=n*dw-ox;
      if(x>W+2||x+dw<-2)continue;
      ctx.drawImage(BG_SPACE,Math.round(x),Math.round(H-dh),Math.round(dw),Math.round(dh));
    }
    const fade=ctx.createLinearGradient(0,H*0.55,0,H);
    fade.addColorStop(0,'rgba(150,120,60,0)');
    fade.addColorStop(1,'rgba(140,110,55,0.28)');
    ctx.fillStyle=fade;ctx.fillRect(0,H*0.55,W,H*0.45);
  }

  // MAIN STREET backdrop. This plate is a street scene with a hard ground line in it,
  // so it gets ONE pass anchored to the bottom rather than two -- doubling it up would
  // put a second pavement halfway up the sky.
  if(th.crown==='crowd'&&streetReady){
    const iw=BG_STREET.width, ih=BG_STREET.height;
    const dh=H*STREET_H, dw=Math.ceil(dh*(iw/ih));
    // ONE continuous pass, no tiling at all. A backdrop covers a level without
    // repeating when  drawn_width >= level_length * parallax + viewport. Drawing it
    // 1.8x viewport height crops some sky but makes it 2311px wide, which clears the
    // 2272px this level needs at 0.10 parallax -- so every landmark appears once.
    ctx.drawImage(BG_STREET,Math.round(-CX*STREET_PAR),Math.round(H-dh),
                  Math.round(dw),Math.round(dh));
    const fade=ctx.createLinearGradient(0,H*0.55,0,H);
    fade.addColorStop(0,'rgba(40,32,56,0)');
    fade.addColorStop(1,'rgba(32,26,48,0.40)');
    ctx.fillStyle=fade;ctx.fillRect(0,H*0.55,W,H*0.45);
  }

  // BEACH backdrop -- same two-pass treatment as the forest, warmer haze
  if(th.crown==='palm'&&beachReady){
    const iw=BG_BEACH.width, ih=BG_BEACH.height;
    for(let L=0;L<2;L++){
      const sc=L?0.34:0.14;
      const dh=L?H*1.00:H*0.88;
      const dw=Math.ceil(dh*(iw/ih));
      const yTop=L?H-dh:H*0.02;
      if(L===0)ctx.globalAlpha=0.62;
      tilePlate(BG_BEACH,CX*sc,yTop,dw,dh);
      ctx.globalAlpha=1;
      if(L===0){
        const hz=ctx.createLinearGradient(0,0,0,H);
        hz.addColorStop(0,'rgba(255,214,150,0.22)');
        hz.addColorStop(1,'rgba(120,150,150,0.28)');
        ctx.fillStyle=hz;ctx.fillRect(0,0,W,H);
      }
    }
    const fade=ctx.createLinearGradient(0,H*0.50,0,H);
    fade.addColorStop(0,'rgba(60,70,80,0)');
    fade.addColorStop(1,'rgba(48,58,70,0.34)');
    ctx.fillStyle=fade;ctx.fillRect(0,H*0.50,W,H*0.50);
  }

  if(th.crown==='round'&&th.fringe!=='#ff2fd0'&&bgReady){
    // Two passes of the same plate at different scales and speeds: a hazy far layer
    // and a sharper near one, so it still parallaxes rather than sitting flat.
    const iw=BG_FOREST.width, ih=BG_FOREST.height;
    for(let L=0;L<2;L++){
      const sc=L?0.42:0.20;                       // parallax rate
      const dh=L?H*1.02:H*0.86;                   // near layer drawn bigger
      const dw=Math.ceil(dh*(iw/ih));
      const yTop=L?H-dh:H*0.06;
      if(L===0){ctx.globalAlpha=0.55;}            // far layer sits back in haze
      tilePlate(BG_FOREST,CX*sc,yTop,dw,dh);
      ctx.globalAlpha=1;
      if(L===0){                                  // haze between the two layers
        const hz=ctx.createLinearGradient(0,0,0,H);
        hz.addColorStop(0,'rgba(150,170,120,0.30)');
        hz.addColorStop(1,'rgba(24,44,30,0.42)');
        ctx.fillStyle=hz;ctx.fillRect(0,0,W,H);
      }
    }
    // darken toward the ground so the terrain reads against it
    const fade=ctx.createLinearGradient(0,H*0.45,0,H);
    fade.addColorStop(0,'rgba(12,26,18,0)');
    fade.addColorStop(1,'rgba(10,22,15,0.55)');
    ctx.fillStyle=fade;ctx.fillRect(0,H*0.45,W,H*0.55);
  }
  else if(th.crown==='round'&&th.fringe!=='#ff2fd0'){
    const gx=W*0.58-((CX*0.10)%(W*1.6)), gy=H*0.30;
    // the sun itself, low and behind the trunks
    const core=ctx.createRadialGradient(gx,gy,4,gx,gy,H*0.22);
    core.addColorStop(0,'rgba(255,247,214,0.95)');
    core.addColorStop(0.45,'rgba(255,222,132,0.55)');
    core.addColorStop(1,'rgba(255,206,106,0)');
    ctx.fillStyle=core;ctx.fillRect(0,0,W,H);
    const glow=ctx.createRadialGradient(gx,gy,20,gx,gy,H*1.05);
    glow.addColorStop(0,'rgba(255,231,150,0.62)');
    glow.addColorStop(0.30,'rgba(232,192,98,0.30)');
    glow.addColorStop(0.62,'rgba(150,170,80,0.12)');
    glow.addColorStop(1,'rgba(110,140,66,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    // haze bands: a warm one high where the light sits, a cool one low, so the
    // depth layers separate instead of stacking into one flat green wall
    const haze=ctx.createLinearGradient(0,0,0,H);
    haze.addColorStop(0.00,'rgba(196,214,140,0.30)');
    haze.addColorStop(0.34,'rgba(150,186,110,0.20)');
    haze.addColorStop(0.68,'rgba(30,62,40,0.30)');
    haze.addColorStop(1.00,'rgba(12,30,20,0.46)');
    ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);
    // GOD RAYS -- slanted shafts, drifting slowly with the camera
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<11;i++){
      const seed=i*137.5, sx2=((seed*7+ -CX*0.16)%(W+520))-260;
      const wtop=16+((i*53)%30), wbot=52+((i*71)%70);
      const lean=64+((i*29)%70);
      // rays fade with distance from the sun, so the light reads as coming FROM it
      const dist=Math.min(1,Math.abs((sx2+lean*0.5)-gx)/(W*0.85));
      const a2=(0.055-dist*0.036)+((i*17)%9)*0.004+Math.sin(P.time*0.006+i)*0.008;
      ctx.fillStyle='rgba(255,240,186,'+Math.max(0,a2).toFixed(3)+')';
      ctx.beginPath();
      ctx.moveTo(sx2,-20);ctx.lineTo(sx2+wtop,-20);
      ctx.lineTo(sx2+wtop+lean+wbot,H*0.92);ctx.lineTo(sx2+lean,H*0.92);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
    // CANOPY across the top: overlapping leaf clumps, two depths
    // CANOPY. Smooth single-tone circles floating in the sky read as clouds, which is
    // exactly what these looked like. Foliage needs to be a continuous mass hanging
    // from the top edge, with ragged leaf clumps rather than clean arcs.
    for(let L=0;L<2;L++){
      const sc=L?0.30:0.16;
      const dk=L?'#0f2a1a':'#0a1d12', md=L?'#17402a':'#102a1c', lt=L?'#255c39':'#17402a';
      const hang=L?96:64;                       // how far the mass reaches down
      // the solid band it hangs from -- no gap to the top of the screen
      ctx.fillStyle=dk;ctx.fillRect(0,-10,W,hang*0.42);
      // Same jagged clumps as the tree canopies. This band was still using arcs, which
      // is why circles kept showing up at the top of the screen no matter what else
      // changed -- there are TWO foliage systems and only one had been fixed.
      const rag=(cx2,cy2,rr,fill,sd)=>{
        ctx.fillStyle=fill;ctx.beginPath();
        const N=10;
        for(let q=0;q<N;q++){
          const a3=q/N*6.283;
          const w2=0.70+((((q*29+sd)%19)/19))*0.58;
          const px2=cx2+Math.cos(a3)*rr*w2, py2=cy2+Math.sin(a3)*rr*w2*0.78;
          q?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
        }
        ctx.closePath();ctx.fill();
      };
      for(let i=0;i<46;i++){
        const bx=((i*97+ -CX*sc)%(W+300))-150;
        const drop=hang*(0.42+((i*29)%40)/88);
        const r2=18+((i*37)%34);
        const sd=(i*53)%97;
        rag(bx,drop,r2,dk,sd);
        rag(bx+r2*0.6,drop-r2*0.28,r2*0.7,dk,sd+11);
        rag(bx,drop-3,r2*0.84,md,sd+23);
        rag(bx-r2*0.2,drop-r2*0.44,r2*0.44,lt,sd+37);
        for(let q=0;q<8;q++){
          const a3=0.4+q*0.32, rr=r2*(1.0+((q*13)%4)*0.08);
          ctx.fillStyle=(q%3)?md:dk;
          ctx.fillRect(Math.round(bx+Math.cos(a3)*rr),Math.round(drop+Math.sin(a3)*rr*0.78),4,4);
        }
      }
    }
    // motes drifting in the light
    ctx.fillStyle='rgba(255,244,190,0.55)';
    for(let i=0;i<34;i++){
      const mx=((i*197+ -CX*0.22+Math.sin(P.time*0.008+i)*26)%(W+120))-60;
      const my=(H*0.16)+((i*89)%Math.round(H*0.62))+Math.sin(P.time*0.013+i*1.7)*12;
      ctx.fillRect(Math.round(mx),Math.round(my),2,2);
    }
  }

  for(const d of decor){
    const px=Math.round(d.x-CX*d.s),py=Math.round(240-CY*d.s);
    if(px<-100||px>W+100)continue;
    const col=d.s<.4?th.far:th.near;
    // 'none' means no decor at all. Without this it falls through the whole chain to
    // the final else, which draws forest trees -- that branch is the default for any
    // crown the code does not recognise.
    if(th.crown==='none'){
      continue;
    }
    if(th.crown==='crowd'&&streetReady){
      continue;                                   // the painted plate is the street now
    }else if(th.crown==='palm'&&beachReady){
      continue;                                   // the painted plate is the beach now
    }else if(th.crown==='palm'){
      // lean the trunk, then throw a few fronds off the top
      const lean=(d.k-0.5)*16, tw=Math.max(3,Math.round(d.w*0.22));
      ctx.fillStyle=col;
      for(let i=0;i<d.h;i++){
        const t=i/d.h;
        ctx.fillRect(Math.round(px+lean*t*t),py-i,tw,1);
      }
      ctx.fillRect(px,py,tw,520);
      const tx=px+lean+tw/2, ty=py-d.h;
      for(let f2=0;f2<6;f2++){
        const ang=-2.7+f2*0.62+(d.k-0.5)*0.3, len=20+d.k*16;
        ctx.beginPath();ctx.moveTo(tx,ty);
        ctx.quadraticCurveTo(tx+Math.cos(ang)*len*0.6,ty+Math.sin(ang)*len*0.6-6,
                             tx+Math.cos(ang)*len,ty+Math.sin(ang)*len+7);
        ctx.lineWidth=3.2;ctx.strokeStyle=col;ctx.stroke();
      }
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(tx,ty,3.4,0,6.3);ctx.fill();
    }else if(th.crown==='crowd'){
      // spectators lining the route: heads, shoulders, the odd raised arm or flag
      const bw=Math.max(7,Math.round(d.w*0.5)), bx=px, byy=py-Math.round(d.h*0.22);
      const skin=['#c9905f','#8d5a34','#e0b184','#6d4326'][Math.floor(d.k*4)%4];
      const shirt=['#d8455f','#4ec2e8','#f0c24a','#8ad46b','#f08a3c','#a97fd0'][Math.floor(d.k*6)%6];
      ctx.fillStyle=shirt;ctx.fillRect(bx,byy,bw,d.h+520);              // body
      ctx.fillStyle=col;ctx.fillRect(bx,byy,2,d.h+520);                 // shaded edge
      ctx.fillStyle=skin;ctx.fillRect(bx+1,byy-Math.round(bw*0.9),bw-2,Math.round(bw*0.9));
      ctx.fillStyle=col;                                                 // hair
      ctx.fillRect(bx+1,byy-Math.round(bw*0.9),bw-2,Math.round(bw*0.34));
      if(d.k>0.62){                                                      // raised arm
        const ax2=bx+(d.k>0.8?bw:-3);
        ctx.fillStyle=skin;ctx.fillRect(ax2,byy-Math.round(bw*1.5),3,Math.round(bw*1.3));
        if(d.k>0.86){                                                    // and a flag
          ctx.fillStyle='#b08050';ctx.fillRect(ax2+1,byy-Math.round(bw*2.4),2,Math.round(bw*1.0));
          ctx.fillStyle=['#d8455f','#4ec2e8','#f0c24a'][Math.floor(d.k*3)%3];
          ctx.fillRect(ax2+3,byy-Math.round(bw*2.4),Math.round(bw*0.9),Math.round(bw*0.6));
        }
      }
    }else if(th.crown==='truss'){
      // a lighting rig: scaffold leg, a bar of cans, and a beam raking the room
      const tw=Math.max(4,Math.round(d.w*0.45)), tx=px+tw/2, ty=py-d.h;
      ctx.fillStyle=col;ctx.fillRect(px,ty,tw,d.h+520);
      for(let r2=0;r2<7;r2++)ctx.fillRect(px-2,ty+r2*46,tw+4,3);   // cross-bracing
      ctx.fillRect(px-16,ty-8,tw+32,7);                            // the bar
      const lit=['#ff3fa4','#57f0d0','#ffd24a','#8a5fff'][Math.floor(d.k*4)%4];
      for(let c2=-1;c2<=1;c2++){
        ctx.fillStyle=col;ctx.fillRect(tx+c2*13-4,ty-2,8,9);
        ctx.fillStyle=lit;ctx.fillRect(tx+c2*13-3,ty+6,6,3);
      }
      ctx.globalAlpha=0.13;ctx.fillStyle=lit;                      // the beam
      const sw=Math.sin(P.time*0.011+d.k*6.3)*90;
      ctx.beginPath();ctx.moveTo(tx-7,ty+8);ctx.lineTo(tx+7,ty+8);
      ctx.lineTo(tx+sw+58,ty+430);ctx.lineTo(tx+sw-58,ty+430);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
    }else if(th.crown==='jungle'){
      // buttressed trunk, broad drooping canopy, a vine or two hanging off it
      const tw=Math.max(5,Math.round(d.w*0.5)), tx=px+tw/2, ty=py-d.h;
      ctx.fillStyle=col;
      ctx.fillRect(px,py-d.h,tw,d.h+520);
      for(let i=0;i<5;i++){                      // buttress roots flaring at the base
        const fw=Math.round(tw*(1.9-i*0.3));
        ctx.fillRect(px-Math.round((fw-tw)/2),py-i*7,fw,8);
      }
      for(let f2=0;f2<7;f2++){                   // canopy fronds, drooping
        const ang=-2.9+f2*0.5+(d.k-0.5)*0.25, len=26+d.k*22;
        ctx.beginPath();ctx.moveTo(tx,ty);
        ctx.quadraticCurveTo(tx+Math.cos(ang)*len*0.55,ty+Math.sin(ang)*len*0.55-9,
                             tx+Math.cos(ang)*len,ty+Math.sin(ang)*len+13);
        ctx.lineWidth=5.5;ctx.strokeStyle=col;ctx.stroke();
      }
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(tx,ty-3,10+d.k*9,0,6.3);ctx.fill();
      if(d.k>0.45){                              // a vine dangling from the canopy
        const vx=tx+(d.k-0.5)*40, vl=40+d.k*70;
        ctx.strokeStyle=col;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(vx,ty+6);
        ctx.quadraticCurveTo(vx+9,ty+vl*0.6,vx-4,ty+vl);ctx.stroke();
        ctx.fillStyle=col;ctx.beginPath();ctx.arc(vx-4,ty+vl,3.2,0,6.3);ctx.fill();
      }
    }else if(th.crown==='round'&&th.fringe!=='#ff2fd0'&&bgReady){
      continue;                                   // the painted plate is the forest now
    }else{
      // A trunk with bark, branches, and a canopy built from overlapping clumps in
      // three tones. The old version was a rectangle with one circle on top, which is
      // why it read as a lollipop no matter what colour it was.
      const lit  = d.s<.4 ? '#1d4b32' : '#2b6b41';     // canopy, side facing the clearing
      const mid  = col;
      const dark = d.s<.4 ? '#0c2417' : '#12321f';
      // Bark is its own colour ramp. Drawing trunks in the canopy green made the
      // whole forest read as one flat mass with no depth between trunk and leaves.
      const bLit = d.s<.4 ? '#4a3324' : '#6b4a30';
      const bMid = d.s<.4 ? '#33231a' : '#4a3222';
      const bDrk = d.s<.4 ? '#1e150f' : '#2c1e15';
      const tw   = Math.max(4,Math.round(d.w*0.42));
      const tx   = px+Math.round(d.w/2);
      const ty   = py-d.h;
      // trunk: tapers upward, with bark striations and a root flare
      for(let yy=0;yy<d.h+520;yy++){
        const t2=yy/(d.h+520);
        // taper harder, and let the edge wander a pixel or two -- dead-straight sides
        // are what make a trunk read as a plank rather than a tree
        const wob=Math.round(Math.sin(yy*0.055+d.k*9)*1.6+Math.sin(yy*0.017+d.k*3)*2.2);
        const wNow=Math.max(3,Math.round(tw*(0.72+t2*1.15))+wob);
        const gy=ty+yy;
        ctx.fillStyle=bDrk;ctx.fillRect(tx-Math.round(wNow/2),gy,wNow,1);
        ctx.fillStyle=bMid;ctx.fillRect(tx-Math.round(wNow/2)+1,gy,Math.max(1,wNow-3),1);
        // Bark grain runs VERTICALLY. Banding it horizontally turned every trunk
        // into a ladder, which is exactly what it looked like.
        const half=Math.round(wNow/2);
        for(let gx2=-half+1;gx2<half-1;gx2+=3){
          const n2=((gx2*7+Math.round(d.k*90))%11+11)%11;
          if(n2<4){ctx.fillStyle=bDrk;ctx.fillRect(tx+gx2,gy,1,1);}
          else if(n2>8){ctx.fillStyle=bLit;ctx.fillRect(tx+gx2,gy,1,1);}
        }
        ctx.fillStyle=bLit;ctx.fillRect(tx+half-2,gy,1,1);       // lit edge
        ctx.fillStyle=bDrk;ctx.fillRect(tx-half,gy,1,1);         // shadow edge
      }
      // a couple of branches angling off toward the canopy
      for(let b2=0;b2<2;b2++){
        const dir=b2?1:-1, by2=ty+18+Math.round(d.k*26)+b2*22;
        ctx.fillStyle=bDrk;
        for(let i2=0;i2<16+d.k*10;i2++)
          ctx.fillRect(tx+dir*i2, by2-Math.round(i2*0.55), 2,2);
      }
      // canopy: five overlapping clumps, dark base then mid then a lit cap
      // An arc always reads as an arc no matter how many you stack -- that is why the
      // canopy looked like broccoli. Each clump is a jagged polygon instead, with the
      // radius wobbling point to point so no edge is ever a clean curve.
      const cr=20+d.k*16;
      const seed=Math.round(d.k*997);
      function clump(cx2,cy2,rr,fill){
        ctx.fillStyle=fill;ctx.beginPath();
        const N=11;
        for(let q=0;q<N;q++){
          const a3=q/N*6.283;
          const w2=0.74+(((q*31+seed)%17)/17)*0.52;      // ragged, not round
          const px2=cx2+Math.cos(a3)*rr*w2;
          const py2=cy2+Math.sin(a3)*rr*w2*0.82;
          q?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
        }
        ctx.closePath();ctx.fill();
      }
      const blobs=[[0,-4,cr],[-cr*0.88,5,cr*0.74],[cr*0.9,2,cr*0.78],
                   [-cr*0.42,-cr*0.66,cr*0.68],[cr*0.48,-cr*0.6,cr*0.64],
                   [0,-cr*0.9,cr*0.55]];
      for(const [ox,oy,rr] of blobs)clump(tx+ox,ty+oy+3,rr,dark);
      for(const [ox,oy,rr] of blobs)clump(tx+ox,ty+oy,rr*0.9,mid);
      for(const [ox,oy,rr] of blobs.slice(0,4))
        clump(tx+ox-rr*0.16,ty+oy-rr*0.34,rr*0.46,lit);
      for(let i2=0;i2<18;i2++){                          // scattered leaf pixels
        const a3=(i2*2.39+d.k*6.3), rr2=cr*(1.0+((i2*7)%5)*0.08);
        ctx.fillStyle=(i2%3)?mid:lit;
        ctx.fillRect(Math.round(tx+Math.cos(a3)*rr2),Math.round(ty+Math.sin(a3)*rr2*0.78-2),3,3);
      }
    }}

  // The ground used to be drawn a COLUMN AT A TIME: 760 screen columns x 4 bands =
  // ~3,040 one-pixel fillRects every frame, which is what made this choppy on slower
  // machines. Thousands of tiny fills do not batch -- each is its own draw call, so the
  // cost tracks how fast a GPU accepts commands, not how many pixels it can push.
  // Same picture, drawn as filled PATHS instead: the bands are grouped into runs where
  // the palette is constant, so it is typically 4-12 fills rather than 3,040. The
  // speckles stay as rects -- there are only ~80 and they carry the texture.
  const TSTEP=2;   // swept 1..6: 2 keeps deviation at antialiasing level
  const SY=new Int32Array(W+1);
  for(let sx=0;sx<=W;sx++)SY[sx]=Math.round(gAt(CX+sx)-CY);
  const palAt=wx=>{for(const z of surf)if(wx>z.a&&wx<z.b)return z.pal;return th;};
  let runA=0;
  while(runA<W){
    const pal=palAt(CX+runA);
    let runB=runA;
    while(runB+1<W&&palAt(CX+runB+1)===pal)runB++;
    const band=(top,hgt,col)=>{
      ctx.fillStyle=col;ctx.beginPath();
      // A vertex per screen column is far finer than the ground needs -- it is a smooth
      // profile, so TSTEP px between vertices is visually identical and costs a fraction
      // of the path building. The run ends are always exact so bands cannot gap.
      ctx.moveTo(runA,SY[runA]+top);
      for(let sx=runA+TSTEP;sx<runB+1;sx+=TSTEP)ctx.lineTo(sx,SY[sx]+top);
      ctx.lineTo(runB+1,SY[runB+1]+top);
      if(hgt===null){                       // the deep band runs to the bottom of screen
        ctx.lineTo(runB+1,H);ctx.lineTo(runA,H);
      }else{
        ctx.lineTo(runB+1,SY[runB+1]+top+hgt);
        for(let sx=runB+1-TSTEP;sx>runA;sx-=TSTEP)ctx.lineTo(sx,SY[sx]+top+hgt);
        ctx.lineTo(runA,SY[runA]+top+hgt);
      }
      ctx.closePath();ctx.fill();
    };
    band(33,null,pal.soil[3]);
    band(11,22,pal.soil[2]);
    band(3,8,pal.soil[1]);
    band(0,3,pal.soil[0]);
    runA=runB+1;
  }
  for(let sx=0;sx<W;sx++){                  // the sparse texture, unchanged
    const wx=CX+sx,sy=SY[sx];
    if(sy>H)continue;
    const pal=palAt(wx);
    if((wx*7919%41)===0){ctx.fillStyle=pal.grit;ctx.fillRect(sx,sy+1,1,2);}
    if(pal===th&&(wx%14)===0){ctx.fillStyle=pal.fringe;ctx.fillRect(sx,sy-2,1,2);}
    if(pal!==th&&(wx%96)===0){ctx.fillStyle='#6f6e69';ctx.fillRect(sx,sy,1,26);}}

  // WATER: filled per column between the surface and the ground beneath it, so it
  // sits in the basin instead of covering the terrain as a flat slab.
  for(const c of castles){
    const sx=Math.round(c.x-CX),sy=Math.round(c.y-CY);
    if(sx<-120||sx>W+120)continue;
    const w2=c.w/2, H0=c.h;
    const LIT='#e8c48d', BODY='#d9ae74', SHADE='#bb8d57', LINE='#9a6f42', DARK='#7d5733';
    // a heap of sand it is built on
    ctx.fillStyle=SHADE;
    for(let px=-w2-26;px<=w2+26;px++){
      const t=Math.abs(px)/(w2+26), lift=Math.round(13*(1-t*t));
      if(lift>0)ctx.fillRect(sx+px,sy-lift,1,lift+3);
    }
    // one tower: body, shaded side, lit edge, crenellated collar, conical roof
    const tower=(tx,tw,th)=>{
      const x0=Math.round(sx+tx-tw/2), yTop=Math.round(sy-th);
      ctx.fillStyle=BODY;ctx.fillRect(x0,yTop,tw,th);
      ctx.fillStyle=SHADE;ctx.fillRect(x0+tw-Math.max(3,tw*0.24),yTop,Math.max(3,tw*0.24),th);
      ctx.fillStyle=LIT;ctx.fillRect(x0,yTop,Math.max(2,tw*0.16),th);
      ctx.fillStyle=LINE;ctx.fillRect(x0,yTop,tw,1);
      // collar
      const cw=tw+6, cx0=Math.round(sx+tx-cw/2);
      ctx.fillStyle=BODY;ctx.fillRect(cx0,yTop-6,cw,6);
      ctx.fillStyle=LIT;ctx.fillRect(cx0,yTop-6,cw,1);
      ctx.fillStyle=LINE;ctx.fillRect(cx0,yTop-1,cw,1);
      // roof
      const rh=Math.round(tw*1.15), apex=yTop-6-rh;
      for(let i=0;i<rh;i++){
        const t=i/rh, hw=Math.max(1,Math.round((cw/2)*t));
        ctx.fillStyle= t<0.42?LIT:BODY;
        ctx.fillRect(Math.round(sx+tx)-hw,apex+i,hw*2,1);
        ctx.fillStyle=SHADE;ctx.fillRect(Math.round(sx+tx)+Math.round(hw*0.45),apex+i,Math.max(1,Math.round(hw*0.55)),1);
      }
      ctx.fillStyle=LINE;ctx.fillRect(Math.round(sx+tx)-Math.round(cw/2),apex+rh-1,cw,1);
      // window
      ctx.fillStyle=DARK;ctx.fillRect(Math.round(sx+tx)-2,yTop+Math.round(th*0.30),4,6);
    };
    // curtain wall between the towers
    const wallH=Math.round(H0*0.44);
    ctx.fillStyle=BODY;ctx.fillRect(sx-w2,sy-wallH,c.w,wallH);
    ctx.fillStyle=SHADE;ctx.fillRect(sx-w2,sy-wallH+Math.round(wallH*0.72),c.w,Math.round(wallH*0.28));
    ctx.fillStyle=LIT;ctx.fillRect(sx-w2,sy-wallH,c.w,2);
    for(let i=0;i<5;i++){                      // crenellations along the wall
      const bx=Math.round(sx-w2+2+i*((c.w-4)/5));
      ctx.fillStyle=BODY;ctx.fillRect(bx,sy-wallH-6,Math.round((c.w-4)/10),6);
      ctx.fillStyle=LIT;ctx.fillRect(bx,sy-wallH-6,Math.round((c.w-4)/10),1);
    }
    tower(-w2*0.74, Math.round(c.w*0.20), Math.round(H0*0.62));   // left
    tower( w2*0.74, Math.round(c.w*0.20), Math.round(H0*0.62));   // right
    tower( 0,       Math.round(c.w*0.26), Math.round(H0*0.80));   // centre, tallest
    // arched doorway
    const dw=Math.round(c.w*0.20), dh=Math.round(H0*0.26);
    ctx.fillStyle=DARK;
    ctx.fillRect(sx-dw/2,sy-dh,dw,dh);
    ctx.beginPath();ctx.arc(sx,sy-dh,dw/2,Math.PI,0);ctx.fill();
    ctx.fillStyle=LINE;ctx.fillRect(sx-dw/2-1,sy-dh,1,dh);ctx.fillRect(sx+dw/2,sy-dh,1,dh);
    // flag off the centre spire
    const fy=sy-Math.round(H0*0.80)-6-Math.round(c.w*0.26*1.15);
    ctx.fillStyle='#8f7a45';ctx.fillRect(sx-1,fy-15,2,15);
    ctx.fillStyle='#ff6b6b';ctx.fillRect(sx+1,fy-15,10,6);
  }

  for(const r of ramps){
    const ax=Math.round(r.a-CX), ay=Math.round(r.y0-CY);
    const bx=Math.round(r.b-CX), by=Math.round(r.y1-CY);
    if(bx<-90||ax>W+90)continue;
    if(r.wood){                                    // red steel kicker, lattice deck
      const span=r.b-r.a, RED='#d8352a', RLIT='#f2564a', RDK='#9d1f18';
      const surfY=x=>Math.round(rampYat(r,x)-CY);
      // shadow under the frame
      ctx.fillStyle='rgba(40,30,30,.16)';
      for(let px=0;px<=span+14;px++)ctx.fillRect(ax+px,Math.round(gAt(CX+r.a+px)-CY),1,3);
      // legs and cross-brace
      for(const f of [0.42,0.72,1.0]){
        const wx2=r.a+span*f, lx=Math.round(wx2-CX), ly=surfY(wx2), g=Math.round(gAt(wx2)-CY);
        if(g<=ly)continue;
        ctx.fillStyle=RDK;ctx.fillRect(lx-2,ly+4,4,g-ly-2);
        ctx.fillStyle=RED;ctx.fillRect(lx-2,ly+4,2,g-ly-2);
      }
      const bw=r.a+span*0.42, be=r.a+span*1.0;
      const byy=Math.round(gAt(r.b)-CY)-10;
      ctx.fillStyle=RDK;ctx.fillRect(Math.round(bw-CX),byy,Math.round(be-bw),3);
      // the deck: two rails with lattice between them
      let prev=null;
      for(let px=0;px<=span;px++){
        const wx2=r.a+px, y=surfY(wx2);
        ctx.fillStyle=RED;ctx.fillRect(ax+px,y,1,7);          // deck slab edge
        ctx.fillStyle=RLIT;ctx.fillRect(ax+px,y,1,2);         // lit top rail
        ctx.fillStyle=RDK;ctx.fillRect(ax+px,y+7,1,2);        // under-rail
        prev=y;
      }
      // lattice bars across the deck
      for(let px=4;px<span;px+=9){
        const wx2=r.a+px, y=surfY(wx2);
        ctx.fillStyle=RDK;ctx.fillRect(ax+px,y+1,1,6);
      }
      // diagonal bracing in the open frame
      ctx.strokeStyle=RDK;ctx.lineWidth=1.5;
      for(let px=6;px<span-8;px+=22){
        const wx2=r.a+px, y=surfY(wx2)+9, g=Math.round(gAt(wx2)-CY);
        if(g-y<8)continue;
        ctx.beginPath();ctx.moveTo(ax+px,y);ctx.lineTo(ax+px+20,g-2);ctx.stroke();
      }
      // the lip
      ctx.fillStyle=RLIT;ctx.fillRect(bx-3,surfY(r.b)-2,5,4);
      continue;
    }
    if(r.grind){                                   // steel handrail on posts
      for(let px=ax+10;px<bx-6;px+=64){
        const wx2=CX+px, ry=rampYat(r,wx2), g=gAt(wx2);
        ctx.fillStyle='#3f4952';ctx.fillRect(px,Math.round(ry-CY)+4,3,Math.max(0,Math.round(g-ry)));
      }
      for(const px of [ax,bx-3]){
        const wx2=CX+px, ry=rampYat(r,wx2), g=gAt(wx2);
        ctx.fillStyle='#3f4952';ctx.fillRect(px-1,Math.round(ry-CY)-16,4,Math.max(0,Math.round(g-ry))+16);
      }
      for(let px=Math.max(0,ax);px<Math.min(W,bx);px++){
        const ry=Math.round(rampYat(r,CX+px)-CY);
        ctx.fillStyle='#2f383f';ctx.fillRect(px,ry+3,1,4);
        ctx.fillStyle='#8e98a2';ctx.fillRect(px,ry,1,3);
        ctx.fillStyle='#d6dee6';ctx.fillRect(px,ry,1,1);
      }
      continue;
    }
    // the pail, propping up the high end
    const pw=40,ph=PAIL_H;
    ctx.fillStyle='#d94f43';ctx.fillRect(bx-pw/2+3,by+4,pw-6,ph);
    ctx.fillStyle='#f2695c';ctx.fillRect(bx-pw/2+3,by+4,7,ph);
    ctx.fillStyle='#a83a30';ctx.fillRect(bx+pw/2-10,by+4,7,ph);
    ctx.fillStyle='#ffd24a';ctx.fillRect(bx-pw/2,by,pw,6);       // rim
    ctx.strokeStyle='#a83a30';ctx.lineWidth=2;                    // handle
    ctx.beginPath();ctx.arc(bx,by+2,pw*0.46,Math.PI*1.08,Math.PI*1.92);ctx.stroke();
    // the shovel, laid along the ramp line
    const ang=Math.atan2(by-ay,bx-ax);
    ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);
    const L=Math.hypot(bx-ax,by-ay);
    ctx.fillStyle='#c9a05c';ctx.fillRect(0,-5,L*0.62,6);          // wooden handle
    ctx.fillStyle='#e0b877';ctx.fillRect(0,-5,L*0.62,2);
    ctx.fillStyle='#9aa4ad';ctx.fillRect(L*0.60,-8,L*0.40,9);      // metal blade
    ctx.fillStyle='#cfd8df';ctx.fillRect(L*0.60,-8,L*0.40,3);
    ctx.fillStyle='#79838c';ctx.fillRect(L*0.60,-1,L*0.40,2);
    ctx.fillStyle='#c9a05c';ctx.fillRect(-9,-8,10,12);            // grip at the bottom
    ctx.restore();
    ctx.fillStyle='rgba(120,100,60,.25)';                          // sand packed under it
    for(let px=ax;px<bx;px++){
      const t=(px-ax)/(bx-ax), ry=ay+(by-ay)*t, gy=Math.round(gAt(CX+px)-CY);
      if(gy>ry+4)ctx.fillRect(px,ry+4,1,Math.min(10,gy-ry-4));
    }
  }

  for(const U of umbs){
    const sx=Math.round(U.x-CX), sy=Math.round(U.y-CY);
    if(sx<-140||sx>W+140)continue;
    const g=Math.round(gAt(U.x)-CY);
    const sq=U.hit?Math.min(1,U.hit/10):0;
    const rr=U.r*(1+sq*0.10), hh=U.h*(1-sq*0.45);
    ctx.fillStyle='#9aa0a6';ctx.fillRect(sx-2,sy+2,4,Math.max(0,g-U.y));   // pole
    ctx.fillStyle='#c8ced4';ctx.fillRect(sx-2,sy+2,1,Math.max(0,g-U.y));
    ctx.fillStyle='#6f7378';ctx.fillRect(sx-9,g-3,18,4);                   // foot in the sand
    // canopy: red and white wedges over a dome
    for(let px=-Math.ceil(rr);px<=Math.ceil(rr);px++){
      const t=px/rr, dip=Math.sqrt(Math.max(0,1-t*t));
      const top=Math.round(sy-hh*dip);
      const seg=Math.floor((t+1)*3);
      ctx.fillStyle=(seg%2)?'#e8443c':'#fdfdf6';
      ctx.fillRect(sx+px,top,1,Math.round(hh*dip)+6);
      ctx.fillStyle='rgba(0,0,0,.10)';ctx.fillRect(sx+px,top+Math.round(hh*dip)+3,1,3);
    }
    ctx.fillStyle='#b8352e';ctx.fillRect(sx-Math.ceil(rr),sy+4,Math.ceil(rr)*2,2);  // rim
    ctx.fillStyle='#9aa0a6';ctx.fillRect(sx-1,sy-Math.round(hh)-7,2,8);             // finial
  }

  // the stage the booth stands on: lit front edge, skirt, scaffold legs
  for(const st of stages){
    const sx=Math.round(st.a-CX), ex=Math.round(st.b-CX), sy=Math.round(st.y-CY);
    if(ex<-60||sx>W+60)continue;
    const w2=ex-sx;
    ctx.fillStyle='#0a0610';ctx.fillRect(sx,sy+12,w2,240);          // the skirt
    ctx.fillStyle='#160e22';ctx.fillRect(sx,sy+12,w2,5);
    for(let lx=sx+26;lx<ex-10;lx+=76){                               // scaffold legs
      ctx.fillStyle='#1d1430';ctx.fillRect(lx,sy+18,7,210);
      for(let r2=0;r2<5;r2++)ctx.fillRect(lx-4,sy+34+r2*42,15,3);
    }
    ctx.fillStyle='#ff2fd0';ctx.globalAlpha=.75;                     // lit front edge
    ctx.fillRect(sx,sy+9,w2,3);ctx.globalAlpha=1;
    for(let bx=sx+8;bx<ex-8;bx+=34){                                 // strip along the lip
      ctx.fillStyle=((bx>>5)+Math.round(P.time*0.04))%2?'#57f0d0':'#ff5fc8';
      ctx.fillRect(bx,sy+14,10,2);
    }
  }

  // THE BOOTH: two platters set into the floor with the mixer between them, the way a
  // real pair of decks sits. Cyan drives you, magenta drags.
  for(const pl of platters){
    const sx=Math.round(pl.x-CX), gy=Math.round(gAt(pl.x)-CY), rr=Math.round((pl.b-pl.a)/2);
    if(sx<-760||sx>W+760)continue;
    const glow=pl.dir>0?'#57f0d0':'#ff5fc8';
    ctx.fillStyle='#0c0812';ctx.fillRect(sx-rr-14,gy,rr*2+28,14);        // plinth
    ctx.fillStyle='#1b1426';ctx.fillRect(sx-rr-14,gy-2,rr*2+28,3);
    ctx.globalAlpha=.5;ctx.fillStyle=glow;
    ctx.fillRect(sx-rr-14,gy+12,rr*2+28,2);ctx.globalAlpha=1;            // underlight
    for(let px=-rr;px<=rr;px++){                                         // the vinyl
      const t=Math.abs(px)/rr;
      ctx.fillStyle = t>0.97 ? glow : t<0.17 ? '#c8402c'
        : ((((px+Math.round(pl.spin*10))%11)+11)%11<6 ? '#141019' : '#1d1724');
      ctx.fillRect(sx+px,gy-3,1,4);
    }
    const lb=Math.round(rr*0.17);
    ctx.fillStyle='#e6d9bd';ctx.fillRect(sx-lb,gy-3,lb*2,4);             // label
    ctx.fillStyle='#a83424';
    ctx.fillRect(sx+Math.round(Math.sin(pl.spin)*lb*0.72)-2,gy-3,4,4);
    ctx.fillStyle='#c9cdd4';ctx.fillRect(sx-1,gy-4,2,2);                 // spindle
    ctx.strokeStyle='#b9bec6';ctx.lineWidth=2;                           // tonearm
    ctx.beginPath();ctx.moveTo(sx+rr-6,gy-9);ctx.lineTo(sx+Math.round(rr*0.28),gy-6);ctx.stroke();
    ctx.fillStyle='#8d939b';ctx.fillRect(sx+rr-10,gy-13,8,7);
    ctx.fillStyle=glow;ctx.fillRect(sx+Math.round(rr*0.28)-2,gy-7,4,3);
    ctx.fillStyle='#2a2233';ctx.fillRect(sx-rr-9,gy+2,5,9);              // pitch fader
    ctx.fillStyle=glow;ctx.fillRect(sx-rr-9,gy+4+(pl.dir>0?4:0),5,2);
  }
  for(const lp of laptops){                          // the laptop, seen from behind
    const sx=Math.round(lp.a-CX), rx=Math.round(lp.rise-CX), ex=Math.round(lp.b-CX);
    const ty=Math.round(lp.y-CY), by=Math.round(lp.base-CY);
    if(ex<-90||sx>W+90)continue;
    // the base, sticking out either side of the lid
    ctx.fillStyle='#5f6771';ctx.fillRect(sx-14,by-13,(ex-sx)+30,13);
    ctx.fillStyle='#828b96';ctx.fillRect(sx-14,by-15,(ex-sx)+30,3);
    ctx.fillStyle='#3d444d';ctx.fillRect(sx-14,by-1,(ex-sx)+30,2);       // shadow line
    // THE LID from behind: a broad silver panel, flat across the top
    ctx.fillStyle='#9ba4af';ctx.fillRect(rx-2,ty+3,(ex-rx)+4,by-13-ty);
    ctx.fillStyle='#b6bfc9';ctx.fillRect(rx-2,ty+3,(ex-rx)+4,4);          // lit top face
    ctx.fillStyle='#c9d2dc';ctx.fillRect(rx-2,ty,(ex-rx)+4,3);            // the grind edge
    ctx.fillStyle='#7d8794';                                              // rounded corners
    ctx.fillRect(rx-2,ty,3,3);ctx.fillRect(ex-1,ty,3,3);
    ctx.fillStyle='#868f9b';                                              // the ramp onto it
    ctx.beginPath();ctx.moveTo(sx,by-13);ctx.lineTo(rx,ty+3);
    ctx.lineTo(rx,by-13);ctx.closePath();ctx.fill();
    ctx.fillStyle='#a7b0bb';
    ctx.beginPath();ctx.moveTo(sx,by-13);ctx.lineTo(rx,ty+3);
    ctx.lineTo(rx,ty+6);ctx.lineTo(sx,by-10);ctx.closePath();ctx.fill();
    // the apple-ish glow on the back of the lid
    const cx2=Math.round((rx+ex)/2), cy2=Math.round(ty+(by-13-ty)*0.45);
    ctx.globalAlpha=.75;ctx.fillStyle='#e6f4ff';
    ctx.fillRect(cx2-5,cy2-6,10,11);ctx.fillRect(cx2-2,cy2-9,4,3);
    ctx.globalAlpha=1;
    // screen light spilling forward past both edges of the lid

    ctx.fillRect(rx-9,ty+5,7,by-16-ty);ctx.fillRect(ex+2,ty+5,7,by-16-ty);
    ctx.globalAlpha=1;
  }







  for(const L of loops){
    const sx=Math.round(L.cx-CX),sy=Math.round(L.cy-CY);
    if(sx<-260||sx>W+260)continue;
    const g=Math.round(gAt(L.cx)-CY);
    ctx.fillStyle='#4a4038';                       // uprights holding it up
    ctx.fillRect(sx-L.r-5,sy,5,Math.max(0,g-sy));
    ctx.fillRect(sx+L.r,sy,5,Math.max(0,g-sy));
    ctx.strokeStyle='#3b332c';ctx.lineWidth=13;    // the track bed
    ctx.beginPath();ctx.arc(sx,sy,L.r,0,6.3);ctx.stroke();
    ctx.strokeStyle='#8a7255';ctx.lineWidth=9;
    ctx.beginPath();ctx.arc(sx,sy,L.r,0,6.3);ctx.stroke();
    ctx.strokeStyle='#c2a678';ctx.lineWidth=2;     // lit inner edge you ride on
    ctx.beginPath();ctx.arc(sx,sy,L.r-3,0,6.3);ctx.stroke();
    ctx.strokeStyle='#6d5c46';ctx.lineWidth=2;
    for(let k=0;k<16;k++){                          // cross ties
      const a2=k*0.3927;
      ctx.beginPath();
      ctx.moveTo(sx+Math.cos(a2)*(L.r-5),sy+Math.sin(a2)*(L.r-5));
      ctx.lineTo(sx+Math.cos(a2)*(L.r+5),sy+Math.sin(a2)*(L.r+5));
      ctx.stroke();
    }
  }


  drawProps('back');

  for(const rl of rails){
    const sx=Math.round(rl.a-CX),ex=Math.round(rl.b-CX),sy=Math.round(rl.y-CY);
    if(ex<-20||sx>W+20)continue;
    for(let px=sx+18;px<ex-10;px+=70){           // posts down to whatever is below
      const wx2=CX+px,ry=railYat(rl,wx2),g=gAt(wx2);
      ctx.fillStyle='#4a5560';ctx.fillRect(px,Math.round(ry-CY)+4,3,Math.max(0,Math.round(g-ry)));
    }
    // a kinked upright at each end, like a real handrail
    for(const [ex2,yy] of [[sx,railYat(rl,rl.a)],[ex,railYat(rl,rl.b)]]){
      const gg=gAt(CX+ex2);
      ctx.fillStyle='#4a5560';ctx.fillRect(ex2-1,Math.round(yy-CY),4,Math.max(0,Math.round(gg-yy)));
    }
    for(let px=Math.max(0,sx);px<Math.min(W,ex);px++){
      const ry=Math.round(railYat(rl,CX+px)-CY);
      ctx.fillStyle='#39434d';ctx.fillRect(px,ry+3,1,4);
      ctx.fillStyle='#aab4bf';ctx.fillRect(px,ry,1,3);
      ctx.fillStyle='#e6edf3';ctx.fillRect(px,ry,1,1);
    }
    ctx.fillStyle='#5d6a76';
    ctx.fillRect(sx-3,Math.round(railYat(rl,rl.a)-CY)-2,4,9);
    ctx.fillRect(ex-1,Math.round(railYat(rl,rl.b)-CY)-2,4,9);
  }

  for(const bt of boats){
    const bob=Math.sin(P.time*0.035+bt.x*0.01)*2.5, tilt=Math.sin(P.time*0.028+bt.x*0.01)*0.05;
    const sx=Math.round(bt.x-CX), sy=Math.round(bt.y-CY+bob);
    if(sx<-160||sx>W+160)continue;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(tilt);
    ctx.fillStyle='#8a5a34';                       // hull
    ctx.beginPath();ctx.moveTo(-46,-14);ctx.lineTo(46,-14);
    ctx.lineTo(30,10);ctx.lineTo(-32,10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#a9724a';
    ctx.beginPath();ctx.moveTo(-46,-14);ctx.lineTo(46,-14);ctx.lineTo(44,-9);ctx.lineTo(-44,-9);ctx.closePath();ctx.fill();
    ctx.fillStyle='#efe4cf';ctx.fillRect(-40,-12,80,3);   // gunwale stripe
    ctx.fillStyle='#6d4527';ctx.fillRect(-14,-24,4,12);   // cabin
    ctx.fillRect(-16,-26,26,4);
    ctx.fillStyle='#c9a05c';ctx.fillRect(11,-72,3,60);    // mast
    ctx.fillStyle='#fdfdf6';                              // sail
    ctx.beginPath();ctx.moveTo(14,-70);ctx.lineTo(14,-20);ctx.lineTo(44,-22);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8443c';
    ctx.beginPath();ctx.moveTo(14,-70);ctx.lineTo(14,-52);ctx.lineTo(31,-56);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8f7a45';ctx.fillRect(11,-78,2,8);
    ctx.fillStyle='#e8443c';ctx.fillRect(13,-78,9,5);     // pennant
    ctx.restore();
  }

  for(const w of waters){
    const sx=Math.round((w.va!==undefined?w.va:w.a)-CX),
          ex=Math.round((w.vb!==undefined?w.vb:w.b)-CX),
          sy=Math.round(w.y-CY);
    if(ex<0||sx>W||sy>H)continue;
    for(let px=Math.max(0,sx);px<Math.min(W,ex);px++){
      const g=gAt(CX+px);
      if(g>w.y){
        ctx.fillStyle='rgba(48,140,175,.60)';ctx.fillRect(px,sy,1,Math.round(g-w.y)+2);
        ctx.fillStyle='rgba(120,215,240,.25)';ctx.fillRect(px,sy,1,4);
      }
    }
    for(let px=Math.max(0,sx);px<Math.min(W,ex);px++){
      if(gAt(CX+px)<=w.y)continue;
      const wob=Math.sin((CX+px)*0.055+P.time*0.05)*1.6+Math.sin((CX+px)*0.017-P.time*0.03)*1.2;
      ctx.fillStyle='#8fe0f4';ctx.fillRect(px,Math.round(sy+wob),1,2);
      if(((CX+px)*7919%53)===0){ctx.fillStyle='#d9f7ff';ctx.fillRect(px,Math.round(sy+wob)-2,2,1);}
    }
  }

  // marker boards: tells you what is coming while you still have room to choose a speed
  for(const j of jumps){
    const bx=j.start-260;
    const sx=Math.round(bx-CX),sy=Math.round(gAt(bx)-CY);
    if(sx<-40||sx>W+40)continue;
    const col={s:'#6dbf5c',m:'#e8c14a',l:'#e88a3c',p:'#e8566c',d:'#9f7cf0',j:'#5fd0e8',k:'#5fd0e8',u:'#f0c24a',w:'#49c8f0',g:'#d0d6de',D:'#e8c98a',b:'#ff7f6b',S:'#b9b7ae',R:'#7fd06b',v:'#f0d264',y:'#4ec2e8',F:'#f0862a',G:'#8ad46b','2':'#f04a7a',n:'#a97fd0',L:'#c9a227',A:'#e8a33c',c:'#d8455f',C:'#b5304a',T:'#ff3fa4',P:'#ff9f4a',O:'#e85fd0',W:'#c9a227',X:'#f0662a',U:'#e8443c',H:'#8ad46b',B:'#3fa8d0'}[j.kind];
    const n ={s:1,m:2,l:3,p:3,d:2,j:2,k:1,u:3,w:2,g:2,D:1,b:1,S:2,R:2,v:2,y:2,F:2,G:3,'2':2,n:3,L:2,A:2,c:2,C:3,T:2,P:3,O:2,W:2,X:3,U:2,H:2,B:3}[j.kind];
    ctx.fillStyle='#4a3520';ctx.fillRect(sx-1,sy-34,3,34);
    ctx.fillStyle='#1a2b1e';ctx.fillRect(sx-13,sy-50,28,18);
    ctx.fillStyle=col;ctx.fillRect(sx-11,sy-48,24,14);
    ctx.fillStyle='#12261d';
    if(j.kind==='g'){                      // bar = rail
      ctx.fillRect(sx-11,sy-43,22,3);
      ctx.fillRect(sx-8,sy-40,2,4);ctx.fillRect(sx+6,sy-40,2,4);
    }else if(j.kind==='w'){                // wave = water gap
      ctx.beginPath();
      for(let q=0;q<=16;q++){const wx2=sx-8+q,wy=sy-42+Math.sin(q*0.8)*2.2;
        if(q===0)ctx.moveTo(wx2,wy);else ctx.lineTo(wx2,wy);}
      ctx.lineTo(sx+8,sy-37);ctx.lineTo(sx-8,sy-37);ctx.closePath();ctx.fill();
    }else if(j.kind==='u'){                // up-arrow = step up
      ctx.beginPath();ctx.moveTo(sx,sy-47);ctx.lineTo(sx-6,sy-40);ctx.lineTo(sx+6,sy-40);
      ctx.closePath();ctx.fill();ctx.fillRect(sx-2,sy-41,4,5);
    }else if(j.kind==='j'||j.kind==='k'){  // gap symbol = built dirt jump
      ctx.fillRect(sx-10,sy-44,5,8);ctx.fillRect(sx+5,sy-44,5,8);
      ctx.fillRect(sx-3,sy-40,6,2);
    }else if(j.kind==='d'){                // twin peaks = an M
      ctx.beginPath();ctx.moveTo(sx-9,sy-38);ctx.lineTo(sx-5,sy-46);ctx.lineTo(sx-1,sy-38);
      ctx.lineTo(sx+3,sy-46);ctx.lineTo(sx+7,sy-38);ctx.lineTo(sx+7,sy-37);ctx.lineTo(sx-9,sy-37);
      ctx.closePath();ctx.fill();

        ctx.moveTo(sx-6+i*9,sy-38);ctx.lineTo(sx-2+i*9,sy-45);ctx.lineTo(sx+2+i*9,sy-38);

    const sx=Math.round(c.x-CX),sy=Math.round(c.y-CY);

    ctx.fillStyle=c.hit?'#9ff0c0':'#5f7a66';ctx.fillRect(sx+1,sy-28,13,8);}

  {const sx=Math.round(FINISH-CX),sy=Math.round(gAt(FINISH)-CY);
   if(sx>-60&&sx<W+60){ctx.fillStyle='#e8f0d8';ctx.fillRect(sx-1,sy-62,3,62);
    for(let r=0;r<4;r++)for(let q=0;q<5;q++){
      ctx.fillStyle=((r+q)%2)?'#f2f6e8':'#20301f';
      ctx.fillRect(sx+2+q*7,sy-62+r*7,7,7);}}}

  for(const d of dust){ctx.globalAlpha=Math.max(0,1-d.t/d.life)*.5;
    ctx.fillStyle='#b58f60';ctx.fillRect(Math.round(d.x-CX),Math.round(d.y-CY),2,2);}
  ctx.globalAlpha=1;

  // smooth the DRAWN height only -- physics is untouched. Harmless 1-2px micro-hops
  // on descents were reading as the pod juddering along.
  if(P.smY===undefined||Math.abs(P.smY-P.y)>26)P.smY=P.y;
  P.smY+=(P.y-P.smY)*(P.ground?0.45:1);
  // the ghost of your best run, replayed frame-for-frame
  const gh=ghost[levelIdx];
  if(gh&&started&&!P.practice){
    const fr=Math.min(Math.floor(P.time),(gh.length/3|0)-1);
    if(fr>=0){
      const gx=gh[fr*3], gy=gh[fr*3+1], gr=gh[fr*3+2];
      const sx=Math.round(gx-CX), sy=Math.round(gy-CY);
      if(sx>-60&&sx<W+60){
        // The ghost used to draw in the CURRENT POD's colours at 0.38 alpha. That was
        // survivable with a mid-brown pod; with DAIRY COW (near-white) it washed out
        // to nothing against the bright beach and city plates. It now has its own
        // fixed cool tint and a dark outline, so it reads on any background.
        ctx.save();ctx.translate(sx,sy);ctx.rotate(gr);
        ctx.globalAlpha=0.30;
        ctx.fillStyle='#0a1a24';ctx.beginPath();ctx.ellipse(0,0,R+1.5,R+1.5,0,0,6.3);ctx.fill();
        ctx.globalAlpha=0.62;
        ctx.fillStyle='#7fb4d6';ctx.beginPath();ctx.ellipse(0,0,R,R,0,0,6.3);ctx.fill();
        ctx.fillStyle='#bfe2f5';ctx.beginPath();ctx.ellipse(0,-1,R-2.5,R-2.5,0,0,6.3);ctx.fill();
        ctx.strokeStyle='#123448';ctx.lineWidth=1.3;
        for(let i=-2;i<=2;i++){const px=i*(R/3);
          ctx.beginPath();ctx.moveTo(px,-R*0.8);ctx.lineTo(px,R*0.8);ctx.stroke();}
        ctx.lineWidth=1.6;ctx.strokeStyle='#0a1a24';
        ctx.beginPath();ctx.ellipse(0,0,R,R,0,0,6.3);ctx.stroke();
        ctx.restore();
        ctx.globalAlpha=1;
      }
    }
  }

  drawProps('front');
  if(editing)drawEditor();
  if(!P.tube)pod(Math.round(P.x-CX),Math.round(P.smY-CY));   // invisible inside the slide

  for(const f of fx){ctx.globalAlpha=Math.max(0,1-f.t/50);
    ctx.font='bold 12px Verdana,sans-serif';ctx.textAlign='center';
    ctx.fillStyle='#0a1410';ctx.fillText(f.text,f.x-CX+1,f.y-CY+1);
    ctx.fillStyle=f.col;ctx.fillText(f.text,f.x-CX,f.y-CY);
    ctx.textAlign='left';ctx.globalAlpha=1;}
  // The HUD used to draw over the pod picker -- speed meter, timer, attempt count and
  // the ROAD AHEAD panel, all on top of the selection screen. None of it means anything
  // before you start.
  if(!started)startScreen();
  else if(!building)hud();
  drawSongToast();
}

function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
let blurCv=null, blurCtx=null;
function backdrop(){
  // A flat scrim was already here at 88%, but the remaining 12% of a high-contrast
  // prop is still a HARD EDGE, and hard edges are what read as clutter -- signs and
  // crates were cutting through the card row. Turning the scrim up just flattens the
  // scene to black. Blurring the world first destroys the edges while keeping the
  // colour and depth, which is what the menu wants behind it.
  if(typeof ctx.filter==='string'){
    if(!blurCv){
      blurCv=document.createElement('canvas');blurCv.width=W;blurCv.height=H;
      blurCtx=blurCv.getContext('2d');
    }
    blurCtx.clearRect(0,0,W,H);
    blurCtx.drawImage(cv,0,0);
    ctx.save();ctx.filter='blur(8px)';
    ctx.drawImage(blurCv,-14,-14,W+28,H+28);   // overdraw, or the blur pulls in the
    ctx.restore();                              // transparent edge as a dark halo
  }
  ctx.fillStyle='rgba(8,18,14,.62)';ctx.fillRect(0,0,W,H);
  // darker top and bottom so the title and the key hints sit on something quiet
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(4,10,8,.75)');
  g.addColorStop(0.42,'rgba(4,10,8,.15)');
  g.addColorStop(1,'rgba(4,10,8,.80)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // vignette, to pull the eye to the middle of the row
  const v=ctx.createRadialGradient(W/2,H*0.45,90,W/2,H*0.45,W*0.62);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function startScreen(){
  backdrop();
  // hud() used to set these every frame and no longer runs on this screen, so the
  // start screen must not inherit whatever the last draw left behind
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='bold 26px Verdana,sans-serif';
  ctx.fillStyle='#0a1410';ctx.fillText('ISOPOD RIDER',W/2+2,H/2-152);
  ctx.fillStyle='#ffcf9a';ctx.fillText('ISOPOD RIDER',W/2,H/2-154);
  ctx.font='bold 11px Verdana,sans-serif';
  ctx.fillStyle='#7fa87f';ctx.fillText('pick your pod',W/2,H/2-124);

  // Few enough pods to fit on screen? Show them ALL in a fixed row and move the
  // highlight. The carousel re-centred the selection every press, which with three
  // pods meant the same three cards reshuffled instead of scrolling. Above five they
  // no longer fit, so the carousel comes back.
  // Every card is the SAME SIZE now. Scaling the selected one up made the row read as
  // ragged; a glow says "selected" without moving anything.
  const n=PODS.length, gap=150, y=H/2-28, ROW=n<=5;

  const shown = ROW ? PODS.map((_,i)=>i) : [-1,0,1].map(d=>((podIdx+d)%n+n)%n);
  shown.forEach((i,slot)=>{
    const off = ROW ? (slot-(n-1)/2) : (slot-1);
    const px=W/2+off*gap, p=PODS[i], sel=(i===podIdx), lock=!!p.locked;
    podSlots.push({i:i,x:px,y:y,w:CW,h:CH});
    ctx.save();
    if(sel){ctx.shadowColor='rgba(160,230,90,.55)';ctx.shadowBlur=16;}
    ctx.fillStyle=sel?'#1b2a1c':'#141d18';        // opaque, so nothing shows through
    rrect(px-CW/2,y-CH/2,CW,CH,10);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=sel?'#b6e85a':'#38503f';ctx.lineWidth=sel?2:1;
    rrect(px-CW/2+.5,y-CH/2+.5,CW-1,CH-1,10);ctx.stroke();

    ctx.save();ctx.translate(px,y-14);ctx.rotate(-0.25);
    ctx.globalAlpha=lock?0.5:1;
    const r=28;
    ctx.fillStyle=p.dk;ctx.beginPath();ctx.ellipse(0,0,r,r,0,0,6.3);ctx.fill();
    ctx.fillStyle=p.bd;ctx.beginPath();ctx.ellipse(0,-1,r-3.5,r-3.5,0,0,6.3);ctx.fill();
    ctx.strokeStyle=p.dk;ctx.lineWidth=1.8;ctx.lineCap='butt';
    for(let k=-3;k<=3;k++){const sx=k*(r/4.1),kk=1-Math.abs(k)/4.6;
      ctx.beginPath();ctx.moveTo(sx,-r*kk+2);ctx.lineTo(sx,r*kk-2);ctx.stroke();}
    ctx.strokeStyle=p.dk;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.ellipse(0,0,r-1,r-1,0,0,6.3);ctx.stroke();
    ctx.fillStyle=p.hd;ctx.beginPath();ctx.ellipse(r*.62,0,r*.26,r*.66,0,0,6.3);ctx.fill();
    ctx.fillStyle=p.lg;ctx.beginPath();ctx.arc(r*.74,-r*.2,3,0,6.3);ctx.fill();
    ctx.restore();

    // A locked pod stays VISIBLE with a padlock under the name -- you should be able
    // to see what you are working towards, which a blank silhouette cannot do.
    ctx.font='bold 10px Verdana,sans-serif';ctx.textAlign='center';
    ctx.fillStyle=lock?'#6f8a72':(sel?'#eaf5dc':'#9fb89f');
    ctx.fillText(p.n,px,y+CH/2-30);
    if(lock){
      ctx.save();ctx.translate(px,y+CH/2-14);
      ctx.fillStyle='#6f8a72';ctx.fillRect(-5,-1,10,9);
      ctx.strokeStyle='#6f8a72';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,-1,3.4,Math.PI,0);ctx.stroke();
      ctx.restore();
    }else if(!ROW){
      ctx.fillStyle=sel?'#b6e85a':'#4a6650';
      ctx.fillText(String(i+1)+' / '+n,px,y+CH/2-14);
    }
  });
  // chunky arrow buttons rather than bare glyphs, with hit boxes recorded so the
  // mouse can never drift out of step with what is drawn
  const edge=(ROW?(n-1)/2:1)*gap+CW/2+34;
  [[-1,W/2-edge],[1,W/2+edge]].forEach(([dir,ax])=>{
    ctx.fillStyle='#141d18';rrect(ax-17,y-24,34,48,8);ctx.fill();
    ctx.strokeStyle='#38503f';ctx.lineWidth=1;rrect(ax-16.5,y-23.5,33,47,8);ctx.stroke();
    ctx.fillStyle='#b6e85a';ctx.beginPath();
    ctx.moveTo(ax+dir*7,y);ctx.lineTo(ax-dir*5,y-8);ctx.lineTo(ax-dir*5,y+8);
    ctx.closePath();ctx.fill();
    podArrows.push({x:ax,y:y,w:44,h:58,dir:dir});
  });
  ctx.font='bold 14px Verdana,sans-serif';
  ctx.font='bold 12px Verdana,sans-serif';
  ctx.fillStyle='#cfe0bb';ctx.fillText('\u2190 \u2192 change pod    \u2191 \u2193 change track',W/2,H/2+90);
  ctx.font='bold 14px Verdana,sans-serif';
  // track picker -- drawn as an actual clickable strip
  const trkY=H/2+104, trkH=26, trkW=300;
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(W/2-trkW/2,trkY,trkW,trkH);
  ctx.strokeStyle='#31503c';ctx.lineWidth=1;ctx.strokeRect(W/2-trkW/2,trkY,trkW,trkH);
  ctx.fillStyle='#d6f27a';
  ctx.fillText('\u25c0',W/2-trkW/2+18,trkY+18);
  ctx.fillText('\u25b6',W/2+trkW/2-18,trkY+18);
  ctx.fillStyle='#cfe0bb';ctx.fillText(LEVELS[levelIdx].n,W/2,trkY+18);
  ctx.font='bold 12px Verdana,sans-serif';
  ctx.fillStyle='#d6f27a';ctx.fillText('SPACE to ride',W/2,H/2+150);
  ctx.font='bold 10px Verdana,sans-serif';
  ctx.fillStyle='#5d7a5f';
  ctx.fillText('gas: UP   ·   load / brake: SPACE   ·   lean: LEFT RIGHT   ·   N: next track',W/2,H/2+164);
  ctx.textAlign='left';
}

// ---- MUSIC ------------------------------------------------------------------
// Paste a base64 audio data URI into MUSIC_SRC and it plays on loop. Left empty the
// game just runs silent, so nothing breaks if there is no track.
//   const MUSIC_SRC='data:audio/mpeg;base64,....';
// FASTEST LITTLE POD -- the default track: every level except Baja, plus the menus
// and the end screen. 2:44, so it comes round a good deal less often than the
// 90s loop it replaces.
const MUSIC_SRC='music/fastest-little-pod.mp3';
// Per-track music. A level with no entry falls back to MUSIC_SRC, so adding one is
// a single line here rather than a change to the playback code.
// A PLAYLIST, not per-level music. Tracks play end to end and carry straight across
// restarts, level changes and menus -- nothing about riding interrupts them, so a song
// outlasting several attempts is the normal case rather than a problem. `]` skips.
const MUSIC_FLOW='music/follow-the-flow.mp3';
const MUSIC_RHYTHM='music/rhythm-in-the-air.mp3';
// Add a track: one line here. Each minute of audio is ~0.79MB of base64 at the mono
// 80kbps everything uses, and the whole file has to download and decode before the
// game opens -- so watch the total as this grows.
const PLAYLIST=[
  {n:'FASTEST LITTLE POD', src:MUSIC_SRC},
  {n:'FOLLOW THE FLOW',    src:MUSIC_FLOW},
  {n:'RHYTHM IN THE AIR',  src:MUSIC_RHYTHM},
];
const MUSIC_VOL=0.45;

let music=null, musicOn=true, musicStarted=false;
let trackIdx=0, musicGain=1, musicPending=null, songToast=0;
if(PLAYLIST.length){
  music=new Audio();
  music.loop=false;                   // looping ONE track is what the playlist replaces
  music.volume=MUSIC_VOL;
  music.src=PLAYLIST[0].src;
  music.addEventListener('ended',()=>playTrack(trackIdx+1));
}
function playTrack(i){
  if(!music||!PLAYLIST.length)return;
  trackIdx=((i%PLAYLIST.length)+PLAYLIST.length)%PLAYLIST.length;
  music.src=PLAYLIST[trackIdx].src;
  if(musicStarted&&musicOn)music.play().catch(()=>{});
  songToast=Math.round(190/T);         // name it briefly, so a skip has feedback
}
// A skip fades rather than cuts. `ended` does not need this -- it is already silent.
function skipSong(){
  if(!music)return;
  // With ONE track there is nothing to skip to, and "skip" restarting the song you are
  // halfway through is worse than it doing nothing. Name the track instead, so the key
  // still answers. This stops mattering the moment a second song goes in.
  if(PLAYLIST.length<2){ songToast=Math.round(190/T); return; }
  if(musicPending===null)musicPending=trackIdx+1;
}
function musicTick(){
  if(!music)return;
  if(musicPending!==null){
    musicGain-=0.09;
    if(musicGain<=0){ musicGain=0; const t=musicPending; musicPending=null; playTrack(t); }
  }else if(musicGain<1) musicGain=Math.min(1,musicGain+0.05);
  music.volume=MUSIC_VOL*musicGain;
  if(songToast>0)songToast--;
}
// Shown wherever you are -- menus included -- since the playlist runs everywhere.
function drawSongToast(){
  if(songToast<=0||!PLAYLIST.length)return;
  const k=Math.min(1,songToast/22), nm=PLAYLIST[trackIdx].n;
  ctx.save();
  ctx.globalAlpha=k; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='bold 10px Verdana,sans-serif';
  const w=ctx.measureText(nm).width+34;
  ctx.fillStyle='rgba(8,18,14,.78)'; ctx.fillRect(12,H-30,w,20);
  ctx.strokeStyle='#3a4a3f'; ctx.lineWidth=1; ctx.strokeRect(12.5,H-29.5,w-1,19);
  ctx.fillStyle='#7fa87f'; ctx.fillText('\u266a',20,H-16);
  ctx.fillStyle='#cfe0bb'; ctx.fillText(nm,34,H-16);
  ctx.restore();
}
// Browsers refuse to start audio before the user interacts, so the first keypress or
// click is what kicks it off -- the game already begins on one of those.
// Only mark it started if playback ACTUALLY began. The old version set the flag
// straight away, so a blocked first attempt meant it never tried again -- and it was
// only wired to keydown, so clicking to start never triggered it at all.
function startMusic(){
  if(!music||musicStarted||!musicOn)return;
  const p=music.play();
  if(p&&p.then)p.then(()=>{musicStarted=true;}).catch(()=>{musicStarted=false;});
  else musicStarted=true;
}
// Try the moment the page loads. Browsers will usually refuse this -- audio needs a
// user gesture first -- so every plausible gesture is also wired to retry.
if(music){
  const kick=()=>{ startMusic(); initSfx();
    if(actx&&actx.state==='suspended')actx.resume().catch(()=>{}); };
  for(const ev of ['pointerdown','mousedown','touchstart','keydown','click','wheel'])
    addEventListener(ev,kick,{passive:true});
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden)startMusic();
  });
  startMusic();                       // in case the browser happens to allow it
}
// ---- GRIND SFX ----------------------------------------------------------------
// Synthesised, not sampled: a grind is filtered noise with a couple of resonances, and
// building it live means it can TRACK YOUR SPEED instead of being a fixed clip. It also
// adds nothing to the file, which already carries two music tracks.
let actx=null, grindGain=null, grindSrc=null, grindTone=null;
// Grind SFX are OFF. Flip this to true to bring them back -- the synth below is
// untouched, so nothing needs rebuilding. While it is false no AudioContext is
// created and the ring buffer is never generated, so it costs nothing at load either.
const SFX_GRIND=false;
const SFX_VOL=0.16;
// A rail RINGS, and ringing needs energy to RECIRCULATE -- filtering noise, however
// narrowly, only ever gives you noise (that version measured 0.113 on a periodicity
// test; this one measures 0.509).
// The resonators are NOT built as DelayNodes in the graph: Web Audio clamps any delay
// inside a feedback loop to one render quantum (128 samples), so every mode collapsed
// to ~344Hz -- which the post highpass then removed, leaving silence. Instead the ring
// is rendered ONCE into a looping buffer at load, where no such limit applies.
  // The exact generator that will run in the game, runnable here so it can be heard.
  // The exact generator that will run in the game, runnable here so it can be heard.
  function makeGrindBuffer(SR, secs, opt){
    const o=Object.assign({base:1180,fb:0.972,modes:[1,1.74,2.61,3.86],
                           gains:[1,.72,.5,.34],damp:0.55,air:0.18,lpf:0,lpn:1},opt||{});
    const n=Math.floor(SR*secs);
    const x=new Float32Array(n);
    for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*0.5;
    // one-pole highpass: rails are bright
    let hpY=0,hpX=0; const hpA=Math.exp(-2*Math.PI*700/SR);
    for(let i=0;i<n;i++){hpY=hpA*(hpY+x[i]-hpX);hpX=x[i];x[i]=hpY;}
    const out=new Float32Array(n);
    for(let m=0;m<o.modes.length;m++){
      const f=o.base*o.modes[m], D=Math.max(2,Math.round(SR/f));
      const buf=new Float32Array(D); let idx=0, lp=0;
      const g=o.gains[m];
      for(let i=0;i<n;i++){
        const v=buf[idx];
        lp+=o.damp*(v-lp);
        const y=x[i]+o.fb*lp;
        buf[idx]=y; idx=(idx+1)%D;
        out[i]+=y*g;
      }
    }
    // friction layer under the ring
    let b1=0,b2=0; const w0=2*Math.PI*3200/SR, al=Math.sin(w0)/(2*0.9), c=Math.cos(w0);
    const A0=1+al, B0=al/A0, B2=-al/A0, A1=-2*c/A0, A2=(1-al)/A0;
    let z1=0,z2=0;
    for(let i=0;i<n;i++){
      const y=B0*x[i]+B2*z2-A1*b1-A2*b2;
      z2=z1; z1=x[i]; b2=b1; b1=y;
      out[i]=out[i]*0.5+y*o.air;
    }
    // final lowpass: the reference rolls off by 13kHz, unfiltered combs do not
    if(o.lpf){
      const a=Math.exp(-2*Math.PI*o.lpf/SR);
      for(let p=0;p<o.lpn;p++){ let z=0;
        for(let i=0;i<n;i++){z=z+(1-a)*(out[i]-z);out[i]=z;} }
    }
    // seam crossfade so the loop point cannot click
    const xf=Math.floor(SR*0.05);
    for(let i=0;i<xf;i++){
      const t=i/xf;
      out[i]=out[i]*t+out[n-xf+i]*(1-t);
    }
    let pk=0; for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(out[i]));
    const k=0.85/(pk||1); for(let i=0;i<n;i++)out[i]*=k;
    return out;
  }
function initSfx(){
  if(!SFX_GRIND||actx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;                                 // no Web Audio: stay silent, break nothing
  try{
    actx=new AC();
    // These are FITTED, not chosen by ear. Measured against a reference recording of
    // the kind of grind wanted: ring strength, spectral centroid and 85% rolloff, then
    // searched for the parameters that land closest. Reference 0.497 / 8006Hz / 13084Hz,
    // this 0.578 / 7771Hz / 14722Hz. The earlier 1180Hz base was an octave-and-a-bit too
    // low and far too bright up top, which is what still read as hiss.
    const data=makeGrindBuffer(actx.sampleRate,2.0,
                 {base:5150,fb:0.994,damp:0.94,air:0.04,lpf:6000,lpn:2,
                  modes:[1.0,1.013,1.028,1.512,1.536,1.683],
                  gains:[1.0,0.85,0.7,0.55,0.42,0.3]});
    const buf=actx.createBuffer(1,data.length,actx.sampleRate);
    buf.getChannelData(0).set(data);
    grindSrc=actx.createBufferSource(); grindSrc.buffer=buf; grindSrc.loop=true;
    grindTone=actx.createBiquadFilter();         // opens up as you pick up speed
    grindTone.type='lowpass'; grindTone.frequency.value=6500; grindTone.Q.value=0.7;
    grindGain=actx.createGain(); grindGain.gain.value=0;
    grindSrc.connect(grindTone); grindTone.connect(grindGain);
    grindGain.connect(actx.destination);
    grindSrc.start();
  }catch(e){ actx=null; }
}
const grinding=()=>!!(P.rail||(P.ramp&&P.ramp.grind));
function sfxTick(){
  if(!SFX_GRIND||!actx||!grindGain)return;
  const on = musicOn && started && !P.won && !(P.cd>0) && grinding();
  const t=actx.currentTime;
  const spd=Math.max(0,Math.min(1,P.spd/(18*T)));
  grindGain.gain.setTargetAtTime(on?SFX_VOL*(0.45+0.55*spd):0, t, on?0.02:0.05);
  if(on){
    // speed shifts the whole ring up and opens the tone, the way a real rail does
    grindSrc.playbackRate.setTargetAtTime(0.92+0.22*spd,t,0.06);
    grindTone.frequency.setTargetAtTime(5200+spd*3000,t,0.06);
  }
}
function toggleMusic(){
  musicOn=!musicOn;
  if(!music)return;
  if(musicOn){ music.volume=MUSIC_VOL*musicGain; if(!musicStarted)startMusic(); else music.play().catch(()=>{}); }
  else music.pause();
}

function pod(x,y){
  const o=1-P.curl;                       // 0 = balled, 1 = splayed out
  const gr=(P.rail||(P.ramp&&P.ramp.grind))?Math.min(1,(P.grindT||0)/8):0;
  // A bail reads as three things at once: a brief pancake on the hit, a tumble (the
  // spin is added in step), and a flash so you can see you are not in control yet.
  // These MUST be declared before the save() below, which reads fa.
  const bt=P.bail||0;
  // Driven by its own counter and CLAMPED. It used to be derived from P.bail against
  // BAIL_T, which broke the moment drown() set P.bail to a longer stall: sq came out
  // at 2.975, hgt went to -9.29, and ctx.ellipse threw on a negative radius.
  const sq=Math.min(0.85,Math.max(0,(P.sqT||0)/SQ_T)*0.85);
  const fa=(bt>0&&(bt>>2)%2===0)?0.42:1;
  ctx.save();ctx.translate(x,y);ctx.rotate(P.rot);ctx.globalAlpha=fa;
  const len=R*(1+o*.10+gr*0.34)*(1+sq*0.85),hgt=R*(1-o*.06-gr*0.20)*(1-sq*0.62);

  if(o>.05){ctx.globalAlpha=Math.min(1,o*1.6)*fa;
    ctx.strokeStyle=C().lg;ctx.lineWidth=1.6+gr*0.7;
    for(let i=0;i<6;i++){const lx=-len*.62+i*(len*.25);
      // grinding: legs braced straight down onto the bar. otherwise they paddle.
      const sw=gr>0 ? lx*-0.30 : Math.sin(P.time*.22+i)*1.4*o;
      const reach=hgt*.72+(3.2*o)+gr*5.5;
      ctx.beginPath();ctx.moveTo(lx,hgt*.7);ctx.lineTo(lx+sw,reach);ctx.stroke();}
    ctx.globalAlpha=fa;}
  ctx.fillStyle=C().dk;ctx.beginPath();ctx.ellipse(0,0,len,hgt,0,0,6.3);ctx.fill();
  ctx.fillStyle=C().bd;ctx.beginPath();ctx.ellipse(0,-.5,len-1.5,hgt-1.5,0,0,6.3);ctx.fill();
  // Above ~0.6 rad/frame the 7 plates advance more than one plate per frame and
  // strobe. Fade them out and fall back to concentric rings, which are rotationally
  // symmetric and so cannot alias.
  const sp=Math.abs(P.spin)||0;
  const blur=Math.max(0,Math.min(1,(sp-0.55)/0.85));
  if(blur<1){
    ctx.globalAlpha=(1-blur)*fa;
    ctx.strokeStyle=C().dk;ctx.lineWidth=1.6;ctx.lineCap='butt';
    for(let i=-3;i<=3;i++){const px=i*(len/4.1),k=1-Math.abs(i)/4.6;
      ctx.beginPath();ctx.moveTo(px,-hgt*k);ctx.lineTo(px,hgt*k);ctx.stroke();}
    ctx.globalAlpha=fa;
  }
  if(blur>0){
    ctx.globalAlpha=blur*0.55*fa;
    ctx.strokeStyle=C().dk;ctx.lineWidth=1.6;
    for(const f of [0.42,0.72]){
      ctx.beginPath();ctx.ellipse(0,0,len*f,hgt*f,0,0,6.3);ctx.stroke();}
    ctx.globalAlpha=fa;
  }
  // A tight bright specular across the top is what reads as polished glass. A shell is
  // matte: light on the upper surface, but broad, dim, and following the curve rather
  // than a hot spot sitting on it.
  // The specular is gone. Even broad and dim it washed the shell out; the segment
  // lines and the head plate carry the shape on their own.
  // bright head plate: always visible, so your lean angle is readable even balled up
  ctx.fillStyle=C().hd;
  ctx.beginPath();ctx.ellipse(len*.66,0,len*.26,hgt*.72,0,0,6.3);ctx.fill();
  if(P.press>0.08){                      // charge ring: brighter the more you have loaded
    ctx.globalAlpha=(0.25+P.press*0.6)*fa;
    ctx.strokeStyle=P.press>0.75?'#d6f27a':'#9ff0c0';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,R+3+P.press*3,0,6.3*Math.min(1,P.press));ctx.stroke();
    ctx.globalAlpha=fa;}
  ctx.fillStyle=C().lg;ctx.beginPath();ctx.arc(len*.78,-hgt*.2,1.6,0,6.3);ctx.fill();
  if(o>.05){ctx.globalAlpha=Math.min(1,o*1.6)*fa;
    ctx.fillStyle=C().dk;ctx.beginPath();ctx.ellipse(len*.88,0,3.2,hgt*.6,0,0,6.3);ctx.fill();
    ctx.fillStyle='#141414';ctx.fillRect(len*.9,-2,2,2);
    ctx.strokeStyle=C().dk;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(len*.96,-1);ctx.lineTo(len*.96+3.5*o,-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(len*.96,1.5);ctx.lineTo(len*.96+3*o,3);ctx.stroke();
    ctx.globalAlpha=fa;}
  ctx.restore();
}

function fmtT(f){const t=f/60;return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+String(Math.floor(t*100%100)).padStart(2,'0');}
function hud(){
  ctx.font='bold 11px Verdana,sans-serif';ctx.textBaseline='top';
  const t=(v,x,y,c)=>{ctx.fillStyle='#0a1410';ctx.fillText(v,x+1,y+1);ctx.fillStyle=c;ctx.fillText(v,x,y);};
  ctx.font='bold 26px Verdana,sans-serif';
  t(P.spd.toFixed(1),12,10,P.spd>14?'#d6f27a':'#e8f0d8');
  ctx.font='bold 10px Verdana,sans-serif';
  t('SPEED',13,40,'#7fa87f');
  ctx.fillStyle='#0a1410';ctx.fillRect(12,54,180,8);
  ctx.fillStyle=P.spd>14?'#d6f27a':'#6dbf5c';
  ctx.fillRect(13,55,Math.round(178*Math.min(1,P.spd/22)),6);
  const s=P.time/60;
  t(Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'),12,70,'#cfe0bb');
  t('best '+P.best.toFixed(1),70,70,'#7fa87f');
  t('bails '+(P.bails||0),140,70,(P.bails||0)?'#ffd23f':'#5f7a66');
  t(LEVELS[levelIdx].n,20,92,'#5f7a66');
  // how far ahead of or behind the ghost you are, right now
  const gh2=ghost[levelIdx];
  if(gh2&&started&&!P.won&&!P.practice){
    const fr=Math.min(Math.floor(P.time),(gh2.length/3|0)-1);
    if(fr>=0){
      const d=P.x-gh2[fr*3];
      const ahead=d>=0;
      t((ahead?'+':'')+Math.round(d)+'px vs ghost',20,112,ahead?'#9ff0c0':'#ff9f9f');
    }
  }
  if(bestT[levelIdx])t('best '+fmtT(bestT[levelIdx]),20,132,'#5f7a66');
  ctx.fillStyle='rgba(10,20,16,.6)';ctx.fillRect(W-190,14,178,6);
  ctx.fillStyle='#9ff0c0';ctx.fillRect(W-190,14,Math.round(178*Math.min(1,P.x/FINISH)),6);

  // ---- the road ahead: silhouette of the next stretch, with each hill flagged ----
  const PW=300,PH=54,PX=W-PW-12,PY=28,AHEAD=6200,BEHIND=700;
  ctx.fillStyle='rgba(10,20,16,.55)';ctx.fillRect(PX,PY,PW,PH);
  let lo=1e9,hi=-1e9;
  for(let i=0;i<=60;i++){const wx=P.x-BEHIND+(AHEAD+BEHIND)*i/60,g=gAt(wx);
    if(g<lo)lo=g; if(g>hi)hi=g;}
  const span=Math.max(120,hi-lo);
  const py=wx=>PY+PH-6-((hi-gAt(wx))/span)*(PH-14);
  ctx.beginPath();
  for(let i=0;i<=PW;i++){const wx=P.x-BEHIND+(AHEAD+BEHIND)*i/PW;
    const yy=py(wx); if(i===0)ctx.moveTo(PX,yy);else ctx.lineTo(PX+i,yy);}
  ctx.lineTo(PX+PW,PY+PH);ctx.lineTo(PX,PY+PH);ctx.closePath();
  ctx.fillStyle='#4a3018';ctx.fill();
  ctx.strokeStyle='#8f5d31';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<=PW;i++){const wx=P.x-BEHIND+(AHEAD+BEHIND)*i/PW;
    const yy=py(wx); if(i===0)ctx.moveTo(PX,yy);else ctx.lineTo(PX+i,yy);}
  ctx.stroke();
  for(const j of jumps){
    if(j.x<P.x-BEHIND||j.x>P.x+AHEAD)continue;
    const px=PX+PW*(j.x-(P.x-BEHIND))/(AHEAD+BEHIND);
    ctx.fillStyle={s:'#6dbf5c',m:'#e8c14a',l:'#e88a3c',p:'#e8566c',d:'#9f7cf0',j:'#5fd0e8',k:'#5fd0e8',u:'#f0c24a',w:'#49c8f0',g:'#d0d6de',D:'#e8c98a',b:'#ff7f6b',S:'#b9b7ae',R:'#7fd06b',v:'#f0d264',y:'#4ec2e8',F:'#f0862a',G:'#8ad46b','2':'#f04a7a',n:'#a97fd0',L:'#c9a227',A:'#e8a33c',c:'#d8455f',C:'#b5304a',T:'#ff3fa4',P:'#ff9f4a',O:'#e85fd0',W:'#c9a227',X:'#f0662a',U:'#e8443c',H:'#8ad46b',B:'#3fa8d0'}[j.kind];
    ctx.beginPath();ctx.moveTo(px,py(j.x)-6);ctx.lineTo(px-4,py(j.x)-13);
    ctx.lineTo(px+4,py(j.x)-13);ctx.closePath();ctx.fill();
  }
  const mx=PX+PW*BEHIND/(AHEAD+BEHIND);
  ctx.fillStyle='#ff8a4c';ctx.beginPath();ctx.arc(mx,py(P.x)-4,3.5,0,6.3);ctx.fill();
  ctx.fillStyle='#5f7a66';ctx.font='bold 8px Verdana,sans-serif';
  ctx.fillText('ROAD AHEAD',PX+2,PY-10);

  if(P.won)winPanel(t);
  if(P.cd>0||P.go>0)countdown(t);
}
// Drawn over the track rather than over a scrim: you want to read the first jump
// while you wait, not stare at a panel.
function countdown(t){
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  if(P.cd>0){
    const into=1-((P.cd-1)%CD_BEAT)/CD_BEAT;        // 0..1 through the current beat
    const sc=1.35-0.35*Math.min(1,into*2.2);        // a pop on each beat, then settle
    ctx.globalAlpha=0.30*(1-into*into);
    ctx.fillStyle='#0a1410';ctx.beginPath();
    ctx.arc(W/2,H*0.42,52*sc,0,6.3);ctx.fill();
    ctx.globalAlpha=1;
    if(P.cdFull){
      const num=Math.ceil(P.cd/CD_BEAT);            // 3, 2, 1
      ctx.font='bold '+Math.round(66*sc)+'px Verdana,sans-serif';
      ctx.fillStyle='#0a1410';ctx.fillText(num,W/2+3,H*0.42+24);
      ctx.fillStyle='#ffcf9a';ctx.fillText(num,W/2,H*0.42+21);
    }else{
      // A one-beat retry cannot show a NUMBER -- a count that begins at 1 reads as
      // broken. SET then GO is the same beat without pretending to be a countdown.
      ctx.font='bold '+Math.round(38*sc)+'px Verdana,sans-serif';
      ctx.fillStyle='#0a1410';ctx.fillText('SET',W/2+3,H*0.42+15);
      ctx.fillStyle='#ffcf9a';ctx.fillText('SET',W/2,H*0.42+12);
    }
  }else{
    const into=1-P.go/CD_GO;
    ctx.globalAlpha=Math.max(0,1-into*into);
    const sc=1+into*0.7;
    ctx.font='bold '+Math.round(58*sc)+'px Verdana,sans-serif';
    ctx.fillStyle='#0a1410';ctx.fillText('GO!',W/2+3,H*0.42+21);
    ctx.fillStyle='#b6e85a';ctx.fillText('GO!',W/2,H*0.42+18);
  }
  ctx.restore();
  ctx.textAlign='left';ctx.textBaseline='top';
}

// A medal coin. Dimmed rather than hidden when unearned, so you can always see what
// you are chasing next.
function coin(cx,cy,r,pal,on){
  ctx.save();
  if(!on)ctx.globalAlpha=0.30;
  const g=ctx.createRadialGradient(cx-r*.34,cy-r*.40,r*.12,cx,cy,r);
  g.addColorStop(0,pal[0]);g.addColorStop(.55,pal[1]);g.addColorStop(1,pal[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,6.3);ctx.fill();
  ctx.strokeStyle=pal[2];ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r-1,0,6.3);ctx.stroke();
  // a curled pod stamped into the face
  const py=cy+r*.04;
  ctx.fillStyle='rgba(36,22,12,.34)';
  ctx.beginPath();ctx.ellipse(cx,py,r*.54,r*.40,0,0,6.3);ctx.fill();
  ctx.strokeStyle='rgba(36,22,12,.30)';ctx.lineWidth=1.3;
  for(let k=-2;k<=2;k++){const sx=cx+k*(r*.20),kk=1-Math.abs(k)/3.3;
    ctx.beginPath();ctx.moveTo(sx,py-r*.34*kk);ctx.lineTo(sx,py+r*.34*kk);ctx.stroke();}
  ctx.restore();
}
function tickMark(cx,cy,on){
  ctx.save();ctx.lineCap='round';ctx.lineWidth=3;
  if(on){ctx.strokeStyle='#7fe06a';ctx.beginPath();
    ctx.moveTo(cx-6,cy);ctx.lineTo(cx-2,cy+5);ctx.lineTo(cx+7,cy-6);ctx.stroke();}
  else{ctx.strokeStyle='#48584d';ctx.beginPath();
    ctx.moveTo(cx-6,cy+1);ctx.lineTo(cx+6,cy+1);ctx.stroke();}
  ctx.restore();
}

// The end screen. IDENTICAL on every track including the last -- it is a hub, not a

  ctx.strokeStyle='#3a4a3f';ctx.lineWidth=1;ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);

  }
  ctx.font='bold 9px Verdana,sans-serif';
  t('BEST TIME',560,by+7,'#9fb89f');
  ctx.font='bold 14px Verdana,sans-serif';
  t(fmtT(bestT[levelIdx]),560,by+18,'#f0cc55');
  ctx.font='bold 9px Verdana,sans-serif';
  t('BAILS',560,by+38,'#9fb89f');
  ctx.font='bold 14px Verdana,sans-serif';

function snapshot(){
  try{
    const g=gAt(P.x);
    return ['x='+P.x+' y='+P.y+' vx='+P.vx+' vy='+P.vy,
            'spd='+P.spd+' won='+P.won+' splat='+P.splat+' ground='+P.ground,
            'cam='+cam.x+','+cam.y+' gnd='+g,
            'FINISH='+FINISH+' LEN='+LEN+' level='+LEVELS[levelIdx].n,
            'time='+P.time+' attempts='+attempts].join('\n');
  }catch(e){return 'snapshot failed: '+e.message;}
}
function loop(now){
  if(crashErr){drawCrash();requestAnimationFrame(loop);return;}
  try{ loopBody(now); }
  catch(err){
    crashErr=err;crashSnap=snapshot();
    try{console.error('ISOPOD RIDER crashed during '+crashPhase,err);}catch(e){}
    requestAnimationFrame(loop);
  }
}
function drawCrash(){
  ctx.fillStyle='#180a0a';ctx.fillRect(0,0,W,H);
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='bold 14px Verdana,sans-serif';ctx.fillStyle='#ff6b6b';
  ctx.fillText('CRASHED DURING: '+crashPhase,14,14);
  ctx.font='bold 11px Verdana,sans-serif';ctx.fillStyle='#ffcf9a';
  ctx.fillText(String(crashErr&&crashErr.message).slice(0,110),14,38);
  ctx.font='9px monospace';ctx.fillStyle='#cfe0bb';
  let y=60;
  for(const ln of String((crashErr&&crashErr.stack)||'').split('\n').slice(0,6)){
    ctx.fillText(ln.trim().slice(0,120),14,y);y+=12;}
  y+=8;ctx.fillStyle='#9ff0c0';
  for(const ln of crashSnap.split('\n')){ctx.fillText(ln.slice(0,120),14,y);y+=12;}
  ctx.fillStyle='#5d7a5f';ctx.fillText('screenshot this whole panel',14,H-22);
}
function dbg(){
  if(!showDbg||titleUp||!started)return;
  const g=gAt(P.x);                       // undefined if x is out of range -- do NOT
  const gs=(typeof g==='number'&&Number.isFinite(g));   // call toFixed on it blindly
  const num=v=>(typeof v==='number'&&Number.isFinite(v))?v.toFixed(0):String(v);
  const rows=[
    'x '+num(P.x)+'  y '+num(P.y)+'  gnd '+(gs?g.toFixed(0):String(g)),
    'vx '+num(P.vx)+'  vy '+num(P.vy)+'  spd '+num(P.spd),
    'cam '+num(cam.x)+','+num(cam.y)+'  FINISH '+FINISH+'  LEN '+LEN,
    'won '+num(P.won)+'  splat '+P.splat+'  air '+P.air+'  ground '+(P.ground?1:0),
    'fps '+fpsVal.toFixed(0)+'  draw '+drawMs.toFixed(1)+'ms  worst '+worstMs.toFixed(1)+
      'ms  budget '+(1000/Math.max(1,fpsVal)).toFixed(1)+'ms',
    'rail '+(P.rail?'y2='+P.rail.y2:'-')+'  ramp '+(P.ramp?'y':'-'),
    (()=>{const g=ghost[levelIdx];
      if(!g)return 'ghost NONE  (finish a lap to record one)';
      const fr=Math.min(Math.floor(P.time),(g.length/3|0)-1);
      const sx=Math.round(g[fr*3]-Math.round(cam.x));
      return 'ghost '+(g.length/3|0)+'f  frame '+fr+'  screenX '+sx+
             (sx>-60&&sx<W+60?'':'  OFF-SCREEN');})()

  if(Number.isFinite(P.x)&&P.x>FINISH&&!P.won)warn.push('PAST FINISH, NOT WON');
  if(!Number.isFinite(P.x+P.y+P.vx+P.vy+cam.x+cam.y))warn.push('NON-FINITE STATE');
  if(gs&&Math.abs(P.y-g)>400)warn.push('GROUND '+Math.round(P.y-g)+'px OFF');

  ctx.strokeStyle='#3a4a3f';ctx.lineWidth=1;ctx.strokeRect(8.5,H-h-7.5,335,h-1);
  ctx.font='9px monospace';let y=H-h-2;
  for(const r of rows){ctx.fillStyle='#9fb89f';ctx.fillText(r,14,y);y+=11;}
  for(const wn of warn){ctx.fillStyle='#ff6b6b';ctx.fillText('!! '+wn,14,y);y+=11;}
}
function loopBody(now){
  if(building){builderFrame();requestAnimationFrame(loop);return;}
  if(P.practice&&P.won){openBuilder();requestAnimationFrame(loop);return;}

    if(editCamX===null)editCamX=cam.x;

const defSpace=k=>k==='j'||k==='k'?95:(k==='d'||k==='u'||k==='w'||k==='g')?90:80;
function pieceVals(k,tu){
  const v={};
  for(const p of PIECES[k].ps)v[p.id]=(tu&&tu[p.id]!==undefined)?tu[p.id]:p.def;
  v.space=(tu&&tu.space!==undefined)?tu.space:defSpace(k);
  return v;
}
// Build one piece. Knobs that stand for a tuning constant are swapped in for just this
// piece and put straight back, so the other copies of it keep the stock numbers.
function makePiece(k,x,tu){
  const D=PIECES[k]; if(!D)return null;
  const v=pieceVals(k,tu);
  for(const p of D.ps)if(p.c)TUNE_SET[p.c](v[p.id]);
  try{return D.mk(x,v);}
  finally{for(const p of D.ps)if(p.c)TUNE_SET[p.c](p.def);}
}
const pieceSpans=[];      // filled by build(): where each piece of the track landed

function levelSig(L){
  const s=L.seq+'|'+JSON.stringify(L.tune||{})+'|'+L.len; let h=5381;
  for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))|0;
  return (h>>>0).toString(36);
}

    else if(L.edited)sv.edits[L.n]={seq:L.seq,tune:L.tune,len:L.len};
  });
  localStorage.setItem(BUILDKEY,JSON.stringify(sv)); bSaved=Date.now();
}catch(e){bSaved=-1;}}

/* ----- the gas-held preview -----
   Rides the current track with full throttle and nothing else, on the real physics,
   and records the line. That is the prediction the old prompt-and-retry loop lacked:
   you see where a jump puts you before you ride it. */
let SIM=false, bSim=null, bSimTimer=0;
const SIM_MAX=60*180, RIDE_LEAD=420;
function simGas(){
  const P0=Object.assign({},P), cam0={x:cam.x,y:cam.y}, key0=Object.assign({},key),
        st0=started, rec0=rec, fx0=fx.slice(), du0=dust.slice(), att0=attempts;
  const out={pts:[],bails:[],snaps:[],t:0,won:false,endX:0};
  SIM=true;
  try{
    build();
    for(const k in key)key[k]=false; key.gas=true; started=true; rec=[];
    P.spawn={x:40,y:gAt(40)-R}; respawn();
    P.time=0;P.won=0;P.cd=0;P.go=0;P.bails=0;P.best=0;P.crashes=0;P.practice=false;P.smY=P.y;
    cam.x=P.x-W/2;cam.y=P.y-H/2;
    const tg=pieceSpans.map(s=>Math.max(60,s.a-RIDE_LEAD));
    let ti=0, wasBail=false;
    for(let f=0;f<SIM_MAX;f++){
      step();
      const air=!(P.ground||P.rail||P.ramp||P.loop||P.tube);
      out.pts.push(P.x,P.y,air?1:0);
      if(P.bail>0&&!wasBail)out.bails.push(P.x,P.y);
      wasBail=P.bail>0;
