<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ISOPOD RIDER</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a1410;color:#cfe0bb;
    font-family:Verdana,"DejaVu Sans",sans-serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;box-shadow:0 0 0 3px #24422f,0 0 50px rgba(0,0,0,.8)}
  canvas{display:block;image-rendering:pixelated;background:#12261d}
  #hint{position:absolute;left:0;right:0;bottom:-28px;text-align:center;font-size:11px;color:#5d7a5f}
  kbd{background:#24422f;border:1px solid #3a6b4b;border-radius:3px;padding:1px 5px;color:#9fd08a;font-size:10px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="760" height="420"></canvas>
  <div id="hint">
    <kbd>↑</kbd> gas &nbsp; <kbd>space</kbd> load / brake &nbsp; <kbd>←</kbd><kbd>→</kbd> lean &nbsp; <kbd>R</kbd> restart &nbsp; <kbd>M</kbd> music &nbsp; <kbd>]</kbd> skip song &nbsp; <kbd>B</kbd> track builder
  </div>
</div>
<script>
(() => {
"use strict";
const W=760,H=420,cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let building=false; const BUILDER_W=340;
function fit(){const pw=building?BUILDER_W:0;document.body.style.paddingRight=pw+'px';
  const s=Math.max(pw?0.5:1,Math.min((innerWidth-pw)/W,(innerHeight-70)/H));
  cv.style.width=(W*s|0)+'px';cv.style.height=(H*s|0)+'px';}
addEventListener('resize',fit);fit();

/* ---------- tuning ---------- */
const T=0.80;                 // time scale: same track, played slower
// SLOPES PER PIXEL, not heights -- push() accumulates them. TB_H=150 built a 29,300px
// cliff; 0.50 gives a ~75px rise. The mouth must land UNDER the arc's peak: at TB_H=1.0
// the mouth sat 301px up against a 241px peak and was simply unreachable.
const TB_IN=420, TB_HUMP=200, TB_LIFT=0.85, TB_GAP=240, TB_RISE=300, TB_H=0.50,
      TB_DECK=300, TB_FALL=300, TB_MOUTHX=26, TB_EXITX=26, TB_GRAB=70, TB_GRABY=52;
const HOP=4.6*T;
const tubes=[];   // scripted slides: you are swallowed at the mouth and spat out the far end
// Balanced so the tube and gapping it finish within 0.02s of each other. The boost is
// NOT what made the tube dominant: at boost x1.00 it was still 0.34s faster, because
// the transit is a clean scripted line while gapping means a big jump that scrubs speed
// on landing. TUBE_FRAMES -- the time you spend inside -- is the real dial: at 26 the
// tube won by 0.56s, at 68 it lost by 0.37s.
const TUBE_BOOST=1.20, TUBE_FRAMES=50;   // how hard a bunny hop lifts you off a rail
const GRAV=0.34*T*T, AIR=0.86;   // floatier air = more hang off every crest        // air is a touch floaty, flash-game style
const ACCEL=0.190*T*T, BRAKE=0.22*T*T, SLOPE=0.165*T*T, DRAG=0.010*T*T,
      QDRAG=0.000544, CDRAG=0.0000047/T;   // v^2 term is scale-free; v^3 term needs 1/T
const LEAN=0.055*T, R=11;
// Real isopod morphs -- these are the varieties people actually keep.
// Three to start. `locked:true` on any entry draws it as a silhouette and makes the
// selection skip past it -- that is the hook for unlockables, so adding one later is
// a single field rather than a rework. Colours are five flats per pod (there are no
// per-pod sprites), so a morph is approximated by tone, not markings.
const PODS=[
  {n:'DAIRY COW',    dk:'#6b5a3e', bd:'#efe6cf', hi:'#fff8e6', hd:'#fff8e6', lg:'#6b5a3e'},
  {n:'MAGIC POTION', dk:'#3b2154', bd:'#9b6ad2', hi:'#e0c2ff', hd:'#e0c2ff', lg:'#3b2154'},
  {n:'GREEN SPOT',   dk:'#1f2a1c', bd:'#4e6b38', hi:'#9ed36a', hd:'#9ed36a', lg:'#1f2a1c'},
];
// Load each pod's two poses. The ball is used while curled, the walker while splayed --
// which is what keeps the uncurl animation instead of freezing it into one image.
for(const p of PODS){
}
let podIdx=0, started=false;
const podArrows=[];   // hit boxes for the < > arrows, rebuilt by startScreen each frame
function podStep(dir){                 // move the highlight, skipping anything locked
  const n=PODS.length;
  for(let k=1;k<=n;k++){
    const i=((podIdx+dir*k)%n+n)%n;
    if(!PODS[i].locked){podIdx=i;return;}
  }
}
const waters=[];   // {a,b,y} spans where falling below the surface drowns you
const rails=[];    // {a,b,y,crown} bars you can land on and grind
const ramps=[];    // {a,b,y0,y1} makeshift kickers: ride up them and launch off the end
const surf=[];     // {a,b,pal} stretches drawn as a different material
const tents=[];    // {x,w,h,base} the big top -- scenery you jump over
const stands=[];   // {a,b,base,n,run,rise} grandstand tiers
const flatbars=[]; // {a,b,y,base} a flat bar down a tabletop deck
const bars=[];     // {a,b,y,y2,base} crowd barriers -- the grind rails of the parade
const laptops=[];  // {a,b,y,base} the laptop on the table -- its lid is a grind rail
const mixers=[];   // {a,b} the mixer, a hump between the decks you ride over
const stages=[];   // {a,b,y} the raised deck the booth sits on
const platters=[]; // {x,r,dir} spinning records: rolling on one nudges your speed
const boats=[];    // {x,y} boats moored in the channel -- decoration you jump over
const umbs=[];     // {x,y,r,h} beach umbrellas: land on the canopy and it bounces you
const umbYat=(u,x)=>{
  const t=Math.max(-1,Math.min(1,(x-u.x)/u.r));
  return u.y - u.h*Math.sqrt(Math.max(0,1-t*t));      // shallow dome
};
const loops=[];    // {cx,cy,r} full loops -- these cannot live in the heightmap,
                   // which only stores one ground height per x
const CONCRETE={soil:['#b9b7ae','#9d9b93','#83817a','#5f5e59'], grit:'#d2d0c7', fringe:'#8d8b84'};
// the booth table: matte black board, not soil -- purple dirt under a DJ set looked wrong
const TABLETOP={soil:['#2a2433','#211c29','#181420','#100d17'], grit:'#3c3448', fringe:'#ff2fd0'};
const castles=[];  // sand castles: clear them or you are wearing one
const rampYat=(r,x)=>{
  const t=Math.max(0,Math.min(1,(x-r.a)/(r.b-r.a)));
  // a real kicker is concave: it picks up gently and steepens toward the lip
  const e=r.curve?t*t:t;
  return r.y0+(r.y1-r.y0)*e;
};
// The bar bows gently upward toward its middle, so its start sits right at the peak
// of your arc and it curves with you rather than sitting dead flat.
const railYat=(rl,x)=>{
  // A handrail that pitches down immediately is impossible to land on: it drops away
  // faster than you fall. A level lead-in at the top gives you something to hit.
  const f=rl.flat||0, L=rl.b-rl.a;
  const t=x<=rl.a+f ? 0 : Math.max(0,Math.min(1,(x-rl.a-f)/(L-f)));
  const base=rl.y+((rl.y2===undefined?rl.y:rl.y2)-rl.y)*t;
  return base - (rl.crown||0)*Math.sin(Math.PI*t);
};
const C=()=>PODS[podIdx];
const POP=5.2*T, POP_WINDOW=Math.round(22/T), POP_SWEET=Math.round(7/T);   // preload: hold down, release at the crest
const CLEAN=0.65, ROUGH=1.30;     // landing angle tolerances

/* ---------- terrain ----------
   Flow comes from the shape of the ground, not from a scoring system: rolling
   hills on a downhill trend, so every crest throws you and every landing is a
   descending face that hands the speed straight back.                        */
// MAXW must exceed the LONGEST level's len, or every feature past it silently writes
// nothing and the track becomes a dead flat plateau. Level 1 is 41000 and the beach
// 42000, so at 31000 both were losing their whole final stretch.
const MAXW=52000, G=new Float32Array(MAXW);
let LEN=41000, FINISH=0;
let SEQ='skmjdwumskg';
// Level 1 is exactly the track that was dialled in. Level 2 is its own layout.
// The forest backdrop is a real image, embedded as base64 so the html stays a single
// self-contained file. Procedural trees never converged on looking right; a painted
// plate does the job in one go.
// ---- ASSET LIBRARY ----------------------------------------------------------
// Each entry is one sprite. Add images here and they become placeable in the editor.
//   key      the name you refer to it by
//   src      base64 png (with transparency)
//   anchor   'ground' sits it on the terrain, 'free' leaves it where you put it
//   scale    drawn size multiplier
//   layer    'back' behind the terrain, 'front' over it
// Empty is fine -- the game just has no props until you add some.
const ASSETS={
  // The rack's grind bar is its TOP rail, which sits right at the top of the sprite --
  // so `top` is close to the full sprite height rather than some fraction of it.
  // The bus roof is a flat surface you land on and ride across, so it registers a
  // FLAT rail at roof height -- same mechanic as the DJ stage deck.
  bus:{src:'assets/bus.png',
       anchor:'ground', scale:1, layer:'front',
       collide:'rail', top:95, span:290, flat:290},

  // The kicker is a roll-onto surface, not something you fall onto, so it uses a ramp
  // collider. The sprite is flipped from the source so it climbs in the direction you
  // ride -- as drawn it descended, which would have been a roll-down.

  swings:{src:'assets/swings.png',
    anchor:'base', scale:1, layer:'front', collide:'rail', top:95, span:203},
  tube:{src:'assets/tube.png',
    anchor:'base', scale:1, layer:'front', collide:'none',
    mouth:151, exitUp:19, opening:60, span0:248,
    // measured off the sprite's actual underside, not guessed -- each leg starts where the
    // tube's belly is at that x, so they touch the tube instead of stopping short
    legs:[{x:34,y:62},{x:99,y:95},{x:168,y:153}]},
  bikerack:{src:'assets/bikerack.png',
            anchor:'ground', scale:1, layer:'front',
            collide:'rail', top:40, span:186},

  // The billboard's grind bar is the steel pipe across its top, at 105px above the
  // ground. That is not a free choice: a bunny hop off flat ground clears 122px
  // (measured), so the bar has to sit under that or it can never be reached, and
  // the art fixes the bar at 84% of the sprite's height -- which is what sets the
  // sign's overall size at 280x125 rather than any aesthetic call.
  billboard:{src:'assets/billboard.png',
             anchor:'ground', scale:1, layer:'front',
             collide:'rail', top:105, span:272, flat:272},

  // Decoration only:
  //   rock:{src:'...', anchor:'ground', scale:1, layer:'front'},
  //
  // Something you can actually ride. `collide` registers a real collider when the
  // level builds, so the physics sees it -- without this a sprite is just a picture
  // and you ride straight through it.
  //   'rail'  a grind bar. top   = how high above the ground the bar sits
  //                        span  = how long it is (defaults to the sprite width)
  //   'ramp'  a surface you roll onto and stay on, like the laptop lid.
  //                        rise  = height gained across its length
  //
  //   bikerack:{src:'...', anchor:'ground', scale:1, layer:'front',
  //             collide:'rail', top:34, span:150},
};
for(const k in ASSETS){
  const a2=ASSETS[k];
  a2.img=new Image(); a2.ready=false;
  a2.img.onload=(function(o){return function(){o.ready=true;};})(a2);
  a2.img.src=a2.src;
}

// Where each prop sits. Written by the placement editor, pasted back in here.
// Keyed by level name so props travel with their track.
const PROPS={
  // 'THE QUARRY':[{a:'rock',x:12000,y:0}],
  // On the flat inside rhythmTwo (560..5210), the first roller section. Position is
  // NOT a look-and-see choice: rails only catch you from above (P.vy>0), so the bar
  // has to sit exactly where the arc off the preceding rollers comes down through
  // 105px. Swept every 50px from 2850 to 3400 against six different lines -- 3150
  // caught 4 of 6. The flat after the LATER whoops (x~23600) catches nothing at any
  // position or size, because nothing there launches you.
  'MAIN STREET':[{a:'billboard',x:3150}],
};
const PROPS_BASE=JSON.parse(JSON.stringify(PROPS));

// Called from build(), after the terrain exists, so colliders land at the right height.
function buildPropColliders(){
  const list=PROPS[LEVELS[levelIdx].n];
  if(!list)return;
  for(const p of list){
    const A=ASSETS[p.a];
    if(!A||!A.collide)continue;
    const sc=A.scale||1;
    const span=A.span||((A.img&&A.img.width)?A.img.width*sc:120);
    const a2=p.x-span/2, b2=p.x+span/2;
    const gy=gAt(p.x)+(p.dy||0);
    if(A.collide==='rail'){
      const y=gy-(A.top||34);
      // the collider follows the sprite's rotation, so a tilted rack really is a
      // downhill grind rather than looking tilted and riding flat
      const drop=Math.tan(p.r||0)*span;
      rails.push({a:a2,b:b2,y:y-drop/2,y2:y+drop/2,flat:A.flat||0,crown:A.crown||0});
    }else if(A.collide==='ramp'){
      // rises across its span, so you roll on at ground level and leave at the lip
      ramps.push({a:a2,b:b2,y0:gy-2,y1:gy-(A.rise||40)*(p.s||1),grind:false});
    }
  }
}

// pick up anything saved from a previous session
setTimeout(()=>{ if(typeof loadPropsLocal==='function')loadPropsLocal(); },0);

function drawProps(layer){
  const list=PROPS[LEVELS[levelIdx].n];
  if(!list)return;
  // CX/CY are locals inside draw(), so they have to be recomputed here rather than
  // borrowed -- this only showed up once the library had something in it.
  // cam.x/y IS the view's top-left in world space -- draw() uses it directly, so
  // subtracting half a screen again would offset every prop by half the viewport.
  const CX=Math.round(cam.x), CY=Math.round(cam.y);
  for(const p of list){
    const A=ASSETS[p.a];
    if(!A||!A.ready||(A.layer||'front')!==layer)continue;
    const sc=(A.scale||1)*(p.s||1);
    const w2=A.img.width*sc, h2=A.img.height*sc;
    const sx=Math.round(p.x-CX-w2/2);
    if(sx<-w2-160||sx>W+160)continue;
    // ground-anchored props follow the terrain, so they never float or sink
    const baseY=(A.anchor==='free')?(p.y||0):gAt(p.x);
    const sy=Math.round(baseY-CY-h2+(p.dy||0));
    // SUPPORT LEGS. A diagonal sprite anchored by its bounding box leaves the high end
    // hanging over empty air. Terrain cannot fix it: a mound tall enough to reach the
    // mouth would be a wall you hit before you got there. So the legs are drawn.
    if(A.legs){
      const gy=Math.round(gAt(p.x)-CY);
      for(const L of A.legs){
        const lx=Math.round(p.x-CX-w2/2+L.x*sc);
        const ly=Math.round(baseY-CY-h2+L.y*sc);
        if(ly>=gy-2)continue;
        ctx.strokeStyle='#8a97a8';ctx.lineWidth=Math.max(2,5*sc);
        ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,gy);ctx.stroke();
        ctx.strokeStyle='#5d6a7c';ctx.lineWidth=Math.max(1,2*sc);
        ctx.beginPath();ctx.moveTo(lx+2*sc,ly);ctx.lineTo(lx+2*sc,gy);ctx.stroke();
        ctx.fillStyle='#4a5563';                       // foot pad
        ctx.fillRect(lx-Math.round(5*sc),gy-Math.round(3*sc),Math.round(11*sc),Math.round(4*sc));
        ctx.strokeStyle='#8a97a8';ctx.lineWidth=Math.max(1,2*sc); // cross brace
        ctx.beginPath();ctx.moveTo(lx-Math.round(6*sc),ly+(gy-ly)*0.45);
        ctx.lineTo(lx+Math.round(6*sc),ly+(gy-ly)*0.62);ctx.stroke();
      }
    }
    const rot=p.r||0;
    if(rot){
      // rotate about the prop's base, so it pivots where it meets the ground rather
      // than swinging around its middle and lifting off the surface
      ctx.save();
      ctx.translate(sx+w2/2,sy+h2);
      ctx.rotate(rot);
      ctx.drawImage(A.img,-w2/2,-h2,Math.round(w2),Math.round(h2));
      ctx.restore();
    }else{
      ctx.drawImage(A.img,sx,sy,Math.round(w2),Math.round(h2));
    }
  }
}

const BG_SPACE=new Image();
let spaceReady=false;
BG_SPACE.onload=()=>{spaceReady=true;};
BG_SPACE.src='assets/bg-space.png';

const BG_TITLE=new Image();
let titleReady=false;
BG_TITLE.onload=()=>{titleReady=true;};
BG_TITLE.src='assets/bg-title.png';

const BG_STREET=new Image();
let streetReady=false;
BG_STREET.onload=()=>{streetReady=true;};
BG_STREET.src='assets/bg-street.png';

const BG_BEACH=new Image();
let beachReady=false;
BG_BEACH.onload=()=>{beachReady=true;};
BG_BEACH.src='assets/bg-beach.png';

const BG_FOREST=new Image();
let bgReady=false;
// handler BEFORE src -- attaching it after is a race, even if browsers happen to
// decode asynchronously and let you get away with it
BG_FOREST.onload=()=>{bgReady=true;};
BG_FOREST.src='assets/bg-forest.png';

const THEMES={
  forest:{sky:['#5e8f4e','#16301f'], far:'#143829', near:'#1a4832',
          crown:'round', trunk:'#143829',
          soil:['#8f5d31','#6d4423','#553417','#3a230f'],
          grit:'#a06f3d', fringe:'#427f42'},
  beach: {sky:['#7fc9d6','#dcefe4'], far:'#2f6d78', near:'#3d8c8a',
          crown:'palm',  trunk:'#4a3a26',
          soil:['#f0dda6','#e0c988','#c8ac6b','#a68a4f'],
          grit:'#fff4cd', fringe:'#c9b26f'},
  // deep rainforest -- kept for later, not currently used by any level
  jungle:{sky:['#0d2b1e','#1f5138'], far:'#0f3325', near:'#17492f',
          crown:'jungle', trunk:'#0f2e20',
          soil:['#6b4a2c','#54381f','#3f2915','#291a0c'],
          grit:'#7d5a34', fringe:'#3f8f4a'},
  // deep space: nothing grows out here, so the decor layers are empty and the plate
  // does all the work
  orbit:{sky:['#cfd9a3','#f2d79a'], far:'#c8b98a', near:'#a89a6d',
         crown:'none', trunk:'#7a6242',
         soil:['#e8b96a','#d9a457','#b98544','#8f6733'],
         grit:'#f5d493', fringe:'#7f9b4e'},
  // parade day: bright sky, bunting overhead, crowds either side of the route
  parade:{sky:['#8fd0f0','#dceffb'], far:'#6f7fa8', near:'#8a94bd',
          crown:'crowd', trunk:'#4a5170',
          soil:['#8f8f96','#77777e','#5f5f66','#47474e'],
          grit:'#a9a9b2', fringe:'#d8455f'},
  // after-hours club: black room, magenta and cyan haze, everything backlit
  club:  {sky:['#120a1e','#2b1040'], far:'#1d0f30', near:'#2c1642',
          crown:'truss', trunk:'#0d0716',
          soil:['#3a2050','#2c1840','#211230','#160c22'],
          grit:'#6b3f8f', fringe:'#ff3fa4'},
  // low sun: a blank canvas to build a technical downhill on
  sunset:{sky:['#f2a25c','#5b3f74'], far:'#4a3358', near:'#5e4066',
          crown:'round', trunk:'#3a2a4a',
          soil:['#b08355','#8d6540','#6b4c2f','#4a341f'],
          grit:'#c99a66', fringe:'#7a5f80'},
};
// `par` is the GOLD time in seconds. Bronze/silver/platinum are multiples of it
// (see MEDAL_MUL), so retuning a whole track's medals is editing ONE number.
// md:[bronze,silver,gold,platinum] in seconds, placed against two MEASURED points per
// track: a gas-held lap with no steering, and the best lap anyone has actually ridden.
//   silver   ~ the mindless lap        (finishing with some pace)
//   gold     ~ the best recorded lap   (riding it well)
//   platinum ~ a near-perfect lap      (a little under the best anyone has managed)
// Measured: gas-held 50.32 / 35.13 / 35.22 / 28.83, human best -- / 33.56 / 34.33 / --,
// autopilot 50.40 / 32.90 / 34.53 / 28.48.
// Platinum sits a SMALL step beyond the best lap ridden -- roughly half a percent, the
// kind of margin a near-perfect run can still find. It is deliberately not set to the
// best time itself: the top tier has to be the one you do not have yet. It is also not
// a number to keep lowering after each near miss, or it stops meaning anything.
// BAJA, MAIN STREET and THE SANDLOT have human times. THE QUARRY still has none -- its
// gold and platinum are inferred and should be replaced with a real lap.
// `lay` is a LAYOUT VERSION. Saved times and ghosts are keyed on it, so changing a
// track's terrain retires its old records instead of leaving you chasing a ghost
// riding ground that no longer exists. Bump it whenever the shape changes.
const LEVELS=[
  {n:'THE QUARRY', seq:'skmjdwumskgA',  len:44000, fg:1.70, th:'forest', nofin:true, par:49, md:[58.0,50.5,49.0,47.2]},   // inferred, no human lap
  {n:'BAJA BEACH', seq:'SRHPWWB',      len:42000, fg:1.55, th:'beach', nofin:true, par:34, md:[40.5,35.1,33.8,32.7]},    // human best 33.56
  {n:'MAIN STREET', seq:'yEU2NWz',          len:34000, fg:1.60, th:'parade', flat:true, nofin:true, par:35, md:[40.3,35.1,34.2,33.6], lay:2},  // PROVISIONAL: no human lap yet
  {n:'THE SANDLOT', seq:'WQJ2nW',          len:34000, fg:1.55, th:'orbit', flat:true, nofin:true, par:29, md:[33.5,28.9,28.3,27.80]},  // human best 27.94
];
// Tracks as the file ships them (for "revert"), then any builder work saved in this
// browser on top. Only tracks made in the builder (custom here, mine:true once exported
// into the file) can change; the original tracks are locked.
const LEVELS_FILE=LEVELS.map(L=>JSON.stringify(L));
const BUILDKEY='isopodRider.builder.v1';
try{
  const sv=JSON.parse(localStorage.getItem(BUILDKEY)||'{}'), same=(L,e)=>
    L.seq===e.seq&&JSON.stringify(L.tune||{})===JSON.stringify(e.tune||{});
  for(const c of sv.custom||[]){
    const L=LEVELS.find(T=>T.n===c.n);
    if(L&&L.mine){if(!same(L,c))Object.assign(L,{seq:c.seq,tune:c.tune,len:c.len,edited:true});continue;}
    if(L)while(LEVELS.some(T=>T.n===c.n))c.n+=' 2';
    LEVELS.push(Object.assign(c,{custom:true,edited:true}));
  }
  for(const L of LEVELS){const e=L.mine&&sv.edits&&sv.edits[L.n];
    if(e&&!same(L,e))Object.assign(L,{seq:e.seq,tune:e.tune,len:e.len,edited:true});}
  for(const L of LEVELS)if(L.tune===undefined)delete L.tune;
}catch(e){}
const TH=()=>THEMES[LEVELS[levelIdx].th];
let levelIdx=0;
// GHOST: every run is recorded frame by frame. Beat your best on a track and that
// recording becomes the ghost you race against on the next attempt.
const bestT=LEVELS.map(()=>null), ghost=LEVELS.map(()=>null);
let rec=[];

/* ---------- medals ---------- */
// Four tiers, awarded on your BEST time, not the run you just did -- so a medal is

// do not. Main Street measures 35.22s for a mindless lap and 34.33s for a good one --
// a range of 0.89s. Platinum at 8% under gold is 2.8s on that track, wider than the

const medalTime=(i,k)=>LEVELS[i].md?LEVELS[i].md[k]:LEVELS[i].par*MEDAL_MUL[k];  // seconds

// recording only fires on a new best, so after a reload you had a PB and no ghost,
// and every run slower than that PB left you racing nothing.
// Quantised on the way out -- 0.1px on position and 0.001rad on rotation is far below
// anything visible at this scale, and it roughly halves what goes into storage.
const GHOSTKEY='isopodRider.ghost.v1';
function saveGhosts(){try{
  const blob={};
  LEVELS.forEach((L,i)=>{
    const g=ghost[i]; if(!g||g.length<3)return;
    const q=new Array(g.length);
    for(let k=0;k<g.length;k+=3){

      q[k+1]=Math.round(g[k+1]*10)/10;
      q[k+2]=Math.round(g[k+2]*1000)/1000;

      }
    }
    e.preventDefault();return;
  }
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  // end screen: the buttons are the same three actions as R / T / SPACE
  if(started&&P.won){
    for(const b of winBtns){
      if(mx>b.x&&mx<b.x+b.w&&my>b.y&&my<b.y+b.h){
        if(b.id==='retry')reset(false,true);
        else if(b.id==='next')nextTrack();
        else {started=false;reset();buildDecor();}
        return;
      }
    }
    return;                                  // clicks off a button do nothing
  }
  if(!started){
    // These boxes must match startScreen() exactly. They did not, which is why
    // clicking a pod or the track name just launched track 1 instead.
    // podSlots is filled by startScreen() each frame, so the boxes can never drift
    // out of step with what is drawn -- which is exactly what went wrong before.
    for(const sl of podSlots){
      if(mx>sl.x-sl.w/2&&mx<sl.x+sl.w/2&&my>sl.y-sl.h/2&&my<sl.y+sl.h/2+20){
        if(!PODS[sl.i].locked)podIdx=sl.i;      // a locked card is not selectable
        return;}
    }
    for(const a of podArrows){                  // boxes come from startScreen, same as podSlots
      if(mx>a.x-a.w/2&&mx<a.x+a.w/2&&my>a.y-a.h/2&&my<a.y+a.h/2){podStep(a.dir);return;}
    }
    const trkY=H/2+104, trkH=26, trkW=300;
    if(my>trkY&&my<trkY+trkH&&mx>W/2-trkW/2&&mx<W/2+trkW/2){
      const dir = mx<W/2 ? LEVELS.length-1 : 1;          // left half back, right half forward
      loadLevel((levelIdx+dir)%LEVELS.length);reset();buildDecor();
      return;
    }
    started=true;
  }
});

/* ---------- state ---------- */
// Title -> picker -> riding. `titleUp` gates the first screen; `started` still gates
// the run itself, so nothing downstream had to change.
let titleUp=true;
const podSlots=[];   // hit boxes for the three visible pods, rebuilt each frame
const winBtns=[];    // hit boxes for the end-screen buttons, same trick
const P={},cam={x:0,y:0},fx=[],dust=[];
let attempts=1;
// 3-2-1-GO. The clock does not start until GO, so nothing is lost to it.
// R gets a SHORT count on purpose: retrying is the core loop of a time trial and a
// three second wait on every attempt would cost far more than the surprise it saves.
// A full count is for arriving somewhere new -- next track, track select, first ride.
const CD_BEAT=Math.round(52/T), CD_GO=Math.round(34/T);
function reset(keepTry,quick){rec=[];P.practice=false;build();if(!keepTry)attempts=1;P.best=0;P.crashes=0;P.time=0;P.won=0;P.prevBest=null;P.bails=0;
  P.cd=(quick?1:3)*CD_BEAT; P.go=0; P.cdFull=!quick;
  P.spawn={x:40,y:gAt(40)-R};respawn();cam.x=P.x-W/2;cam.y=P.y-H/2;}
function respawn(){
  P.x=P.spawn.x;P.y=P.spawn.y;P.spd=4*T;P.vx=4*T;P.vy=0;
  P.ground=true;P.ang=0;P.lean=0;P.rot=0;P.curl=1;P.prevVy=0;
  P.air=0;P.dead=0;P.bail=0;P.sqT=0;P.press=0;P.wasLoad=false;P.relT=-999;P.relAmt=0;P.popQ=0;P.cased=0;P.splat=0;P.rail=null;P.ramp=null;P.loop=null;P.loopT=0;P.tube=null;P.tubeT=0;fx.length=0;
}
function note(t,c){fx.push({t:0,text:t,col:c,x:P.x,y:P.y-30});}
// A BAIL, not a death. A run that ends is not a slower time, it is no time at all,
// which is useless on a leaderboard and brutal for a new rider. So a bad landing now
// costs you SPEED and a second of tumbling, and the run continues.
// Every number here is fixed -- no randomness in the penalty -- so the same mistake
// costs the same on every machine. Only the dust is random, and that is cosmetic.
const BAIL_T=44;        // frames of tumble (at T=1)
const BAIL_KEEP=0.34;   // fraction of speed you carry out of it
const BAIL_MIN=3.0;     // ...but never dead stopped, or you cannot get going again
// Frames stalled on the bank after a splash. Tuned so a drowning costs ~2.0s against a
// rider who CLEARS the gap, matching the 2.1s a bail costs -- every kind of failure
// should be priced the same, or the cheapest one becomes a tactic.
const DROWN_STALL=60;
const SQ_T=Math.round(8/T);               // frames of pancake on an impact
function bail(msg,col){
  if(P.bail>0)return;                       // already down; do not stack penalties
  P.bail=Math.round(BAIL_T/T);
  P.sqT=SQ_T;                               // ONLY a bail pancakes the pod
  P.bails=(P.bails||0)+1;
  P.spd=Math.max(BAIL_MIN*T,P.spd*BAIL_KEEP);
  P.vx=P.spd*0.9;                            // keep drifting forward through it
  P.press=0;P.wasLoad=false;P.popQ=0;        // drop any charge you were holding
  P.rail=null;P.ramp=null;
  note(msg||'BAIL','#ffd23f');
  if(col)for(let i=0;i<30;i++)dust.push({x:P.x,y:P.y,t:0,life:24+Math.random()*18,
    col:col,vx:(Math.random()-0.5)*4.5,vy:-Math.random()*4.2});
  else puff(26,P.x,P.y+R,4.4);
}
// Water is the one thing you cannot tumble out of. Respawning at the last CHECKPOINT
// looked right until the checkpoint turned out to sit BEFORE the gap -- you came back,
// rolled straight down the bank and splashed again, forever. So a splash now sets you
// down on dry land past the far edge, stopped. That loop is impossible by construction,
// and the penalty is honest: you keep the distance but pay for it from zero speed.
function drown(w){
  if(P.bail>0)return;
  P.bails=(P.bails||0)+1;
  // "Clear of the water" means past the drawn span (w.b), NOT above the surface line:
  // the far bank crests right at w.b and the landing face descends from there, so
  // anything past it is below w.y while still being dry ground. Setting down 30px out
  // left the rider at the waterline, which read as still being in it.
  let x=Math.round(w.b)+100;                 // up on the bank, visibly on dry land
  for(const o of waters)                     // and never inside a DIFFERENT pool
    if(x>o.a-20&&x<o.b+20)x=Math.round(o.b)+100;
  x=Math.min(x,MAXW-3);
  P.x=x;P.y=gAt(x)-R;
  P.spd=0;P.vx=0;P.vy=0;P.ground=true;
  P.ang=angAt(x);P.lean=P.ang;P.prevVy=0;P.rot=0;P.curl=1;P.air=0;
  P.rail=null;P.ramp=null;P.loop=null;P.loopT=0;P.tube=null;P.tubeT=0;
  P.press=0;P.wasLoad=false;P.popQ=0;
  P.bail=Math.round(DROWN_STALL/T);          // stalled on the bank, then the throttle is yours
  note('SPLASH!','#8fe0f4');
  for(let i=0;i<26;i++)dust.push({x:P.x,y:P.y,t:0,life:22+Math.random()*16,
    col:'#8fe0f4',vx:(Math.random()-0.5)*4,vy:-Math.random()*4});
}
function puff(n,x,y,p){for(let i=0;i<n;i++)dust.push({x,y,t:0,life:18+Math.random()*14,
  vx:(Math.random()-.5)*p,vy:-Math.random()*p*.6});}

/* ---------- step ---------- */
const gasOn=()=>key.gas&&!(P.bail>0);   // throttle is dead until you are back up
function step(){
  if(!started||P.won)return;
  if(P.cd>0){
    P.cd--;
    if(P.cd===0)P.go=CD_GO;
    // the view eases onto the start line during the count, so GO is not also a jump
    // cut -- reset() parks the camera at P.x-W/2, which is not the riding offset
    cam.x+=((Math.max(0,P.x-W*0.36))-cam.x)*0.16;
    cam.y+=((P.y-H*0.52)-cam.y)*0.16;
    return;                     // no physics, no input, and crucially no P.time++
  }
  if(P.go>0)P.go--;
  P.time++;
  // Physics keeps running through a bail -- the old branch froze everything, then
  // called reset() and put you back on the start line.
  if(P.bail>0){P.bail--;P.rot+=0.34*(P.vx<0?-1:1);}
  if(P.sqT>0)P.sqT--;
  if(P.dead>0){P.dead--;P.rot+=0.3;P.vy+=GRAV;P.x+=P.vx;P.y+=P.vy;
    if(!P.dead)respawn();return;}

  // ball on the dirt, unfurls in the air
  // only unfurl for real air. a 3-frame hop used to pop the ball open, which made
  // the whole thing flicker.
  // On the rail he gets up on his legs and slides. Everywhere else, ball.
  const grinding=P.rail||(P.ramp&&P.ramp.grind);
  const wantBall=(P.ground&&!grinding)||(!P.ground&&P.air<15);
  P.curl+=((wantBall?1:0)-P.curl)*(wantBall?0.22:0.14)*T;

  if(P.tube){
    const t=P.tube;
    P.tubeT++;
    const u=Math.min(1,P.tubeT/TUBE_FRAMES);
    const e=u*u*(3-2*u);                       // ease so the exit is not a jolt
    P.x=t.mx+(t.ex-t.mx)*e;
    P.y=(t.my+(t.ey-t.my)*e)-R;
    P.rot+=0.22;                               // still tumbling, unseen
    P.ang=0;P.lean=0;P.curl=1;
    if(P.tubeT>=TUBE_FRAMES){                  // out the bottom, carrying more speed
      P.tube=null;
      P.spd=P.tubeSpd*TUBE_BOOST;
      P.ground=true;P.y=gAt(P.x)-R;P.ang=angAt(P.x);P.lean=P.ang;
      P.prevVy=P.spd*Math.sin(P.ang);P.vx=P.spd;P.vy=0;
    }
    P.time+=1/60;
    // Record here too. This branch returns early, so the frames spent inside the tube
    // never reached the recorder at the bottom of step() -- the ghost teleported from
    // the mouth to the exit and was impossible to stay with.
    if(started&&!P.won&&P.splat<=0)rec.push(P.x,P.y,P.rot);
    return;
  }
  if(P.loop){
    // Riding the circle. Speed trades against height exactly as it should:
    // v^2 = v0^2 - 2*g*(height gained). Too slow at the top and you come off it.
    const L=P.loop;
    if(gasOn())P.spd+=ACCEL*0.55;
    const th=P.loopT;
    const climbed=L.r*(1-Math.cos(th));
    const v2=P.loopV2-2*GRAV*climbed;
    if(v2<=0.5){                                    // stalled on the way up
      P.loop=null;P.ground=false;P.air=0;P.vx=0;P.vy=0;
      note('NOT ENOUGH','#ff6b6b');
    }else{
      P.spd=Math.sqrt(v2);
      // contact check: need the track pushing on you, v^2/r >= g*cos(th)
      if(th>0.9&&th<5.4&&v2/L.r < GRAV*Math.cos(Math.PI-th)*0.92){
        P.loop=null;P.ground=false;P.air=0;
        P.vx=P.spd*Math.cos(th);P.vy=-P.spd*Math.sin(th);
        note('OFF THE LOOP','#ff6b6b');
      }else{
        P.loopT+=P.spd/L.r;
        P.x=L.cx+L.r*Math.sin(P.loopT);
        P.y=L.cy+L.r*Math.cos(P.loopT)-R;
        P.ang=-P.loopT;P.lean=P.ang;P.rot=P.ang;
        P.spin=P.spd/R;
        if(P.time%2===0)dust.push({x:P.x,y:P.y+R*0.8,t:0,life:12+Math.random()*10,
          col:'#ffe9a0',vx:-Math.random()*2,vy:-Math.random()*1.5});
        if(P.loopT>=Math.PI*2){                     // back round to the bottom
          P.loop=null;P.ground=true;P.loopT=0;
          P.y=gAt(P.x)-R;P.ang=angAt(P.x);P.lean=P.ang;P.prevVy=P.spd*Math.sin(P.ang);
          note('LOOP!','#e85fd0');
        }
      }
    }
  } else if(P.ground&&P.ramp){
    // riding the shovel: a straight incline, then nothing at the end of the blade
    const rp=P.ramp;
    const ra=Math.atan2(rp.y1-rp.y0, rp.b-rp.a);
    if(gasOn())P.spd+=ACCEL;
    P.spd+=SLOPE*Math.sin(ra);                    // it is a climb, so it costs a little
    P.spd-=DRAG+P.spd*P.spd*QDRAG;
    if(P.spd<0.4)P.spd=0.4;
    if(rp.grind){
      P.spin=(P.spin||0)*0.80;P.rot=angLerp(P.rot,ra,0.30);
      P.grindT=(P.grindT||0)+1;
      const n=Math.min(4,1+Math.floor(P.spd*0.22));
      for(let i=0;i<n;i++){const hot=Math.random();
        dust.push({x:P.x-R*0.35+Math.random()*4,y:P.y+R*0.85,t:0,life:9+Math.random()*16,
          col:hot>0.82?'#ffffff':hot>0.5?'#ffe9a0':'#ff9e3d',
          vx:-(1.2+Math.random()*3.2)-P.spd*0.14,vy:-(Math.random()*2.4)-0.6});}
    }else{
      P.spin=P.spd/R;P.rot+=P.spin;
    }
    P.ang=ra;P.lean=ra;
    P.x+=P.spd*Math.cos(ra);
    P.y=rampYat(rp,P.x)-R;
    P.prevVy=P.spd*Math.sin(ra);
    if(P.x>=rp.b){                                // off the end of the blade
      const wasGrind=rp.grind;
      P.ramp=null;P.grindT=0;P.ground=false;P.air=0;P.launchSpd=P.spd;
      P.vx=P.spd*Math.cos(ra);P.vy=P.spd*Math.sin(ra);
      note(wasGrind?'RAIL!':'LAUNCH','#ffd24a');
      for(let i=0;i<10;i++)dust.push({x:P.x,y:P.y+R,t:0,life:14+Math.random()*10,
        col:'#ffe9a0',vx:-Math.random()*2.5,vy:-Math.random()*2});
    }
  } else if(P.ground&&P.rail){
    // GRINDING: steel, not dirt. Barely any resistance, so a clean rail hit
    // actually pays you speed instead of costing it.
    const rd=6,ra=Math.atan2(railYat(P.rail,P.x+rd)-railYat(P.rail,P.x-rd),2*rd);
    if(gasOn())P.spd+=ACCEL*0.75;
    P.spd+=SLOPE*Math.sin(ra);                 // a downhill rail pays you speed
    P.spd-=DRAG*0.15+P.spd*P.spd*QDRAG*0.20;
    // no rolling on steel -- he stands and slides, body lying along the bar
    P.spin=(P.spin||0)*0.80;          // bleed off the roll; steel does not spin you
    P.rot=angLerp(P.rot,ra,0.30);
    P.ang=ra;P.lean=ra;
    P.x+=P.spd*Math.cos(ra);P.y=railYat(P.rail,P.x)-R;P.prevVy=P.spd*Math.sin(ra);
    P.grindT=(P.grindT||0)+1;
    // sparks off the contact point, streaming back and dying out
    const spark=Math.min(4,1+Math.floor(P.spd*0.22));
    for(let i=0;i<spark;i++){
      const hot=Math.random();
      dust.push({x:P.x-R*0.35+Math.random()*4,y:P.y+R*0.85,t:0,
        life:9+Math.random()*16,
        col: hot>0.82?'#ffffff' : hot>0.5?'#ffe9a0' : '#ff9e3d',
        vx:-(1.2+Math.random()*3.2)-P.spd*0.14,
        vy:-(Math.random()*2.4)-0.6});
    }
    // BUNNY HOP off the bar. SPACE does nothing while grinding -- the preload code
    // lives in the ground branch -- so it is free to mean "hop" here, with no tap/hold
    // timing and no latency. This is also the only way to leave a rail while AIRBORNE,
    // which is the state the attach check needs to catch the next one.
    if(key.brake&&!P.hopLatch){
      P.hopLatch=true;
      const ry2=(P.rail.y2===undefined?P.rail.y:P.rail.y2);   // same guard railYat uses
      const ra=Math.atan2(ry2-P.rail.y,P.rail.b-P.rail.a);
      P.rail=null;P.grindT=0;
      P.ground=false;P.air=0;P.launchSpd=P.spd;
      P.vx=P.spd*Math.cos(ra);
      P.vy=P.spd*Math.sin(ra)-HOP;                   // straight up out of the grind
      P.curl=1;
    }
    if(!key.brake)P.hopLatch=false;                  // one hop per press
    if(P.rail&&P.x>P.rail.b){                        // off the end
      P.rail=null;P.grindT=0;
      const g=gAt(P.x);
      if(Math.abs((P.y+R)-g)<16){                     // bar ends level with the bank:
        P.ground=true;P.y=g-R;P.ang=angAt(P.x);       // hand over to the dirt rather
        P.lean=P.ang;P.prevVy=P.spd*Math.sin(P.ang);  // than launching into the air
      }else{
        P.ground=false;P.air=0;P.launchSpd=P.spd;P.vx=P.spd;P.vy=0;
      }
    }
  } else if(P.ground){
    const a=P.ang;
    if(gasOn())P.spd+=ACCEL*(P.spd<4*T?2.6:1); // strong low end, so you can never grind to 0
    else if(P.spd>3.2*T)P.spd-=0.160*T*T;               // let off and you genuinely slow down
    // hold DOWN to squash into the hill. it scrubs a little speed, and if you let
    // go as the crest throws you, that stored load comes back as extra air.
    if(key.brake){
      P.press=Math.min(1,P.press+0.055*T);
      // Loading scrubs speed on the flat and downhill -- that is the trade. But
      // squashing into a CLIMBING face should not also brake you: you are compressing
      // against the hill, not dragging. It taper to nothing as the slope steepens,
      // otherwise you cannot hold a load up a face without stalling out.
      const scrub = P.ang>=0 ? 1 : Math.max(0, 1 + P.ang*2.6);
      P.spd-=BRAKE*0.45*scrub;
      P.wasLoad=true;
    }else{
      // latch ONCE on the release edge. refreshing this every frame while the
      // compression decayed meant the timestamp landed after the launch itself.
      if(P.wasLoad&&P.press>0.30){P.relT=P.time;P.relAmt=P.press;}
      P.wasLoad=false;
      P.press=Math.max(0,P.press-0.14*T);
    }
    P.spd+=SLOPE*Math.sin(a);                 // gravity down the face
    P.spd-=DRAG+P.spd*P.spd*QDRAG+P.spd*P.spd*P.spd*CDRAG;   // resistance, steep at the top end
    if(P.spd<0)P.spd=0;

    P.spin=P.spd/R;P.rot+=P.spin;   // record the roll rate; the shell blur needs it
    P.lean=a;
    const ox=P.x, oy=gAt(P.x);
    P.x+=P.spd*Math.cos(a);
    const ny=gAt(P.x), vy=ny-oy;
    if(vy-P.prevVy>GRAV*2.1/T&&P.spd>2.5*T){                 // ground dropped away: airborne
      // Leave from the point we were actually standing on. Advancing x first and
      // keeping the old y buried the isopod inside steep climbing faces -- it then
      // flew up through the takeoff ramp of a dirt jump.
      P.x=ox;P.y=oy-R;
      P.ground=false;P.air=0;P.launchSpd=P.spd;
      P.vx=P.spd*Math.cos(a);P.vy=P.prevVy+GRAV;
      const dt=P.time-(P.relT||-999);
      if(dt>=0&&dt<=POP_WINDOW&&(P.relAmt||0)>0.30){
        const q=(1-Math.abs(dt-POP_SWEET)/POP_WINDOW)*P.relAmt;
        if(q>0.05){
          P.vy-=POP*q; P.vx+=POP*0.35*q*Math.cos(a);
          puff(9,P.x,P.y+R,3.4);
          note(q>0.62?'BOOSTED!':'pop', q>0.62?'#d6f27a':'#9ff0c0');
          P.popQ=q;
        }
      }
      P.relT=-999;
    }else{P.y=ny-R;P.prevVy=vy;P.ang=angAt(P.x);}
  }else{
    P.air++;
    if(key.back)P.lean-=LEAN;
    if(key.fwd)P.lean+=LEAN;
    // a thrown body swings to face its own arc: landings work by default,
    // leaning is for fine-tuning rather than survival
    if(P.air>4/T){
      // set up for the landing: half the arc you are on, half the ground you are
      // heading for. this is what stops long airs from landing badly.
      const fl=Math.atan2(P.vy,P.vx), gr=angAt(P.x+P.vx*12);
      P.lean=angLerp(P.lean,fl+norm(gr-fl)*0.55,0.055*T);
    }
    // angle of attack: nose up and you hang, nose down and you drop onto the landing.
    // leaning is something you use, not something that punishes you.
    const aoa=norm(P.lean-Math.atan2(P.vy,P.vx));
    P.vy+=GRAV*AIR*(1+Math.max(-0.45,Math.min(0.45,aoa))*0.55);
    const px=P.x,py=P.y;
    P.x+=P.vx;P.y+=P.vy;
    const pr=P.rot;
    P.rot=angLerp(P.rot,P.lean,0.22);         // spin settles into the lean
    P.spin=norm(P.rot-pr);
    const g=gAt(P.x);
    // Test whether we CROSSED the surface, not whether we happen to be falling.
    // Requiring vy>0 meant flying upward into a climbing face -- the takeoff ramp
    // of a dirt jump -- registered no collision at all, and you went through it.
    // Falling: land on contact. Rising: land once you are genuinely buried. Off a
    // lip a pixel of overlap is normal and clears as the crest falls away, but
    // flying up into a ramp face buries you and must resolve.
    // Rails catch you from above only, so you can fly under one. A slow rider is
    // already below the bar by the time they reach it; a fast one is still above it
    // and sails over. Only a judged hit lands on top.
    let hitRail=false;
    for(const rl of rails){
      const ry=railYat(rl,P.x), pry=railYat(rl,px);
      if(P.x>rl.a&&P.x<rl.b&&P.vy>0&&py+R<=pry+4&&P.y+R>=ry){
        if(Math.abs(norm(P.lean))>1.0){bail('SIDEWAYS');return;}  // came down on it sideways
        P.rail=rl;P.ground=true;P.y=ry-R;P.ang=0;P.lean=0;P.prevVy=0;
        P.spd=Math.max(0,P.vx)*1.02;P.vy=0;P.air=0;
        note('GRIND!','#d6f27a');
        for(let i=0;i<12;i++)dust.push({x:P.x,y:P.y+R,t:0,life:14+Math.random()*10,
          col:'#ffe9a0',vx:-Math.random()*3.5,vy:-Math.random()*1.8});
        hitRail=true;break;
      }
    }
    if(!hitRail&&P.y+R>=g&&(P.vy>0||P.y+R>g+2))land(g);
  }

  P.best=Math.max(P.best,P.spd);
  // break the surface and you go under -- no speed penalty, you just drown
  for(const w of waters)
    if(P.x>w.a&&P.x<w.b&&P.y+R*0.35>w.y){drown(w);break;}
  // land on a canopy and it lobs you to the next one
  if(!P.ground&&!P.loop&&P.vy>0)
    for(const U of umbs){
      if(U.hit>0)U.hit--;
      if(P.x<U.x-U.r||P.x>U.x+U.r)continue;
      const sy=umbYat(U,P.x), py=P.y-P.vy;
      if(py+R<=sy+4&&P.y+R>=sy&&!U.cool){
        // A FIXED bounce sends you a distance that scales with your speed, so a fixed
        // spacing only ever chains at one exact pace. Size the bounce to the gap
        // instead: fast riders get a flatter hop, slow riders a higher one, and both
        // land on the next canopy. That is what makes the chain feel fluid.
        const g=GRAV*AIR, vx=Math.max(4,Math.abs(P.vx));
        const want=Math.max(2.0,Math.min(6.0,(UMB_SP*g)/(2*vx)));
        P.y=sy-R;P.vy=-want;P.air=0;
        P.spd=Math.hypot(P.vx,P.vy);
        U.hit=10;U.cool=8;
        note('BOING','#ff8a6b');
        for(let i=0;i<8;i++)dust.push({x:P.x,y:sy+6,t:0,life:14+Math.random()*10,
          col:'#ffd9d0',vx:(Math.random()-0.5)*3,vy:-Math.random()*2});
        break;
      }
    }
  for(const U of umbs)if(U.cool)U.cool--;

  // TURNTABLES. The platter surface is moving, so it drags or drives you -- but only
  // while you are actually on it. Hop across a backspinning deck and you take less of
  // it; stay glued to a forward one and you milk it. Contact time is the skill.
  for(const pl of platters){
    pl.spin=(pl.spin||0)+pl.dir*0.13;
    if(!P.ground||P.x<pl.a||P.x>pl.b)continue;
    P.spd+=DECK_PULL*pl.dir;
    if(P.spd<0.6)P.spd=0.6;
    if(P.time%4===0)
      for(let i=0;i<2;i++)dust.push({x:P.x-pl.dir*8,y:P.y+R*0.9,t:0,life:12+Math.random()*8,
        col:pl.dir>0?'#57f0d0':'#ff5fc8',vx:-pl.dir*(1+Math.random()*2),vy:-Math.random()*1.2});
  }

  // TUBE SLIDE capture. Deliberately NOT inside the grounded guard below: you meet the
  // mouth in mid-air, so a ground-only check can never fire. It also must not sit
  // between that guard and its for-loop, which is what left the loop entry unguarded.
  if(!P.tube&&!P.loop)
    for(const t of tubes)
      if(P.x>t.mx-t.grab&&P.x<t.mx+t.grab&&
         Math.abs((P.y+R)-t.my)<t.grabY){
        P.tube=t;P.tubeT=0;P.tubeSpd=P.spd;
        P.rail=null;P.ramp=null;P.ground=false;
        break;
      }

  // roll into a loop and you are committed to the circle
  if(P.ground&&!P.loop&&!P.ramp&&!P.rail)
    for(const L of loops)
      if(P.x>L.a-6&&P.x<L.a+26&&P.spd>3){
        P.loop=L;P.loopT=0;P.loopV2=P.spd*P.spd;
        P.x=L.cx;P.y=L.cy+L.r-R;break;
      }
  // roll onto the shovel and you are on it until it runs out
  if(P.ground&&!P.ramp&&!P.rail)
    for(const r of ramps)
      if(P.x>r.a&&P.x<r.b&&Math.abs((P.y+R)-rampYat(r,P.x))<26){P.ramp=r;break;}
  // and the castle is solid
  for(const c of castles){
    if(c.gone)continue;
    if(P.x+R*0.7>c.x-c.w/2&&P.x-R*0.7<c.x+c.w/2&&P.y+R>c.y-c.h){
      c.gone=18;bail('SANDCASTLE!','#f0dda6');
      for(let i=0;i<26;i++)dust.push({x:c.x,y:c.y-c.h*Math.random(),t:0,
        life:16+Math.random()*16,col:'#e8d199',vx:(Math.random()-0.5)*5,vy:-Math.random()*3.4});
      break;
    }
  }
  for(const c of checks)if(!c.hit&&P.x>c.x){c.hit=true;P.spawn={x:c.x,y:c.y-R};}
  if(started&&!P.won)rec.push(P.x,P.y,P.rot);   // 3 numbers per frame; a bail is part
                                                // of the line, so the ghost keeps it
  if(!P.won&&P.x>FINISH){
    P.won=P.time;
    // stash the old best FIRST -- read it after the overwrite and every PB shows 0.00
    P.prevBest=bestT[levelIdx];
    if(SIM||P.practice){}
    else if(bestT[levelIdx]===null||P.won<bestT[levelIdx]){
      bestT[levelIdx]=P.won; ghost[levelIdx]=rec.slice();   // new best -> new ghost
      saveBest(); saveGhosts();
    }else if(!ghost[levelIdx]){
      // a best time restored from storage with no line saved alongside it (or a save
      // written before ghosts persisted) -- take this run so there is something to race
      ghost[levelIdx]=rec.slice(); saveGhosts();
    }
  }

  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t++;f.y-=.5;if(f.t>50)fx.splice(i,1);}
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.t++;d.x+=d.vx;d.y+=d.vy;d.vy+=.1;
    if(d.t>d.life)dust.splice(i,1);}

  // If anything ever puts a non-finite number into the player state again, the world
  // stops drawing and the finish line can never fire, because NaN>FINISH is false --
  // which reads as a total freeze. Recover to the last checkpoint instead.
  if(!Number.isFinite(P.x+P.y+P.vx+P.vy+P.spd)){
    P.spd=4*T;respawn();note('GLITCH \u2014 RECOVERED','#ff6b6b');
  }
  if(!Number.isFinite(cam.x)||!Number.isFinite(cam.y)){cam.x=P.x-W/2;cam.y=P.y-H/2;}

  P.camSpd=(P.camSpd||0)+(P.spd-(P.camSpd||0))*0.08;
  const lead=Math.min(210,P.camSpd*15/T);
  cam.x+=((P.x-W*0.36+lead)-cam.x)*0.10;
  // flying over a valley leaves the ground far below; drop the view so you can
  // still see where you are coming down
  let ty=P.y-H*0.52;
  if(!P.ground)ty+=Math.min(130,Math.max(0,(gAt(P.x)-P.y)*0.35));
  cam.y+=(ty-cam.y)*0.08;
  cam.x=Math.max(0,cam.x);
}

function land(g){
  const a=angAt(P.x);
  P.ground=true;P.y=g-R;P.ang=a;
  const inSpd=Math.hypot(P.vx,P.vy);
  // Land on the downslope and you keep nearly everything. Overshoot onto the climb
  // out the back and you pay for it -- that is what makes reading the hill matter.
  const floor=a>0.04?0.86:0.44;
  const proj=Math.max(inSpd*floor,Math.max(0,P.vx*Math.cos(a)+P.vy*Math.sin(a)));
  // Settle onto the slope carrying the rate the ground itself is falling at. Zeroing
  // this made the next frame look like the ground had dropped away, so the isopod
  // re-launched instantly and chattered down every descent.
  const settle=()=>{P.vy=0;P.lean=a;P.prevVy=P.spd*Math.sin(a);};

  if(P.air<14/T){                      // skipped over a bump: carry on, no penalty
    P.spd=Math.max(P.launchSpd||0,proj);settle();return;}
  // How hard you meet the ground -- and the sign matters. Falling STEEPER than the
  // face means you slam into it. Falling shallower just means you settle onto a
  // slope already running away from you, which is a landing, not a crash.
  const impact=norm(Math.atan2(P.vy,P.vx)-a);
  // Since a case now ends the run, this has to mean 'you genuinely blew it' rather
  // than 'you were a bit off'. Tight enough and no line through the course exists.
  if(impact>0.86&&inSpd>10*T){
    bail('CASED');settle();return;
  }
  const diff=Math.abs(norm(P.lean-a));
  if(diff<CLEAN){
    P.spd=proj*1.10;                    // land it flush, keep the lot
    note(P.air>44?'BIG AIR':'SMOOTH','#d6f27a');puff(10,P.x,P.y+R,3);
  }else if(diff<ROUGH){
    P.spd=proj*0.88;
    note('ROUGH','#ffd23f');puff(8,P.x,P.y+R,2.4);
  }else{
    bail('SKETCHY');
  }
  settle();
}

let decor=[];
function buildDecor(){decor=[];let s=7331;
  const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  // wide spread on height and width -- uniform trees read as wallpaper
  for(let x=-200;x<LEN+400;x+=64)decor.push({x:x+rnd()*52,s:.28,h:40+rnd()*170,w:10+rnd()*34,k:rnd()});
  for(let x=-200;x<LEN+400;x+=104)decor.push({x:x+rnd()*72,s:.55,h:70+rnd()*210,w:16+rnd()*44,k:rnd()});}

// MIRROR TILING. A plate whose left edge does not match its right edge shows a hard
// vertical cut every time it repeats. Flipping every other copy makes adjacent tiles
// share identical edge pixels, so the seam cannot exist -- no blending needed.
function tilePlate(img,ox,yTop,dw,dh){
  const first=Math.floor(ox/dw);
  for(let n=first-1;n*dw<ox+W+dw;n++){
    const x=n*dw-ox+0;                    // ox already carries the scroll offset
    if(x>W+2||x+dw<-2)continue;
    if(((n%2)+2)%2===0){
      ctx.drawImage(img,Math.round(x),Math.round(yTop),Math.round(dw),Math.round(dh));
    }else{
      ctx.save();
      ctx.translate(Math.round(x)+Math.round(dw),Math.round(yTop));
      ctx.scale(-1,1);
      ctx.drawImage(img,0,0,Math.round(dw),Math.round(dh));
      ctx.restore();
    }
  }
}
// ---- PLACEMENT EDITOR -------------------------------------------------------
// Press P to toggle. Click to drop the selected asset, right-click to remove the one
// under the cursor, [ and ] to cycle assets, arrows to pan. X exports the list.
// Set false before sharing. Props you have already placed still draw and still
// collide -- only the tools to change them go away. This is a client-side flag, so
// anyone reading the file can flip it back; it hides the feature, it does not lock it.
const EDITOR=false;

let editing=false, editSel=0, editPan=0;
// After a click the new prop stays ACTIVE for adjustment. Clicking again confirms it
// rather than dropping a second one, so you tune each piece before moving on.
let editActive=-1;
// A proper free camera. editPan only offset the markers, so the view stayed locked to
// the pod and you could not scroll to the part of the track you wanted to work on.
let editCamX=null, editHeld={l:false,r:false,u:false,d:false}, editFast=false;
let editDrag=-1, editGrabDX=0, editMoved=false;

// Which prop is under the cursor, tested against its real sprite box rather than a
// bare x distance -- so a big bus is grabbable anywhere along it, not just at its pin.
function propAt(wx,wy){
  const list=PROPS[LEVELS[levelIdx].n]||[];
  for(let i=list.length-1;i>=0;i--){          // topmost first
    const p=list[i], A=ASSETS[p.a];
    if(!A||!A.img)continue;
    const sc=(A.scale||1)*(p.s||1);
    const w2=A.img.width*sc, h2=A.img.height*sc;
    const base=(A.anchor==='free')?(p.y||0):gAt(p.x);
    const top=base-h2+(p.dy||0);
    if(wx>=p.x-w2/2-6&&wx<=p.x+w2/2+6&&wy>=top-6&&wy<=base+6)return i;
  }
  return -1;
}
function editKeys(){ return Object.keys(ASSETS); }
function editWorldX(mx){ return mx+cam.x; }

     '<div style="padding:8px 9px;background:#16301f;border-bottom:1px solid #2f5a3c;'
    +'display:flex;justify-content:space-between;align-items:center">'
    +'<b>PLACE MODE</b><span id="edClose" style="cursor:pointer;color:#8fb49c">X</span></div>'
    +rows
    +'<div style="padding:7px 9px;border-top:1px solid #2f5a3c;color:#7fa88c;line-height:1.6">'
    +list.length+' placed on '+LEVELS[levelIdx].n+'</div>'
    +(editActive>=0&&list[editActive]
      ? '<div style="padding:7px 9px;border-top:1px solid #2f5a3c;background:#12291b;line-height:1.7">'

        +((list[editActive].s||1).toFixed(1))+'<br>'
        +'<span style="color:#9fc7ad">Q E</span> rotate &nbsp; '
        +'<span style="color:#9fc7ad">+ -</span> size<br>'
        +'<span style="color:#9fc7ad">arrows</span> nudge (shift = far)<br>'
        +'<span style="color:#9fc7ad">scroll</span> rotate<br>'
        +'<span style="color:#9fc7ad">R</span> reset &nbsp; '
        +'<span style="color:#9fc7ad">del</span> remove<br>'
        +'<span style="color:#9fc7ad">enter</span> or click to place next'
        +'</div>'
      : '<div style="padding:7px 9px;border-top:1px solid #2f5a3c;color:#7fa88c;line-height:1.6">'
        +'click empty space to place<br>drag to move &nbsp; right-click removes<br>'
        +'click empty space to place<br>'
        +'drag an existing one to move it<br>'
        +'<span style="color:#9fc7ad">scroll</span> change asset<br>'
        +'<span style="color:#9fc7ad">arrows</span> fly around (shift = fast)<br>'
        +'<span style="color:#9fc7ad">P</span> exit &mdash; game is paused'
        +'</div>')
    +'<div style="display:flex;border-top:1px solid #2f5a3c">'
    +'<div id="edSave" style="flex:1;padding:8px 6px;text-align:center;cursor:pointer;'
    +'background:#1d3f29;color:#d6f27a;border-right:1px solid #2f5a3c">SAVE</div>'
    +'<div id="edExport" style="flex:1;padding:8px 6px;text-align:center;cursor:pointer;'
    +'background:rgba(255,255,255,.06);color:#9fc7ad">EXPORT</div></div>'
    +'<div id="edMsg" style="padding:0 9px 7px;color:#7fa88c;text-align:center;min-height:14px"></div>';
  box.querySelectorAll('[data-i]').forEach(el=>{

  const c=box.querySelector('#edClose'); if(c)c.onclick=()=>{editing=false;editPanel();};
  const x=box.querySelector('#edExport'); if(x)x.onclick=()=>exportProps();
  const sv=box.querySelector('#edSave');
  if(sv)sv.onclick=()=>{
    const ok=savePropsLocal();
    const m=box.querySelector('#edMsg');
    if(m)m.textContent=ok?'saved to this browser':'could not save (storage blocked)';
    if(m)m.style.color=ok?'#8fd07a':'#c98';
  };
}

// Only the on-canvas markers stay drawn -- they have to line up with the world.
function drawEditor(){
  const list=PROPS[LEVELS[levelIdx].n]||[];
  for(const p of list){
    const sx=Math.round(p.x-cam.x);
    if(sx<-20||sx>W+20)continue;
    const sy=Math.round(gAt(p.x)-cam.y);
    const on=(list.indexOf(p)===editActive);
    ctx.strokeStyle=on?'rgba(255,220,90,.95)':'rgba(214,242,122,.55)';
    ctx.lineWidth=on?2:1;
    ctx.beginPath();ctx.moveTo(sx,sy-(on?18:10));ctx.lineTo(sx,sy+(on?18:10));ctx.stroke();
    ctx.fillStyle=on?'rgba(255,220,90,.95)':'rgba(214,242,122,.55)';
    ctx.fillRect(sx-(on?3:2),sy-(on?3:2),on?6:4,on?6:4);
    if(on){ ctx.strokeStyle='rgba(255,220,90,.5)';
      ctx.beginPath();ctx.arc(sx,sy,26,0,6.3);ctx.stroke(); }
  }
}
// Save keeps your placements on this machine so they survive a reload. Export is still
// how you bake them into the file itself to send to anyone else.
const PROPKEY='isopodRider.props.v1';
function savePropsLocal(){
  try{ localStorage.setItem(PROPKEY,JSON.stringify(PROPS)); return true; }
  catch(e){ return false; }
}
function loadPropsLocal(){
  try{
    const raw=localStorage.getItem(PROPKEY);
    if(!raw)return false;
    const blob=JSON.parse(raw);
    for(const k in blob)PROPS[k]=blob[k];
    return true;
  }catch(e){ return false; }
}
function exportProps(){
  const txt=JSON.stringify(PROPS,null,1);
  let box=document.getElementById('propBox');
  if(box){box.remove();return;}
  box=document.createElement('div');
  box.id='propBox';
  box.style.cssText='position:fixed;inset:0;background:rgba(6,10,8,.9);z-index:99;display:flex;'
    +'flex-direction:column;align-items:center;justify-content:center;gap:10px;'
    +'font-family:monospace;color:#cfe8c4;padding:24px';

  h.innerHTML='<b>Prop placements</b><br>Paste this over the <b>PROPS</b> block near the top of the file to keep them.';
  const ta=document.createElement('textarea');
  ta.value=txt;ta.readOnly=true;
  ta.style.cssText='width:min(680px,90vw);height:200px;background:#0e1a12;color:#8fd07a;'
    +'border:1px solid #2f5a3c;border-radius:4px;padding:8px;font-family:monospace;font-size:11px';
  const note=document.createElement('div');

}
function drawTitle(){
  ctx.fillStyle='#0b0f14';ctx.fillRect(0,0,W,H);
  if(titleReady){
    // contain, not stretch -- the plate has a fixed aspect and squashing it looks bad
    const sc=Math.min(W/BG_TITLE.width,H/BG_TITLE.height);
    const dw=BG_TITLE.width*sc, dh=BG_TITLE.height*sc;
    ctx.drawImage(BG_TITLE,Math.round((W-dw)/2),Math.round((H-dh)/2),Math.round(dw),Math.round(dh));
  }else{
    ctx.fillStyle='#cfe8c4';ctx.font='bold 30px monospace';ctx.textAlign='center';
    ctx.fillText('ISOPOD RIDER',W/2,H/2-10);
