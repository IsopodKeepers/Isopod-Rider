<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ISOPOD RIDER</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a1410;color:#fbefd5;
    font-family:"Arial Rounded MT Bold","Trebuchet MS",Verdana,"DejaVu Sans",sans-serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;border-radius:14px;box-shadow:0 0 0 6px #8a5a2b,0 0 0 9px #5a3a1c,0 12px 40px rgba(0,0,0,.6)}
  canvas{display:block;background:#12261d;border-radius:8px}
  #hint{position:absolute;left:0;right:0;bottom:-40px;text-align:center;font-size:12px;font-weight:bold;color:#fbefd5}
  kbd{background:#fbefd5;border:2px solid #8a5a2b;border-radius:6px;padding:1px 6px;color:#5a3a1c;font-size:10px;font-weight:bold}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="760" height="420"></canvas>
  <div id="hint">
    <kbd>↑</kbd> gas &nbsp; <kbd>space</kbd> load / brake &nbsp; <kbd>←</kbd><kbd>→</kbd> lean &nbsp; <kbd>R</kbd> restart &nbsp; <kbd>M</kbd> <span id="mute">sound on</span>
  </div>
</div>
<script>
(() => {
"use strict";
const W=760,H=420,cv=document.getElementById('c'),ctx=cv.getContext('2d');
// the game thinks in a fixed 760x420 space; the backing store is sized to the real
// on-screen pixels (incl. devicePixelRatio) so lines and text stay crisp when scaled
let SC=1;
function fit(){const s=Math.max(1,Math.min(innerWidth/W,(innerHeight-70)/H));
  cv.style.width=(W*s|0)+'px';cv.style.height=(H*s|0)+'px';
  SC=s*(devicePixelRatio||1);cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);}
addEventListener('resize',fit);fit();

/* ---------- tuning ---------- */
const T=0.80;                 // time scale: same track, played slower
const VSPIN=0.65, VSPIN_MAX=0.5;  // pattern turns at this fraction of the real roll, capped just under one plate per frame so it never strobes
const GRAV=0.34*T*T, AIR=0.86;   // floatier air = more hang off every crest        // air is a touch floaty, flash-game style
const ACCEL=0.190*T*T, BRAKE=0.22*T*T, SLOPE=0.165*T*T, DRAG=0.010*T*T,
      QDRAG=0.000544, CDRAG=0.0000047/T;   // v^2 term is scale-free; v^3 term needs 1/T
const LEAN=0.055*T, R=11;
// sh = shell body, bd = rim + plate seams, hi = highlight, hd = head, lg = legs, dk = eye/antennae.
// sm = per-seam colours (optional) for shells whose lines are mixed colours.
const PODS=[
  {n:"DAN'S COSMIC DUST", sh:'#151515', dk:'#3a3a3a', bd:'#ff7ec8', hi:'#ffffff', hd:'#e6e6e6', lg:'#232329',
     sm:['#ff7ec8','#5cf07a','#ff7ec8','#ffe95c','#ff7ec8','#3a3a3a','#ff7ec8','#ff7ec8']},
  {n:'EMBER BEE',      sh:'#151515', dk:'#a8471d', bd:'#ff8a4c', hi:'#ffcf9a', hd:'#ffe0b8', lg:'#5e2410'},
  {n:'CHERRY BLOSSOM', sh:'#ff7eb6', dk:'#b0416f', bd:'#ffb3d1', hi:'#ffe0ee', hd:'#ffd6e6', lg:'#7a2c4c'},
  {n:'ZEBRA',          sh:'#151515', dk:'#4a4a54', bd:'#f0f0ea', hi:'#ffffff', hd:'#ffffff', lg:'#232329'},
  {n:'GLACIER',        sh:'#ffffff', dk:'#8aa4b8', bd:'#d3dee7', hi:'#ffffff', hd:'#f4f8fb', lg:'#6b8296'},
];
let podIdx=0, started=false;
const waters=[];   // {a,b,y} spans where falling below the surface drowns you
const rails=[];    // {a,b,y,crown} bars you can land on and grind
// The bar bows gently upward toward its middle, so its start sits right at the peak
// of your arc and it curves with you rather than sitting dead flat.
const railYat=(rl,x)=>{
  const t=Math.max(0,Math.min(1,(x-rl.a)/(rl.b-rl.a)));
  return rl.y - rl.crown*Math.sin(Math.PI*t);
};
const C=()=>PODS[podIdx];
const POP=5.2*T, POP_WINDOW=Math.round(22/T), POP_SWEET=Math.round(7/T);   // preload: hold down, release at the crest
const CLEAN=0.65, ROUGH=1.30;     // landing angle tolerances

/* ---------- terrain ----------
   Flow comes from the shape of the ground, not from a scoring system: rolling
   hills on a downhill trend, so every crest throws you and every landing is a
   descending face that hands the speed straight back.                        */
const MAXW=31000, G=new Float32Array(MAXW);
let LEN=41000, FINISH=0;
const RAIL_H=310;        // bar height above the gap floor -- set so its start sits
                         // at the peak of the jump, not below it        // how high the bar floats above the gap floor        // how far the rail floats above the dip floor
const FINALE_GAP=1.70;   // how much wider the last gap is than a normal dirt jump
const jumps=[], checks=[];

function base(x){
  return 300 + x*0.009
    - 58*Math.sin(x/430)
    - 27*Math.sin(x/281+1.3)
    - 9*Math.sin(x/152+0.7);
}
// A big rounded crest: long gentle climb, rounded top, steeper fall away. No cliff.
// You launch off it because the ground curves away faster than gravity can hold you,
// so it throws you when you are quick and just rolls over when you are slow.
// A big rounded crest: long gentle climb, rounded top, steeper fall away. No cliff.
// You launch because the ground curves away faster than gravity can hold you, so it
// throws you when you are quick and just rolls over when you are slow.
// A giant hill: eased climb, a tightly rounded top, then a long steady downslope.
// You separate right at the apex where the ground is still level, so you launch
// almost flat and the hill falls away underneath you -- which means you come down
// ONTO the downslope instead of being flung at ground that isn't angled to catch you.
function giantHill(x0,gUp,climb,Wt,gDn,desc,gRise,riseLen,flat){
  if(flat===undefined)flat=0.24;   // how much the landing eases off toward the runout
  const segA=130, segE=140, ss=t=>t*t*(3-2*t);
  const prof=[]; let y=0;
  const push=(len,f)=>{for(let i=0;i<len;i++){y+=f(i/len);prof.push(y);}};
  push(segA, t=>-gUp*ss(t));                 // ease off the flat into the climb
  push(climb, ()=>-gUp);                     // steady climb
  push(Wt,   t=>-gUp+(gUp+gDn)*ss(t));       // rounded top: this is the launch
  push(desc, t=>gDn*(1-flat*ss(t)));         // landing: steep on impact, flattens out
  push(segE, t=>gDn*(1-flat)*(1-ss(t)));     // settle back to level
  push(riseLen, t=>-gRise*Math.sin(Math.PI*t)); // climb out: overshoot the face and you hit this
  for(let i=0;i<prof.length&&x0+i<MAXW;i++)G[x0+i]+=prof[i];
  const tot=prof[prof.length-1];
  for(let x=x0+prof.length;x<MAXW;x++)G[x]+=tot;
  return {crest:x0+segA+climb+Math.round(Wt*0.5), end:x0+prof.length};
}
// An M: hump, dip, hump. Roll it slow and you drop into the middle and take the
// second hump on its own. Arrive fast and you clear the whole thing onto the far
// downslope. Come in between and you case the up-face of the second hump.
// A built dirt jump: steep takeoff lip, a real gap, then a separate landing mound
// whose face is angled to catch you. Nothing rounded about it -- you either commit
// and clear the gap onto the landing, or you case the up-face of the mound.
function dirtJump(x0,H,gapMul){
  if(gapMul===undefined)gapMul=1;
  const ss=t=>t*t*(3-2*t);
  const prof=[]; let y=0;
  const push=(len,f)=>{for(let i=0;i<len;i++){y+=f(i/len);prof.push(y);}};
  push(140, t=>-0.62*ss(t));                    // approach eases INTO the face angle
  push(Math.round(200*H), ()=>-0.62);           // steep takeoff face
  push(95, t=>-0.62+1.42*ss(t));               // tight lip: this is the kick
  const lip=prof.length;
  push(65,  ()=>0.80);                          // back of the takeoff mound
  push(60,  t=>0.80-0.75*ss(t));                // rounds into the gap floor
  push(Math.round(150*H*gapMul), ()=>0.05);     // THE GAP
  push(105, t=>0.05-0.90*ss(t));                // up-face of the landing mound
  push(70,  ()=>-0.85);
  push(75,  t=>-0.85+1.55*ss(t));               // peak of the landing mound
  push(Math.round(900*H+750), t=>0.32*(1-0.30*ss(t)));  // shallow: the ground no
                                                        // longer falls 800px away from you  // landing scales gently: a small jump still throws you far  // landing face, flattening
  push(190, t=>0.32*0.70*(1-ss(t)));
  push(470, t=>-0.22*Math.sin(Math.PI*t));      // climb out
  for(let i=0;i<prof.length&&x0+i<MAXW;i++)G[x0+i]+=prof[i];
  const tot=prof[prof.length-1];
  for(let x=x0+prof.length;x<MAXW;x++)G[x]+=tot;
  return {crest:x0+lip-52, second:x0+lip+125+Math.round(150*H*gapMul)+250, end:x0+prof.length};
}
// STEP-UP: launch off a ramp and land on a platform set at the apex of your arc.
// At the top of a jump your vertical speed is ~0, so a well-judged one touches down
// almost flat. Come in slow and you smack the face of the step instead.
// STEP-UP: launch off a ramp and land on a platform set at the apex of your arc.
// At the top of a jump your vertical speed is ~0, so a well-judged one touches down
// almost flat. Come in slow and you smack the face of the step instead.
function stepUp(x0){
  const ss=t=>t*t*(3-2*t);
  const prof=[]; let y=0;
  const push=(len,f)=>{for(let i=0;i<len;i++){y+=f(i/len);prof.push(y);}};
  // A long open run-in so you can actually reach top speed, then a short steep
  // kicker. Length here is runway, not ramp -- a long ramp bleeds the speed.
  push(300, t=>0.28*ss(t));
  push(900, ()=>0.28);                // the run-up
  push(300, t=>0.28*(1-ss(t)));       // level out so you arrive flat and fast
  push(260, ()=>0);
  push(220, t=>-0.90*ss(t));          // swing up into the kicker
  push(130, ()=>-0.90);               // The kicker. Steeper is NOT better here --
                                      // past ~0.9 you lose more speed climbing it
                                      // than the extra angle gives back.
  push(90,  t=>-0.90+1.20*ss(t));     // lip
  const lip=prof.length;
  push(60,  ()=>0.30);                // back of the ramp
  push(230, ()=>0.02);                // the gap, down at the low level
  push(170, ()=>-1.35);               // THE STEP FACE -- you need the pop to clear it -- a wall, not a ramp
  const top=prof.length;
  push(860, t=>-0.03+0.06*ss(t));     // the platform, up at apex height
  push(300, t=>0.34*ss(t));           // roll off the far side
  push(360, ()=>0.34);
  push(300, t=>0.34*(1-ss(t)));
  push(420, t=>-0.22*Math.sin(Math.PI*t));
  for(let i=0;i<prof.length&&x0+i<MAXW;i++)G[x0+i]+=prof[i];
  const tot=prof[prof.length-1];
  for(let x=x0+prof.length;x<MAXW;x++)G[x]+=tot;
  return {crest:x0+lip-40, second:x0+top, end:x0+prof.length};
}
// WATER GAP: ramp, then a flooded basin, then a landing bank on the far side.
// Come up short and you go in -- no scrubbing speed, you just drown.
// RAIL JUMP: one take-off, three outcomes. Short and you drop in the dip. Judge it
// and you land flat on the rail and grind it. Come in hot and you clear the whole
// thing and land on the far ramp. The rail sits at apex height so a hit is level.
// RAIL: a bar on stilts out over a gap, ending in mid-air. Land on it and grind,
// then fly off the END into open air and come down on the landing ramp beyond.
// Arrive hot enough and you clear the whole structure without touching it.
function railJump(x0){
  const ss=t=>t*t*(3-2*t);
  const prof=[]; let y=0;
  const push=(len,f)=>{for(let i=0;i<len;i++){y+=f(i/len);prof.push(y);}};
  push(150, t=>-0.60*ss(t));
  push(230, ()=>-0.60);                      // the take-off ramp
  push(90,  t=>-0.60+0.90*ss(t));            // lip
  const lip=prof.length;
  push(60,  ()=>0.30);
  push(150, ()=>1.30);                       // ground drops away hard
  const da=prof.length;
  push(950, ()=>0.0);                        // the gap floor, far below the bar
  const db=prof.length;
  push(110, ()=>-0.72);                      // low bank on the far side
  push(60,  t=>-0.72+0.72*ss(t));
  const top=prof.length;
  push(1150, t=>0.62*(1-0.30*ss(t)));        // the landing you come down on
  push(220, t=>0.62*0.70*(1-ss(t)));
  push(430, t=>-0.20*Math.sin(Math.PI*t));
  for(let i=0;i<prof.length&&x0+i<MAXW;i++)G[x0+i]+=prof[i];
  const tot=prof[prof.length-1];
  for(let x=x0+prof.length;x<MAXW;x++)G[x]+=tot;
  const floor=G[Math.round(x0+da+400)];
  // The bar stops well short of the far bank, so its end hangs over nothing.
  rails.push({a:x0+da+150,b:x0+da+810,y:floor-RAIL_H,crown:26});
  return {crest:x0+lip-45, second:x0+top, end:x0+prof.length};
}
function waterGap(x0,H){
  const ss=t=>t*t*(3-2*t);
  const prof=[]; let y=0;
  const push=(len,f)=>{for(let i=0;i<len;i++){y+=f(i/len);prof.push(y);}};
  push(150, t=>-0.60*ss(t));
  push(Math.round(210*H), ()=>-0.60);          // the take-off bank
  push(95,  t=>-0.60+0.92*ss(t));              // lip
  const lip=prof.length;
  push(70,  ()=>0.32);
  push(130, t=>0.32+0.85*ss(t));               // bank drops into the basin
  const wa=prof.length;
  push(Math.round(340*H), ()=>0.0);            // THE WATER
  const wb=prof.length;
  push(150, t=>1.17-2.10*ss(t));               // far bank climbs out
  push(120, ()=>-0.93);
  push(90,  t=>-0.93+1.60*ss(t));              // top of the far bank
  const top=prof.length;
  push(Math.round(820*H+700), t=>0.67*(1-0.30*ss(t)));  // landing face
  push(220, t=>0.67*0.70*(1-ss(t)));
  push(430, t=>-0.20*Math.sin(Math.PI*t));
  for(let i=0;i<prof.length&&x0+i<MAXW;i++)G[x0+i]+=prof[i];
  const tot=prof[prof.length-1];
  for(let x=x0+prof.length;x<MAXW;x++)G[x]+=tot;
  const floor=G[Math.round(x0+(wa+wb)/2)];
  waters.push({a:x0+wa-90,b:x0+wb+300,y:floor-58});
  return {crest:x0+lip-45, second:x0+top, end:x0+prof.length};
}
function mHill(x0){
  const segA=140, ss=t=>t*t*(3-2*t);
  const prof=[]; let y=0;
  const push=(len,f)=>{for(let i=0;i<len;i++){y+=f(i/len);prof.push(y);}};
  push(segA, t=>-0.34*ss(t));
  push(240, ()=>-0.34);                       // climb the first hump
  push(210, t=>-0.34+0.68*ss(t));             // crest 1 -- the launch
  const crest1=prof.length;
  push(125, ()=>0.34);                        // short back face: the slow landing
  push(105, t=>0.34-0.64*ss(t));              // through the dip
  push(105, ()=>-0.30);                       // up-face of hump 2: the case zone
  push(140, t=>-0.30+0.66*ss(t));             // crest 2
  const crest2=prof.length;
  push(1250, t=>0.36*(1-0.30*ss(t)));         // far downslope: the send-it landing
  push(320, t=>0.36*0.70*(1-ss(t)));
  push(500, t=>-0.20*Math.sin(Math.PI*t));
  for(let i=0;i<prof.length&&x0+i<MAXW;i++)G[x0+i]+=prof[i];
  const tot=prof[prof.length-1];
  for(let x=x0+prof.length;x<MAXW;x++)G[x]+=tot;
  return {crest:x0+crest1-130, second:x0+crest2-130, end:x0+prof.length};
}
const HILLS={
  //        gUp  climb  Wt   gDn   desc  gRise riseLen
  s:{p:[0.26, 160, 210, 0.28,  560, 0.20, 500]},
  m:{p:[0.30, 220, 240, 0.32,  640, 0.20, 530]},
  l:{p:[0.34, 290, 280, 0.36,  980, 0.20, 580]},
  // steep launcher: a hard climb into a TIGHT crest, so you tear off it while still
  // pointing upward instead of rolling over the top. real height, steep landing.
  p:{p:[0.50, 200, 480, 0.50, 1700, 0.20, 560, 0.10]}
};
function build(){
  jumps.length=0;checks.length=0;waters.length=0;rails.length=0;boost.hit=false;
  for(let x=0;x<MAXW;x++)G[x]=base(Math.min(x,LEN));
  for(let x=0;x<340;x++)G[x]=G[340];
  const seq='skmjdwumskg'.split('');
  let x=560;
  for(let i=0;i<seq.length&&x<LEN-5400;i++){
    const k=seq[i];
    const r = k==='g' ? railJump(x) : k==='w' ? waterGap(x,1.0) : k==='d' ? mHill(x) : k==='u' ? stepUp(x) : k==='j' ? dirtJump(x,1.15) : k==='k' ? dirtJump(x,0.62) : giantHill(x,...HILLS[k].p);
    jumps.push({x:r.crest,kind:k,start:x,second:r.second,end:r.end});
    x=r.end+(k==='j'||k==='k'?95:k==='d'||k==='u'||k==='w'||k==='g'?90:80);
  }
  // FINALE: a proper gap jump, sized so you have to commit rather than sail over it
  const fr=dirtJump(x,1.25,FINALE_GAP);
  jumps.push({x:fr.crest,kind:'j',start:x,second:fr.second});
  for(let i=1;i<=5;i++){const cx=Math.round(LEN*i/6);checks.push({x:cx,y:G[cx],hit:false});}
  FINISH=Math.min(LEN-200,fr.end+260);
}

const gAt=x=>G[Math.max(0,Math.min(MAXW-1,Math.round(x)))];
// Smooth (interpolated) sample, used ONLY for the ground-follow delta. Rounding to
// the nearest whole pixel made that delta jitter by up to the local gradient, which
// on a steep face cleared the detach threshold on its own: the isopod skipped off
// perfectly smooth ground and it wrecked preload timing just before a lip.
const gSm=x=>{
  const c=Math.max(0,Math.min(MAXW-1.001,x));
  const i=c|0, f=c-i;
  return G[i]+(G[i+1]-G[i])*f;
};
// a centred sample straddles a jump lip and reports the cliff instead of the ramp,
// which poisons the takeoff attitude. Fall back to one-sided near a discontinuity.
function angAt(x){const d=7,a=gSm(x-d),b=gSm(x),c=gSm(x+d);
  if(Math.abs(c-b)>14)return Math.atan2(b-a,d);
  if(Math.abs(b-a)>14)return Math.atan2(c-b,d);
  return Math.atan2(c-a,2*d);}
const norm=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const angLerp=(a,b,t)=>a+norm(b-a)*t;

/* ---------- sound ----------
   Effects come from the WAV files in ./sfx (see sfx/README.txt); the music is a
   looping 8-bar racing riff synthesized with WebAudio.  */
const SND=(()=>{
  const AC=window.AudioContext||window.webkitAudioContext;
  let ac=null,master=null,music=null,muted=false,nextBeat=0,beat=0,started=false;
  const muteEl=document.getElementById('mute');
  const FILES={hover:'01_ui_hover_wood_tick',click:'02_ui_click_deep_tap',select:'03_pod_select_plunk',
    confirm:'04_start_confirm_deep_chime',pull:'05_pull_string_tension',snap:'06_release_snap',
    whoomp:'07_launch_whoomp',rush:'08_air_rush_low',bounce:'09_soft_bounce_rubber',thunk:'10_hard_bounce_thunk',
    booster:'11_booster_box_pulse',mist:'12_mist_lift',pickup:'13_pickup_chime',leaf:'14_leaf_hit',
    impact:'15_ground_impact',perfect:'16_perfect_landing',over:'17_game_over_deep',fanfare:'18_high_score_deep_fanfare',
    unlock:'19_unlock_achievement',tok:'20_mute_toggle_tok'};
  const clips={};
  for(const k in FILES){const a=new Audio('sfx/'+FILES[k]+'.wav');a.preload='auto';clips[k]=a;}
  const live={};                                   // one held instance per name, for cut-offs
  function play(name,vol=1){
    if(muted||!started)return null;
    const c=clips[name];if(!c)return null;
    const a=c.cloneNode();a.volume=Math.min(1,vol);a.play().catch(()=>{});live[name]=a;return a;
  }
  function stop(name){const a=live[name];if(a){a.pause();delete live[name];}}
  function init(){
    if(ac||!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=muted?0:0.9;master.connect(ac.destination);
    music={g:ac.createGain()};music.g.gain.value=0.32;music.g.connect(master);
    nextBeat=ac.currentTime+0.1;
  }
  // racing riff: driving 8th-note bass + a lead melody, 150 bpm, loops every 8 bars
  const BPM=150,STEP=60/BPM/2;
  const BASS=[45,45,45,45,45,45,43,43, 48,48,48,48,48,48,50,50, 45,45,45,45,45,45,43,43, 50,50,50,50,52,52,53,53,
              45,45,45,45,45,45,43,43, 48,48,48,48,48,48,50,50, 41,41,41,41,43,43,43,43, 45,45,45,45,45,45,45,45];
  const LEAD=[69,0,72,0,76,0,72,0, 74,0,72,0,69,0,0,0, 69,0,72,0,76,0,79,0, 77,0,76,0,74,0,72,0,
              69,0,72,0,76,0,72,0, 74,0,76,0,77,0,0,0, 81,0,79,0,77,0,76,0, 74,0,72,0,69,0,0,0];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function schedule(){
    if(!ac||!music)return;
    while(nextBeat<ac.currentTime+0.15){
      const t=nextBeat,i=beat%64;
      const b=ac.createOscillator(),bg=ac.createGain();
      b.type='square';b.frequency.value=hz(BASS[i]);
      bg.gain.setValueAtTime(0.22,t);bg.gain.exponentialRampToValueAtTime(0.001,t+STEP*0.9);
      b.connect(bg);bg.connect(music.g);b.start(t);b.stop(t+STEP);
      if(LEAD[i]){const l=ac.createOscillator(),lg=ac.createGain();
        l.type='triangle';l.frequency.value=hz(LEAD[i]);
        lg.gain.setValueAtTime(0.28,t);lg.gain.exponentialRampToValueAtTime(0.001,t+STEP*1.8);
        l.connect(lg);lg.connect(music.g);l.start(t);l.stop(t+STEP*2);}
      if(i%4===0){const k=ac.createOscillator(),kg=ac.createGain();       // kick on the beat
        k.frequency.setValueAtTime(150,t);k.frequency.exponentialRampToValueAtTime(40,t+0.12);
        kg.gain.setValueAtTime(0.5,t);kg.gain.exponentialRampToValueAtTime(0.001,t+0.14);
        k.connect(kg);kg.connect(music.g);k.start(t);k.stop(t+0.15);}
      if(i%4===2){const h=ac.createBufferSource(),hb=ac.createBuffer(1,1200,ac.sampleRate),hd=hb.getChannelData(0);   // hat off-beat
        for(let j=0;j<hd.length;j++)hd[j]=(Math.random()*2-1)*(1-j/hd.length);
        const hf=ac.createBiquadFilter(),hg=ac.createGain();hf.type='highpass';hf.frequency.value=6000;
        h.buffer=hb;hg.gain.value=0.25;h.connect(hf);hf.connect(hg);hg.connect(music.g);h.start(t);}
      nextBeat+=STEP;beat++;
    }
  }
  return {
    start(){init();if(ac&&ac.state==='suspended')ac.resume();if(!started){started=true;play('confirm',0.9);}},
    select(){started=true;play('select',0.8);},
    toggle(){muted=!muted;if(master)master.gain.value=muted?0:0.9;muteEl.textContent=muted?'sound off':'sound on';
      if(!muted){started=true;play('tok',0.7);}},
    // called once per physics step
    update(spd,onGround,onRail,playing){
      if(!ac)return;schedule();
      music.g.gain.setTargetAtTime(playing?0.32:0.12,ac.currentTime,0.3);
    },
    load(){play('pull',0.7);},
    release(){stop('pull');play('snap',0.6);},
    launch(){play('whoomp',0.8);},
    air(){play('rush',0.6);},
    pop(q){q>0.62?play('unlock',0.9):play('bounce',0.7);},
    land(clean,big){stop('rush');clean?(big?play('perfect',0.9):play('bounce',0.8)):play('thunk',0.9);},
    grindOn(){stop('rush');play('leaf',0.8);},
    crash(){stop('rush');play('impact',1);setTimeout(()=>play('over',0.8),120);},
    splash(){stop('rush');play('mist',0.9);},
    check(){play('pickup',0.8);},
    boost(){play('booster',0.9);},
    win(){play('fanfare',1);},
  };
})();

/* ---------- input ---------- */
const key={};
const MAP={ArrowUp:'gas',KeyW:'gas',Space:'brake',ArrowDown:'brake',KeyS:'brake',
           ArrowLeft:'back',KeyA:'back',ArrowRight:'fwd',KeyD:'fwd',KeyR:'reset'};
addEventListener('keydown',e=>{
  if(!started){
    const d='12345'.indexOf(e.key);
    if(d>=0&&d<PODS.length){podIdx=d;e.preventDefault();return;}
    if(e.code==='Space'||e.code==='Enter'){started=true;SND.start();e.preventDefault();return;}
  }
  if(e.code==='KeyM'){SND.toggle();return;}
  const k=MAP[e.code];if(!k)return;e.preventDefault();
  if(k==='reset'){reset();return;}key[k]=true;});
addEventListener('keyup',e=>{const k=MAP[e.code];if(k)key[k]=false;});
cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  if(!started){
    const n=PODS.length,gap=126,x0=W/2-(n-1)*gap/2,y=H/2-30;
    for(let i=0;i<n;i++){const px=x0+i*gap;
      if(mx>px-52&&mx<px+52&&my>y-52&&my<y+72){
        if(podIdx===i){started=true;SND.start();} else {podIdx=i;SND.select();}   // click to select, click again to ride
        return;}}
    started=true;SND.start();
  }
});

/* ---------- state ---------- */
const P={},cam={x:0,y:0},fx=[],dust=[],smoke=[];
const BOOST_X=370, BOOST_MUL=1.15, BOOST_T=180, BOOST_R=R*1.5;   // one pickup at the start: +15% for 3 s
const boost={hit:false};
let attempts=1;
function reset(keepTry){build();if(!keepTry)attempts=1;P.best=0;P.crashes=0;P.time=0;P.won=0;
  P.spawn={x:40,y:gAt(40)-R};respawn();cam.x=P.x-W/2;cam.y=P.y-H/2;}
function respawn(){
  P.x=P.spawn.x;P.y=P.spawn.y;P.spd=4*T;P.vx=4*T;P.vy=0;
  P.ground=true;P.ang=0;P.lean=0;P.rot=0;P.vrot=0;P.curl=1;P.prevVy=0;
  P.air=0;P.dead=0;P.press=0;P.wasLoad=false;P.relT=-999;P.relAmt=0;P.popQ=0;P.cased=0;P.splat=0;P.rail=null;P.boost=0;fx.length=0;smoke.length=0;
}
function note(t,c){fx.push({t:0,text:t,col:c,x:P.x,y:P.y-30});}
// Case it and you go down. No speed penalty to grind through -- you splat and the
// run starts over.
function splat(msg,col){
  if(P.splat)return;
  if(msg){P.splat=Math.round(48/T);P.spd=0;P.vx=0;P.vy=0;P.cased=(P.cased||0)+1;
    SND.splash();note(msg,col);for(let i=0;i<30;i++)dust.push({x:P.x,y:P.y,t:0,life:24+Math.random()*18,
      col:col,vx:(Math.random()-0.5)*4.5,vy:-Math.random()*4.2});return;}
  P.splat=Math.round(48/T);P.spd=0;P.vx=0;P.vy=0;P.cased=(P.cased||0)+1;
  SND.crash();note('SPLAT','#ff6b6b');puff(34,P.x,P.y+R,5.2);
}
function puff(n,x,y,p){for(let i=0;i<n;i++)dust.push({x,y,t:0,life:18+Math.random()*14,
  vx:(Math.random()-.5)*p,vy:-Math.random()*p*.6});}

/* ---------- step ---------- */
function step(){
  SND.update(P.spd||0,P.ground,!!P.rail,started&&!P.won&&!P.splat);
  if(!started||P.won)return;
  P.time++;
  if(P.splat>0){
    P.splat--;
    for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.t++;d.x+=d.vx;d.y+=d.vy;d.vy+=0.1;
      if(d.t>d.life)dust.splice(i,1);}
    for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t++;f.y-=0.5;if(f.t>50)fx.splice(i,1);}
    if(!P.splat){attempts++;reset(true);}
    return;
  }
  if(P.dead>0){P.dead--;P.rot+=0.3;P.vy+=GRAV;P.x+=P.vx;P.y+=P.vy;
    if(!P.dead)respawn();return;}

  // ball on the dirt, unfurls in the air
  // only unfurl for real air. a 3-frame hop used to pop the ball open, which made
  // the whole thing flicker.
  // On the rail he gets up on his legs and slides. Everywhere else, ball.
  const wantBall=(P.ground&&!P.rail)||(!P.ground&&P.air<15);
  P.curl+=((wantBall?1:0)-P.curl)*(wantBall?0.22:0.14)*T;

  if(P.ground&&P.rail){
    // GRINDING: steel, not dirt. Barely any resistance, so a clean rail hit
    // actually pays you speed instead of costing it.
    if(key.gas)P.spd+=ACCEL*0.75;
    P.spd-=DRAG*0.15+P.spd*P.spd*QDRAG*0.20;
    const rd=6,ra=Math.atan2(railYat(P.rail,P.x+rd)-railYat(P.rail,P.x-rd),2*rd);
    // no rolling on steel -- he stands and slides, body lying along the bar
    P.spin=(P.spin||0)*0.80;          // bleed off the roll; steel does not spin you
    const pr=P.rot;P.rot=angLerp(P.rot,ra,0.30);P.vrot=(P.vrot||0)+norm(P.rot-pr);
    P.ang=ra;P.lean=ra;
    P.x+=P.spd*Math.cos(ra);P.y=railYat(P.rail,P.x)-R;P.prevVy=0;
    P.grindT=(P.grindT||0)+1;
    // sparks off the contact point, streaming back and dying out
    const spark=Math.min(4,1+Math.floor(P.spd*0.22));
    for(let i=0;i<spark;i++){
      const hot=Math.random();
      dust.push({x:P.x-R*0.35+Math.random()*4,y:P.y+R*0.85,t:0,
        life:9+Math.random()*16,
        col: hot>0.82?'#ffffff' : hot>0.5?'#ffe9a0' : '#ff9e3d',
        vx:-(1.2+Math.random()*3.2)-P.spd*0.14,
        vy:-(Math.random()*2.4)-0.6});
    }
    if(P.x>P.rail.b){                                 // off the end
      P.rail=null;P.grindT=0;
      const g=gAt(P.x);
      if(Math.abs((P.y+R)-g)<16){                     // bar ends level with the bank:
        P.ground=true;P.y=g-R;P.ang=angAt(P.x);       // hand over to the dirt rather
        P.lean=P.ang;P.prevVy=P.spd*Math.sin(P.ang);  // than launching into the air
      }else{
        P.ground=false;P.air=0;P.launchSpd=P.spd;P.vx=P.spd;P.vy=0;SND.launch();
      }
    }
  } else if(P.ground){
    const a=P.ang;
    if(key.gas)P.spd+=ACCEL*(P.spd<4*T?2.6:1); // strong low end, so you can never grind to 0
    else if(P.spd>3.2*T)P.spd-=0.160*T*T;               // let off and you genuinely slow down
    // hold DOWN to squash into the hill. it scrubs a little speed, and if you let
    // go as the crest throws you, that stored load comes back as extra air.
    if(key.brake){
      if(!P.wasLoad)SND.load();
      P.press=Math.min(1,P.press+0.055*T);
      P.spd-=BRAKE*0.45;                      // loading scrubs speed: that is the trade
      P.wasLoad=true;
    }else{
      // latch ONCE on the release edge. refreshing this every frame while the
      // compression decayed meant the timestamp landed after the launch itself.
      if(P.wasLoad&&P.press>0.30){P.relT=P.time;P.relAmt=P.press;}
      if(P.wasLoad)SND.release();
      P.wasLoad=false;
      P.press=Math.max(0,P.press-0.14*T);
    }
    P.spd+=SLOPE*Math.sin(a);                 // gravity down the face
    P.spd-=DRAG+P.spd*P.spd*QDRAG+P.spd*P.spd*P.spd*CDRAG;   // resistance, steep at the top end
    if(P.spd<0)P.spd=0;

    P.spin=P.spd/R;P.rot+=P.spin;P.vrot=(P.vrot||0)+Math.sign(P.spin)*Math.min(VSPIN_MAX,Math.abs(P.spin)*VSPIN);
    P.lean=a;
    const ox=P.x, oy=gSm(P.x);
    P.x+=P.spd*Math.cos(a);
    const ny=gSm(P.x), vy=ny-oy;
    if(vy-P.prevVy>GRAV*2.1/T&&P.spd>2.5*T){                 // ground dropped away: airborne
      // Leave from the point we were actually standing on. Advancing x first and
      // keeping the old y buried the isopod inside steep climbing faces -- it then
      // flew up through the takeoff ramp of a dirt jump.
      P.x=ox;P.y=oy-R;
      P.ground=false;P.air=0;P.launchSpd=P.spd;
      P.vx=P.spd*Math.cos(a);P.vy=P.prevVy+GRAV;SND.launch();
      const dt=P.time-(P.relT||-999);
      if(dt>=0&&dt<=POP_WINDOW&&(P.relAmt||0)>0.30){
        const q=(1-Math.abs(dt-POP_SWEET)/POP_WINDOW)*P.relAmt;
        if(q>0.05){
          P.vy-=POP*q; P.vx+=POP*0.35*q*Math.cos(a);
          puff(9,P.x,P.y+R,3.4);
          note(q>0.62?'BOOSTED!':'pop', q>0.62?'#d6f27a':'#9ff0c0');SND.pop(q);
          P.popQ=q;
        }
      }
      P.relT=-999;
    }else{P.y=ny-R;P.prevVy=vy;P.ang=angAt(P.x);}
  }else{
    P.air++;if(P.air===40)SND.air();
    if(key.back)P.lean-=LEAN;
    if(key.fwd)P.lean+=LEAN;
    // a thrown body swings to face its own arc: landings work by default,
    // leaning is for fine-tuning rather than survival
    if(P.air>4/T){
      // set up for the landing: half the arc you are on, half the ground you are
      // heading for. this is what stops long airs from landing badly.
      const fl=Math.atan2(P.vy,P.vx), gr=angAt(P.x+P.vx*12);
      P.lean=angLerp(P.lean,fl+norm(gr-fl)*0.55,0.055*T);
    }
    // angle of attack: nose up and you hang, nose down and you drop onto the landing.
    // leaning is something you use, not something that punishes you.
    const aoa=norm(P.lean-Math.atan2(P.vy,P.vx));
    P.vy+=GRAV*AIR*(1+Math.max(-0.45,Math.min(0.45,aoa))*0.55);
    const px=P.x,py=P.y;
    P.x+=P.vx;P.y+=P.vy;
    const pr=P.rot;
    P.rot=angLerp(P.rot,P.lean,0.22);         // spin settles into the lean
    P.spin=norm(P.rot-pr);P.vrot=(P.vrot||0)+P.spin;   // in the air the plates lock to the body
    const g=gSm(P.x);
    // Test whether we CROSSED the surface, not whether we happen to be falling.
    // Requiring vy>0 meant flying upward into a climbing face -- the takeoff ramp
    // of a dirt jump -- registered no collision at all, and you went through it.
    // Falling: land on contact. Rising: land once you are genuinely buried. Off a
    // lip a pixel of overlap is normal and clears as the crest falls away, but
    // flying up into a ramp face buries you and must resolve.
    // Rails catch you from above only, so you can fly under one. A slow rider is
    // already below the bar by the time they reach it; a fast one is still above it
    // and sails over. Only a judged hit lands on top.
    let hitRail=false;
    for(const rl of rails){
      const ry=railYat(rl,P.x), pry=railYat(rl,px);
      if(P.x>rl.a&&P.x<rl.b&&P.vy>0&&py+R<=pry+4&&P.y+R>=ry){
        if(Math.abs(norm(P.lean))>1.0){splat();return;}   // came down on it sideways
        P.rail=rl;P.ground=true;P.y=ry-R;P.ang=0;P.lean=0;P.prevVy=0;
        P.spd=Math.max(0,P.vx)*1.02;P.vy=0;P.air=0;
        note('GRIND!','#d6f27a');SND.grindOn();
        for(let i=0;i<12;i++)dust.push({x:P.x,y:P.y+R,t:0,life:14+Math.random()*10,
          col:'#ffe9a0',vx:-Math.random()*3.5,vy:-Math.random()*1.8});
        hitRail=true;break;
      }
    }
    if(!hitRail&&P.y+R>=g&&(P.vy>0||P.y+R>g+2))land(g);
  }

  if(!boost.hit&&Math.abs(P.x-BOOST_X)<BOOST_R*1.4&&Math.abs(P.y-(gAt(BOOST_X)-BOOST_R*1.15))<BOOST_R*1.4){
    boost.hit=true;P.boost=BOOST_T;P.spd*=BOOST_MUL;if(!P.ground){P.vx*=BOOST_MUL;}
    note('BOOST!','#9fd8ff');SND.boost();
  }
  if(P.boost>0){
    P.boost--;
    if(P.ground)P.spd+=ACCEL*(BOOST_MUL-1)*(key.gas?1:2);
    for(let i=0;i<2;i++)smoke.push({x:P.x-R*0.8+(Math.random()-.5)*4,y:P.y+(Math.random()-.5)*8,t:0,life:26+Math.random()*16,
      vx:-(0.6+Math.random()*1.2),vy:-0.35-Math.random()*0.5,r:3+Math.random()*3});
  }
  P.best=Math.max(P.best,P.spd);
  // break the surface and you go under -- no speed penalty, you just drown
  for(const w of waters)
    if(P.x>w.a&&P.x<w.b&&P.y+R*0.35>w.y){splat('SPLASH!','#8fe0f4');break;}
  for(const c of checks)if(!c.hit&&P.x>c.x){c.hit=true;P.spawn={x:c.x,y:c.y-R};SND.check();}
  if(!P.won&&P.x>FINISH){P.won=P.time;SND.win();}

  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t++;f.y-=.5;if(f.t>50)fx.splice(i,1);}
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.t++;d.x+=d.vx;d.y+=d.vy;d.vy+=.1;
    if(d.t>d.life)dust.splice(i,1);}
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.t++;s.x+=s.vx;s.y+=s.vy;s.r+=0.18;
    if(s.t>s.life)smoke.splice(i,1);}

  P.camSpd=(P.camSpd||0)+(P.spd-(P.camSpd||0))*0.08;
  const lead=Math.min(210,P.camSpd*15/T);
  cam.x+=((P.x-W*0.36+lead)-cam.x)*0.10;
  // flying over a valley leaves the ground far below; drop the view so you can
  // still see where you are coming down
  let ty=P.y-H*0.52;
  if(!P.ground)ty+=Math.min(130,Math.max(0,(gAt(P.x)-P.y)*0.35));
  cam.y+=(ty-cam.y)*0.08;
  cam.x=Math.max(0,cam.x);
}

function land(g){
  const a=angAt(P.x);
  P.ground=true;P.y=g-R;P.ang=a;
  const inSpd=Math.hypot(P.vx,P.vy);
  // Land on the downslope and you keep nearly everything. Overshoot onto the climb
  // out the back and you pay for it -- that is what makes reading the hill matter.
  const floor=a>0.04?0.86:0.44;
  const proj=Math.max(inSpd*floor,Math.max(0,P.vx*Math.cos(a)+P.vy*Math.sin(a)));
  // Settle onto the slope carrying the rate the ground itself is falling at. Zeroing
  // this made the next frame look like the ground had dropped away, so the isopod
  // re-launched instantly and chattered down every descent.
  const settle=()=>{P.vy=0;P.lean=a;P.prevVy=P.spd*Math.sin(a);};

  if(P.air<14/T){                      // skipped over a bump: carry on, no penalty
    P.spd=Math.max(P.launchSpd||0,proj);settle();return;}
  // How hard you meet the ground -- and the sign matters. Falling STEEPER than the
  // face means you slam into it. Falling shallower just means you settle onto a
  // slope already running away from you, which is a landing, not a crash.
  const impact=norm(Math.atan2(P.vy,P.vx)-a);
  // Since a case now ends the run, this has to mean 'you genuinely blew it' rather
  // than 'you were a bit off'. Tight enough and no line through the course exists.
  if(impact>0.86&&inSpd>10*T){
    splat();settle();return;
  }
  const diff=Math.abs(norm(P.lean-a));
  if(diff<CLEAN){
    P.spd=proj*1.10;                    // land it flush, keep the lot
    note(P.air>=120?'BIG AIR':'SMOOTH','#d6f27a');puff(10,P.x,P.y+R,3);SND.land(true,P.air>=120);
  }else if(diff<ROUGH){
    P.spd=proj*0.88;
    note('ROUGH','#ffd23f');puff(8,P.x,P.y+R,2.4);SND.land(false);
  }else{
    splat();
  }
  settle();
}

/* ---------- draw ---------- */
let decor=[];
function buildDecor(){decor=[];let s=7331;
  const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let x=-200;x<LEN+400;x+=96)decor.push({x:x+rnd()*36,s:.28,h:70+rnd()*80,w:16+rnd()*20,k:rnd()});
  for(let x=-200;x<LEN+400;x+=150)decor.push({x:x+rnd()*50,s:.55,h:110+rnd()*90,w:24+rnd()*28,k:rnd()});}

// Background plant: a stem with a seven-finger serrated leaf fanning out at the top,
// and a smaller leaf pair lower down. Drawn as flat silhouettes in one colour.
function leafBlade(len,wid){
  ctx.beginPath();ctx.moveTo(0,0);
  const n=7;
  for(let i=1;i<=n;i++){const t=i/n,w=wid*Math.sin(t*Math.PI)*(1-t*0.35),y=-len*t;
    ctx.lineTo(-w,y+len/n*0.45);ctx.lineTo(-w*0.86,y);}
  ctx.lineTo(0,-len-wid*0.6);
  for(let i=n;i>=1;i--){const t=i/n,w=wid*Math.sin(t*Math.PI)*(1-t*0.35),y=-len*t;
    ctx.lineTo(w*0.86,y);ctx.lineTo(w,y+len/n*0.45);}
  ctx.closePath();ctx.fill();
}
function leafFan(x,y,size,ang,k){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const spread=[-1.55,-1.05,-0.5,0,0.5,1.05,1.55],lens=[0.42,0.62,0.86,1,0.86,0.62,0.42];
  for(let i=0;i<7;i++){ctx.save();ctx.rotate(spread[i]+(k-0.5)*0.08);leafBlade(size*lens[i],size*0.11*(0.7+lens[i]*0.4));ctx.restore();}
  ctx.restore();
}
function plant(x,y,h,stemW,col,k){
  ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineCap='round';
  const top=y-h,sway=(k-0.5)*h*0.25;
  ctx.lineWidth=stemW;ctx.beginPath();ctx.moveTo(x,y+520);ctx.quadraticCurveTo(x,y-h*0.4,x+sway,top);ctx.stroke();
  leafFan(x+sway,top,h*0.75,(k-0.5)*0.3,k);
  const my=y-h*0.42,mx=x+sway*0.35;
  ctx.lineWidth=stemW*0.7;
  ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx-h*0.18,my-h*0.12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx,my+h*0.1);ctx.lineTo(mx+h*0.18,my-h*0.02);ctx.stroke();
  leafFan(mx-h*0.18,my-h*0.12,h*0.4,-0.9,k);
  leafFan(mx+h*0.18,my-h*0.02,h*0.4,0.9,1-k);
  ctx.lineCap='butt';
}

// Terrain: dark dirt with a lighter topsoil band, an inked outline along the surface,
// a green grass strip with tufts, and hashed pebbles / roots so nothing is random per frame.
const hsh=n=>{n=(n*2654435761)>>>0;n^=n>>>15;n=(n*2246822519)>>>0;return (n^(n>>>13))>>>0;};
function ground(CX,CY){
  const ST=4;   // sample step
  const path=(off)=>{ctx.beginPath();
    for(let sx=-ST;sx<=W+ST;sx+=ST){const y=gAt(CX+sx)-CY+off;sx===-ST?ctx.moveTo(sx,y):ctx.lineTo(sx,y);}};
  const closeDown=()=>{ctx.lineTo(W+ST,H+20);ctx.lineTo(-ST,H+20);ctx.closePath();};
  ctx.lineJoin='round';ctx.lineCap='round';
  // deep dirt
  path(0);closeDown();ctx.fillStyle='#4a2f1a';ctx.fill();
  // topsoil band
  path(0);for(let sx=W+ST;sx>=-ST;sx-=ST)ctx.lineTo(sx,gAt(CX+sx)-CY+38);ctx.closePath();
  ctx.fillStyle='#6b4527';ctx.fill();
  // wavy seam between the layers
  ctx.strokeStyle='#3d2614';ctx.lineWidth=3;ctx.beginPath();
  for(let sx=-ST;sx<=W+ST;sx+=ST){const wx=CX+sx,y=gAt(wx)-CY+52+Math.sin(wx*0.021)*4+Math.sin(wx*0.0073)*6;
    sx===-ST?ctx.moveTo(sx,y):ctx.lineTo(sx,y);}
  ctx.stroke();
  // pebbles and roots, hashed on world x so they stay put as the camera moves
  ctx.fillStyle='#3d2614';ctx.strokeStyle='#3d2614';ctx.lineWidth=1.6;
  for(let wx=Math.floor(CX/12)*12;wx<CX+W+12;wx+=12){
    const h=hsh(wx),sx=wx-CX;
    if((h&7)<2){const d=44+(h>>3)%70,r=1.5+((h>>10)&3)*0.6;
      ctx.beginPath();ctx.ellipse(sx+((h>>5)&7),gAt(wx)-CY+d,r*1.3,r,0,0,6.3);ctx.fill();}
    if((h>>13)%9===0){const gy=gAt(wx)-CY+38,L=16+(h>>16)%22,sw=((h>>20)&1?1:-1)*(3+(h>>21)%5);
      ctx.beginPath();ctx.moveTo(sx,gy);ctx.quadraticCurveTo(sx+sw,gy+L*0.5,sx-sw*0.4,gy+L);ctx.stroke();
      if(h&0x400000){ctx.beginPath();ctx.moveTo(sx+sw*0.5,gy+L*0.45);ctx.lineTo(sx+sw*1.6,gy+L*0.8);ctx.stroke();}}
  }
  // grass strip and inked surface line
  path(-1);for(let sx=W+ST;sx>=-ST;sx-=ST)ctx.lineTo(sx,gAt(CX+sx)-CY+6);ctx.closePath();
  ctx.fillStyle='#3f7a2f';ctx.fill();
  path(1.5);ctx.strokeStyle='#2a1a0c';ctx.lineWidth=3.5;ctx.stroke();
  // tufts: a few thin blades leaning with the slope, in two greens
  for(let wx=Math.floor(CX/6)*6;wx<CX+W+6;wx+=6){
    const h=hsh(wx*3+1);if((h&15)>5)continue;
    const sx=wx-CX,gy=gAt(wx)-CY,n=2+(h>>4)%2,tall=3+(h>>6)%4;
    ctx.strokeStyle=(h>>9)&1?'#6fae43':'#4f8f36';ctx.lineWidth=1.5;
    for(let i=0;i<n;i++){const ox=(i-(n-1)/2)*2.2,lean=((h>>(12+i*3))%5-2)*1.1;
      ctx.beginPath();ctx.moveTo(sx+ox,gy+1);ctx.quadraticCurveTo(sx+ox+lean*0.5,gy-tall*0.55,sx+ox+lean,gy-tall);ctx.stroke();}
  }
  ctx.lineCap='butt';
}

function draw(){
  ctx.setTransform(SC,0,0,SC,0,0);
  const CX=cam.x,CY=cam.y;
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#20573c');sky.addColorStop(1,'#12261d');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  for(const d of decor){
    const px=Math.round(d.x-CX*d.s),py=Math.round(270+(d.k-0.5)*70-CY*d.s*0.1);
    if(px<-160||px>W+160)continue;
    plant(px+d.w/2,py,d.h,1.4+d.w/16,d.s<.4?'#143829':'#1a4832',d.k);}

  ground(CX,CY);

  // WATER: filled per column between the surface and the ground beneath it, so it
  // sits in the basin instead of covering the terrain as a flat slab.
  for(const rl of rails){
    const sx=Math.round(rl.a-CX),ex=Math.round(rl.b-CX),sy=Math.round(rl.y-CY);
    if(ex<-20||sx>W+20)continue;
    for(let px=sx+18;px<ex-10;px+=70){           // legs down to the dirt
      const wx2=CX+px,ry=railYat(rl,wx2),g=gAt(wx2);
      ctx.fillStyle='#4a5560';ctx.fillRect(px,Math.round(ry-CY)+4,3,Math.max(0,Math.round(g-ry)));
    }
    for(let px=Math.max(0,sx);px<Math.min(W,ex);px++){
      const ry=Math.round(railYat(rl,CX+px)-CY);
      ctx.fillStyle='#39434d';ctx.fillRect(px,ry+3,1,4);
      ctx.fillStyle='#aab4bf';ctx.fillRect(px,ry,1,3);
      ctx.fillStyle='#e6edf3';ctx.fillRect(px,ry,1,1);
    }
    ctx.fillStyle='#5d6a76';
    ctx.fillRect(sx-3,Math.round(railYat(rl,rl.a)-CY)-2,4,9);
    ctx.fillRect(ex-1,Math.round(railYat(rl,rl.b)-CY)-2,4,9);
  }

  for(const w of waters){
    const sx=Math.round(w.a-CX),ex=Math.round(w.b-CX),sy=Math.round(w.y-CY);
    if(ex<0||sx>W||sy>H)continue;
    for(let px=Math.max(0,sx);px<Math.min(W,ex);px++){
      const g=gAt(CX+px);
      if(g>w.y){
        ctx.fillStyle='rgba(48,140,175,.60)';ctx.fillRect(px,sy,1,Math.round(g-w.y)+2);
        ctx.fillStyle='rgba(120,215,240,.25)';ctx.fillRect(px,sy,1,4);
      }
    }
    for(let px=Math.max(0,sx);px<Math.min(W,ex);px++){
      if(gAt(CX+px)<=w.y)continue;
      const wob=Math.sin((CX+px)*0.055+P.time*0.05)*1.6+Math.sin((CX+px)*0.017-P.time*0.03)*1.2;
      ctx.fillStyle='#8fe0f4';ctx.fillRect(px,Math.round(sy+wob),1,2);
      if(((CX+px)*7919%53)===0){ctx.fillStyle='#d9f7ff';ctx.fillRect(px,Math.round(sy+wob)-2,2,1);}
    }
  }

  // marker boards: tells you what is coming while you still have room to choose a speed
  for(const j of jumps){
    const bx=j.start-260;
    const sx=Math.round(bx-CX),sy=Math.round(gAt(bx)-CY);
    if(sx<-40||sx>W+40)continue;
    const col={s:'#6dbf5c',m:'#e8c14a',l:'#e88a3c',p:'#e8566c',d:'#9f7cf0',j:'#5fd0e8',k:'#5fd0e8',u:'#f0c24a',w:'#49c8f0',g:'#d0d6de'}[j.kind];
    const n ={s:1,m:2,l:3,p:3,d:2,j:2,k:1,u:3,w:2,g:2}[j.kind];
    ctx.fillStyle='#4a3520';ctx.fillRect(sx-1,sy-34,3,34);
    ctx.fillStyle='#1a2b1e';ctx.fillRect(sx-13,sy-50,28,18);
    ctx.fillStyle=col;ctx.fillRect(sx-11,sy-48,24,14);
    ctx.fillStyle='#12261d';
    if(j.kind==='g'){                      // bar = rail
      ctx.fillRect(sx-11,sy-43,22,3);
      ctx.fillRect(sx-8,sy-40,2,4);ctx.fillRect(sx+6,sy-40,2,4);
    }else if(j.kind==='w'){                // wave = water gap
      ctx.beginPath();
      for(let q=0;q<=16;q++){const wx2=sx-8+q,wy=sy-42+Math.sin(q*0.8)*2.2;
        if(q===0)ctx.moveTo(wx2,wy);else ctx.lineTo(wx2,wy);}
      ctx.lineTo(sx+8,sy-37);ctx.lineTo(sx-8,sy-37);ctx.closePath();ctx.fill();
    }else if(j.kind==='u'){                // up-arrow = step up
      ctx.beginPath();ctx.moveTo(sx,sy-47);ctx.lineTo(sx-6,sy-40);ctx.lineTo(sx+6,sy-40);
      ctx.closePath();ctx.fill();ctx.fillRect(sx-2,sy-41,4,5);
    }else if(j.kind==='j'||j.kind==='k'){  // gap symbol = built dirt jump
      ctx.fillRect(sx-10,sy-44,5,8);ctx.fillRect(sx+5,sy-44,5,8);
      ctx.fillRect(sx-3,sy-40,6,2);
    }else if(j.kind==='d'){                // twin peaks = an M
      ctx.beginPath();ctx.moveTo(sx-9,sy-38);ctx.lineTo(sx-5,sy-46);ctx.lineTo(sx-1,sy-38);
      ctx.lineTo(sx+3,sy-46);ctx.lineTo(sx+7,sy-38);ctx.lineTo(sx+7,sy-37);ctx.lineTo(sx-9,sy-37);
      ctx.closePath();ctx.fill();
    }else if(j.kind==='p'){                // chevrons = steep launcher
      for(let i=0;i<2;i++){ctx.beginPath();
        ctx.moveTo(sx-6+i*9,sy-38);ctx.lineTo(sx-2+i*9,sy-45);ctx.lineTo(sx+2+i*9,sy-38);
        ctx.closePath();ctx.fill();}
    }else for(let i=0;i<n;i++)ctx.fillRect(sx-8+i*7,sy-45,4,8);
  }

  for(const c of checks){
    const sx=Math.round(c.x-CX),sy=Math.round(c.y-CY);
    if(sx<-20||sx>W+20)continue;
    ctx.fillStyle='#4a3520';ctx.fillRect(sx-1,sy-26,2,26);
    ctx.fillStyle=c.hit?'#9ff0c0':'#5f7a66';ctx.fillRect(sx+1,sy-28,13,8);}

  {const sx=Math.round(FINISH-CX),sy=Math.round(gAt(FINISH)-CY);
   if(sx>-60&&sx<W+60){ctx.fillStyle='#e8f0d8';ctx.fillRect(sx-1,sy-62,3,62);
    for(let r=0;r<4;r++)for(let q=0;q<5;q++){
      ctx.fillStyle=((r+q)%2)?'#f2f6e8':'#20301f';
      ctx.fillRect(sx+2+q*7,sy-62+r*7,7,7);}}}

  for(const d of dust){ctx.globalAlpha=Math.max(0,1-d.t/d.life)*.5;
    ctx.fillStyle='#b58f60';ctx.fillRect(Math.round(d.x-CX),Math.round(d.y-CY),2,2);}
  for(const s of smoke){ctx.globalAlpha=Math.max(0,1-s.t/s.life)*.55;
    ctx.fillStyle=s.t<6?'#e8eef4':'#9aa3ad';ctx.beginPath();ctx.arc(s.x-CX,s.y-CY,s.r,0,6.3);ctx.fill();}
  ctx.globalAlpha=1;
  if(!boost.hit)emblem(BOOST_X-CX,gAt(BOOST_X)-BOOST_R*1.15-CY,BOOST_R*2/14.3);

  // Smooth the DRAWN height only -- physics is untouched. Smoothing is applied to the offset above the dirt, not to y itself, so the pod
  // tracks the slope exactly at any speed instead of lagging behind it.
  const base=(P.ground&&!P.rail)?gSm(P.x)-R:P.y,off=P.y-base;
  if(P.smOff===undefined||!P.ground||P.rail)P.smOff=off;
  P.smOff+=(off-P.smOff)*0.45;
  P.smY=base+P.smOff;
  P.smA=P.smA===undefined?P.ang:P.smA+(P.ang-P.smA)*0.3;
  pod(P.x-CX,P.smY-CY);

  for(const f of fx){ctx.globalAlpha=Math.max(0,1-f.t/50);
    ctx.textAlign='center';
    txt(f.text,f.x-CX,f.y-CY,13,f.col,UI.ink,3);
    ctx.textAlign='left';ctx.globalAlpha=1;}
  if(started)hud();else startScreen();
}

// speed-booster emblem, traced from the reference art: deep-V dark shield, three tall
// crystal spikes meeting at one point, bone-shaped white spine. Units = ref px / 100,
// origin at the ref's centre; 14.3 units tall. s = pixels per unit. Bobs gently.
function emblem(x,y,s){
  y+=Math.sin(performance.now()/380)*2;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.lineJoin='round';ctx.lineWidth=0.42;ctx.strokeStyle='#000';
  const poly=(pts,fill)=>{ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.stroke();};
  poly([-4.92,-0.3,-4.02,-2.2,4.02,-2.2,4.92,-0.3,0,7.3],'#262629');                 // shield
  poly([-4.52,-5.4,-1.72,-3.85,0,0.6,-4.02,-2.2],'#4a4b51');                           // left spike
  poly([4.52,-5.4,4.02,-2.2,0,0.6,1.72,-3.85],'#4a4b51');                              // right spike
  poly([0,-6.95,-1.72,-3.85,0,0.6,1.72,-3.85],'#4a4b51');                              // centre spike
  ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.lineWidth=0.36;
  for(const yy of [1.1,3.6,6.0]){ctx.beginPath();ctx.arc(0,yy,0.2,0,6.3);ctx.fill();}
  for(const [yy,w] of [[1.5,0.6],[2.05,0.9],[2.6,0.9],[3.15,0.6],[4.05,0.6],[4.6,0.9],[5.15,0.9],[5.65,0.6]]){
    ctx.beginPath();ctx.moveTo(-w,yy);ctx.quadraticCurveTo(0,yy+0.28,w,yy);ctx.stroke();}
  ctx.lineCap='butt';
  ctx.restore();
}

/* ---------- UI kit: cream panels in wood frames, rounded cards, outlined text ---------- */
const UI={wood:'#8a5a2b',woodDk:'#5a3a1c',cream:'#fbefd5',creamDk:'#f1dfb8',ink:'#4a2c14',
  grass:'#5aa83a',grassDk:'#3f7f2a',orange:'#f4a533',orangeDk:'#c97a12',
  card:{y:'#fff1c2',g:'#e6f5d8',b:'#dcefff',p:'#ffe0e6',n:'#f4ebd9'}};
const FONT='"Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif';
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
// wooden frame with a cream face
function panel(x,y,w,h,r=14){
  ctx.fillStyle='rgba(0,0,0,.25)';rr(x+3,y+6,w,h,r+4);ctx.fill();
  ctx.fillStyle=UI.woodDk;rr(x-3,y-3,w+6,h+6,r+4);ctx.fill();
  ctx.fillStyle=UI.wood;rr(x-1,y-1,w+2,h+2,r+2);ctx.fill();
  ctx.fillStyle=UI.cream;rr(x+5,y+5,w-10,h-10,r-3);ctx.fill();
}
function card(x,y,w,h,fill,border,r=10){
  ctx.fillStyle=border;rr(x,y,w,h,r);ctx.fill();
  ctx.fillStyle=fill;rr(x+2.5,y+2.5,w-5,h-5,r-2);ctx.fill();
}
function txt(s,x,y,size,fill,stroke,lw){
  ctx.font='bold '+size+'px '+FONT;
  if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw||Math.max(2,size*.16);ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function button(x,y,w,h,label){
  ctx.fillStyle=UI.orangeDk;rr(x,y,w,h,12);ctx.fill();
  ctx.fillStyle=UI.orange;rr(x+2.5,y+2.5,w-5,h-8,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.28)';rr(x+6,y+5,w-12,h*.35,6);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';
  txt(label,x+w/2,y+h/2-1,15,UI.ink);
  ctx.textBaseline='alphabetic';
}

/* start screen decorations: stars, leaves, vines */
const PLUM='#4a2a55',PLUM_DK='#2e1838',GOLD='#f2b233',GOLD_DK='#c9821a',GOLD_LT='#ffd76a';
function star(x,y,r,col){
  ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;
    ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}
  ctx.closePath();ctx.fill();
}
function sparkle(x,y,r,col){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill();
}
function leaf(x,y,ang,len,col,dk){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);
  ctx.quadraticCurveTo(len*.5,-len*.42,len,0);ctx.quadraticCurveTo(len*.5,len*.42,0,0);ctx.fill();
  ctx.strokeStyle=dk;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(len-3,0);ctx.stroke();
  ctx.restore();
}
function vine(x,y,dir){                       // a curling stem with leaves, dir=+1 grows right
  ctx.strokeStyle='#4f8f36';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+dir*30,y-18,x+dir*40,y+22,x+dir*78,y+6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+dir*78,y+6);ctx.bezierCurveTo(x+dir*90,y+2,x+dir*94,y-8,x+dir*86,y-10);ctx.stroke();
  const L=[[14,-10,-0.9],[30,4,0.7],[46,-2,-0.6],[60,10,0.9],[70,-6,-0.2]];
  for(const [ox,oy,a] of L)leaf(x+dir*ox,y+oy,dir>0?a:Math.PI-a,16,'#6fae43','#3f7f2a');
  ctx.lineCap='butt';
}

function startScreen(){
  ctx.fillStyle='rgba(20,40,30,.45)';ctx.fillRect(0,0,W,H);
  const PX=W/2-350,PY=24,PW=700,PH=338;
  // plum outer frame, gold rim, cream face
  ctx.fillStyle='rgba(0,0,0,.3)';rr(PX+2,PY+8,PW,PH,20);ctx.fill();
  ctx.fillStyle=PLUM_DK;rr(PX-4,PY-4,PW+8,PH+8,20);ctx.fill();
  ctx.fillStyle=GOLD;rr(PX-1,PY-1,PW+2,PH+2,17);ctx.fill();
  ctx.fillStyle=UI.cream;rr(PX+4,PY+4,PW-8,PH-8,13);ctx.fill();

  // header: starry plum band with rays, gold-rimmed, subtitle tab hanging below
  const HY=PY+4,HH=66;
  ctx.save();rr(PX+4,HY,PW-8,HH,13);ctx.clip();
  const hg=ctx.createLinearGradient(0,HY,0,HY+HH);hg.addColorStop(0,'#3a1f45');hg.addColorStop(1,'#5a3068');
  ctx.fillStyle=hg;ctx.fillRect(PX,HY,PW,HH);
  ctx.fillStyle='rgba(255,255,255,.045)';
  for(let i=0;i<12;i++){const a=Math.PI+i*Math.PI/12;ctx.beginPath();ctx.moveTo(W/2,HY+HH+30);
    ctx.arc(W/2,HY+HH+30,700,a,a+Math.PI/24);ctx.closePath();ctx.fill();}
  ctx.fillStyle='#f7e2a2';
  for(let i=0;i<26;i++){const h=hsh(i*977+3);const sx=PX+10+(h%(PW-20)),sy=HY+6+((h>>10)%(HH-12));
    if(Math.abs(sx-W/2)<235)continue;
    ctx.globalAlpha=.35+((h>>20)%50)/100;ctx.beginPath();ctx.arc(sx,sy,1+((h>>26)%2),0,6.3);ctx.fill();}
  ctx.globalAlpha=1;
  sparkle(PX+110,HY+22,7,'#fff2c4');sparkle(PX+PW-120,HY+30,8,'#fff2c4');sparkle(PX+150,HY+66,4,'#fff2c4');sparkle(PX+PW-70,HY+62,4,'#fff2c4');
  ctx.restore();
  ctx.strokeStyle=GOLD;ctx.lineWidth=3;rr(PX+4,HY-6,PW-8,HH+6,13);ctx.stroke();
  vine(PX+8,HY+30,1);vine(PX+PW-8,HY+30,-1);
  // title: gold with plum outline and a drop shadow
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='bold 40px '+FONT;
  ctx.lineJoin='round';ctx.strokeStyle=PLUM_DK;ctx.lineWidth=10;ctx.strokeText('Isopod Rider',W/2+2,HY+46+3);
  ctx.strokeStyle='#6a3a58';ctx.lineWidth=8;ctx.strokeText('Isopod Rider',W/2,HY+46);
  const tg=ctx.createLinearGradient(0,HY+12,0,HY+50);tg.addColorStop(0,GOLD_LT);tg.addColorStop(1,GOLD);
  ctx.fillStyle=tg;ctx.fillText('Isopod Rider',W/2,HY+46);
  // subtitle tab hanging off the band
  ctx.fillStyle=PLUM;rr(W/2-90,HY+HH-4,180,20,8);ctx.fill();
  ctx.strokeStyle=GOLD;ctx.lineWidth=2;rr(W/2-90,HY+HH-4,180,20,8);ctx.stroke();
  txt('GAS',W/2-52,HY+HH+10,10,UI.cream);txt('LOAD',W/2,HY+HH+10,10,UI.cream);txt('FLY',W/2+50,HY+HH+10,10,UI.cream);
  ctx.fillStyle='#8fd15a';ctx.beginPath();ctx.arc(W/2-27,HY+HH+7,2.5,0,6.3);ctx.fill();ctx.beginPath();ctx.arc(W/2+26,HY+HH+7,2.5,0,6.3);ctx.fill();

  // pod cards: tinted face, wood or gold border, inner hairline, star ribbon
  const n=PODS.length,gap=126,x0=W/2-(n-1)*gap/2,y=H/2-30;
  const tint=[UI.card.n,UI.card.y,UI.card.p,'#efe6d8',UI.card.b];
  const edge=['#c98a1a','#a9652a','#b9536a','#6a5545','#5f86a8'];
  const starCol=['#f2b233','#e9843a','#e76b93','#7a5a3a','#3d7ec4'];
  for(let i=0;i<n;i++){
    const px=x0+i*gap,p=PODS[i],sel=i===podIdx;
    ctx.fillStyle='rgba(0,0,0,.18)';rr(px-50,y-48,104,124,12);ctx.fill();
    card(px-52,y-52,104,124,sel?'#fffaf0':tint[i],sel?GOLD:edge[i],12);
    if(sel){ctx.strokeStyle=GOLD;ctx.lineWidth=4;rr(px-52,y-52,104,124,12);ctx.stroke();}
    ctx.strokeStyle=sel?GOLD:edge[i];ctx.globalAlpha=.55;ctx.lineWidth=1;rr(px-46,y-46,92,112,8);ctx.stroke();ctx.globalAlpha=1;
    // shell on a soft disc
    ctx.fillStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.arc(px,y-4,33,0,6.3);ctx.fill();
    ctx.save();ctx.translate(px,y-6);ctx.rotate(-0.25);shell(26,p);ctx.restore();
    txt(p.n,px,y+50,9,UI.ink);
    // star ribbon
    const sc=starCol[i],ry=y+62;
    ctx.strokeStyle=sc;ctx.globalAlpha=.6;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(px-36,ry);ctx.lineTo(px-20,ry);ctx.moveTo(px+20,ry);ctx.lineTo(px+36,ry);ctx.stroke();
    ctx.globalAlpha=1;
    star(px,ry,5.5,sc);ctx.globalAlpha=.55;star(px-13,ry,3.5,sc);star(px+13,ry,3.5,sc);ctx.globalAlpha=1;
  }
  txt('click a pod twice, or press 1-'+n+' then SPACE',W/2,y+96,11,UI.ink);

  // gold button in a plum frame with stars
  const bx=W/2-160,by=y+106,bw=320,bh=42;
  ctx.fillStyle='rgba(0,0,0,.25)';rr(bx+2,by+5,bw,bh,13);ctx.fill();
  ctx.fillStyle=PLUM_DK;rr(bx-3,by-3,bw+6,bh+6,15);ctx.fill();
  ctx.fillStyle=GOLD_DK;rr(bx,by,bw,bh,12);ctx.fill();
  const bg=ctx.createLinearGradient(0,by,0,by+bh);bg.addColorStop(0,GOLD_LT);bg.addColorStop(1,GOLD);
  ctx.fillStyle=bg;rr(bx+2.5,by+2.5,bw-5,bh-9,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(bx+8,by+5,bw-16,bh*.32,6);ctx.fill();
  ctx.textBaseline='middle';txt('SPACE TO RIDE',W/2,by+bh/2-1,19,PLUM_DK);ctx.textBaseline='alphabetic';
  star(bx+30,by+bh/2,7,'#fff2c4');star(bx+bw-30,by+bh/2,7,'#fff2c4');

  // footer: controls between gold rules with a leaf at each end
  const fy=PY+PH-18;
  ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PX+30,fy);ctx.lineTo(PX+150,fy);ctx.moveTo(PX+PW-150,fy);ctx.lineTo(PX+PW-30,fy);ctx.stroke();
  ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(PX+30,fy,3.5,0,6.3);ctx.arc(PX+PW-30,fy,3.5,0,6.3);ctx.fill();
  leaf(PX+156,fy+2,-0.35,20,'#6fae43','#3f7f2a');leaf(PX+PW-156,fy+2,Math.PI+0.35,20,'#6fae43','#3f7f2a');
  const items=['gas: UP','load / brake: SPACE','lean: LEFT RIGHT','M: sound'];
  ctx.font='bold 10px '+FONT;
  const widths=items.map(s=>ctx.measureText(s).width),total=widths.reduce((a,b)=>a+b,0)+(items.length-1)*26;
  let cx=W/2-total/2;
  for(let i=0;i<items.length;i++){
    ctx.textAlign='left';txt(items[i],cx,fy+4,10,UI.wood);cx+=widths[i];
    if(i<items.length-1){ctx.fillStyle='#8fd15a';ctx.beginPath();ctx.arc(cx+13,fy,2.5,0,6.3);ctx.fill();cx+=26;}
  }
  ctx.textAlign='left';
}

// The rolled-up shell: a dark disc with a thick rim in the pod's body colour and
// eight plate seams spiralling out from a slightly off-centre hub to the rim.
function shell(r,p){
  ctx.fillStyle=p.sh;ctx.beginPath();ctx.arc(0,0,r,0,6.3);ctx.fill();
  ctx.strokeStyle=p.bd;ctx.lineCap='butt';ctx.lineJoin='round';
  const hx=r*0.08,hy=r*0.04,n=8,lw=r*0.12;
  ctx.lineWidth=lw;
  for(let i=0;i<n;i++){const a=i/n*6.2832;
    const ex=hx+Math.cos(a)*r*0.9, ey=hy+Math.sin(a)*r*0.9;
    const am=a-0.5, cx=hx+Math.cos(am)*r*0.55, cy=hy+Math.sin(am)*r*0.55;
    if(p.sm)ctx.strokeStyle=p.sm[i];
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo(cx,cy,ex,ey);ctx.stroke();}
  ctx.strokeStyle=p.bd;ctx.beginPath();ctx.arc(0,0,r-lw*0.5,0,6.3);ctx.stroke();   // rim last so seam ends tuck under it
  ctx.fillStyle=p.bd;ctx.beginPath();ctx.arc(hx,hy,r*0.1,0,6.3);ctx.fill();
  ctx.fillStyle=p.hi;ctx.globalAlpha=0.3;
  ctx.beginPath();ctx.ellipse(-r*.25,-r*.55,r*.3,r*.08,-0.4,0,6.3);ctx.fill();
  ctx.globalAlpha=1;
}

function pod(x,y){
  const o=1-P.curl;                       // 0 = balled, 1 = splayed out
  const gr=P.rail?Math.min(1,(P.grindT||0)/8):0;   // how settled into the grind stance
  const sq=P.splat>0?Math.min(1,(48/T-P.splat)/(6/T)):0;      // pancaked on impact
  const fly=(!P.ground&&!P.rail)?o:0;   // airborne and open: spread out and glide
  // physics keeps the centre R straight above the dirt, which sinks the ball into a
  // slope by R/cos(a)-R; lift the drawing so the ball sits tangent to the face
  const lift=(P.ground&&!P.rail&&!P.splat)?Math.min(R*0.6,R/Math.max(0.5,Math.cos(P.smA))-R):0;
  ctx.save();ctx.translate(x,y-lift);ctx.rotate(P.rot);
  const len=R*(1+o*.10+gr*0.34+fly*0.30)*(1+sq*0.85),hgt=R*(1-o*.06-gr*0.20-fly*0.16)*(1-sq*0.62);
  if(o>.05){ctx.globalAlpha=Math.min(1,o*1.6);
    ctx.strokeStyle=C().lg;ctx.lineWidth=1.6+gr*0.7;
    if(fly>0){
      // flying: legs fan out above and below like wings, trailing back, with a slow flap
      const flap=Math.sin(P.time*.18)*2.2*fly;
      for(let i=0;i<3;i++){const lx=-len*.45+i*(len*.36);
        for(const s of [-1,1]){
          const sp=(6+i*1.5)*fly, back=(4+i*2)*fly;
          ctx.beginPath();ctx.moveTo(lx,s*hgt*.55);
          ctx.lineTo(lx-back*0.5,s*(hgt*.55+sp*0.6+flap*0.5));
          ctx.lineTo(lx-back,s*(hgt*.55+sp+flap));ctx.stroke();}}
    }else{
      for(let i=0;i<6;i++){const lx=-len*.62+i*(len*.25);
        // grinding: legs braced straight down onto the bar. otherwise they paddle.
        const sw=gr>0 ? lx*-0.30 : Math.sin(P.time*.22+i)*1.4*o;
        const reach=hgt*.72+(3.2*o)+gr*5.5;
        ctx.beginPath();ctx.moveTo(lx,hgt*.7);ctx.lineTo(lx+sw,reach);ctx.stroke();}
    }
    ctx.globalAlpha=1;}
  // the plate pattern turns at a fraction of the true roll (wagon-wheel) so it stays readable
  ctx.save();ctx.scale(len/R,hgt/R);ctx.rotate((P.vrot||0)-P.rot);shell(R,C());ctx.restore();
  // head plate shows as he unfurls, so the lean angle reads when it matters
  if(o>.05){ctx.globalAlpha=Math.min(1,o*1.6);
    ctx.fillStyle=C().hd;
    ctx.beginPath();ctx.ellipse(len*(.66+fly*.08),0,len*.26,hgt*.72,0,0,6.3);ctx.fill();
    ctx.globalAlpha=1;}
  if(P.press>0.08){                      // charge ring: brighter the more you have loaded
    ctx.globalAlpha=0.25+P.press*0.6;
    ctx.strokeStyle=P.press>0.75?'#d6f27a':'#9ff0c0';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,R+3+P.press*3,0,6.3*Math.min(1,P.press));ctx.stroke();
    ctx.globalAlpha=1;}
  if(o>.05){ctx.globalAlpha=Math.min(1,o*1.6);
    ctx.fillStyle=C().lg;ctx.beginPath();ctx.arc(len*.78,-hgt*.2,1.6,0,6.3);ctx.fill();
    ctx.fillStyle=C().dk;ctx.beginPath();ctx.ellipse(len*.88,0,3.2,hgt*.6,0,0,6.3);ctx.fill();
    ctx.fillStyle='#141414';ctx.fillRect(len*.9,-2,2,2);
    ctx.strokeStyle=C().dk;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(len*.96,-1);ctx.lineTo(len*.96+3.5*o,-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(len*.96,1.5);ctx.lineTo(len*.96+3*o,3);ctx.stroke();
    ctx.globalAlpha=1;}
  ctx.restore();
}

function hud(){
  ctx.textBaseline='top';ctx.textAlign='left';
  const t=(v,x,y,c,sz=11)=>txt(v,x,y,sz,c);
  // speed / time card, top-left
  panel(10,10,168,60,10);
  t(P.spd.toFixed(1),20,15,P.spd>14?UI.orangeDk:UI.ink,20);
  t('SPEED',72,25,UI.wood,8);
  ctx.fillStyle=UI.creamDk;rr(20,40,148,7,3.5);ctx.fill();
  ctx.fillStyle=P.spd>14?UI.orange:UI.grass;rr(21,41,Math.max(3,Math.round(146*Math.min(1,P.spd/22))),5,2.5);ctx.fill();
  const s=P.time/60;
  t(Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'),20,52,UI.ink,8);
  t('best '+P.best.toFixed(1),62,52,UI.wood,8);
  t('attempt '+attempts,116,52,attempts>1?'#d94f3d':UI.wood,8);

  // ---- the road ahead: silhouette of the next stretch, with each hill flagged ----
  const PW=230,PH=44,PX=W-PW-18,PY=24,AHEAD=6200,BEHIND=700;
  panel(PX-8,PY-14,PW+16,PH+22,10);
  t('ROAD AHEAD',PX+1,PY-6,UI.wood,7);
  ctx.fillStyle=UI.creamDk;rr(PX+54,PY-6,PW-54,6,3);ctx.fill();
  ctx.fillStyle=UI.grass;rr(PX+54,PY-6,Math.max(3,Math.round((PW-54)*Math.min(1,P.x/FINISH))),6,3);ctx.fill();
  ctx.fillStyle='#dcefff';rr(PX,PY+6,PW,PH-6,5);ctx.fill();
  ctx.save();rr(PX,PY+6,PW,PH-6,5);ctx.clip();
  let lo=1e9,hi=-1e9;
  for(let i=0;i<=60;i++){const wx=P.x-BEHIND+(AHEAD+BEHIND)*i/60,g=gAt(wx);
    if(g<lo)lo=g; if(g>hi)hi=g;}
  const span=Math.max(120,hi-lo);
  const py=wx=>PY+PH-5-((hi-gAt(wx))/span)*(PH-16);
  ctx.beginPath();
  for(let i=0;i<=PW;i++){const wx=P.x-BEHIND+(AHEAD+BEHIND)*i/PW;
    const yy=py(wx); if(i===0)ctx.moveTo(PX,yy);else ctx.lineTo(PX+i,yy);}
  ctx.lineTo(PX+PW,PY+PH);ctx.lineTo(PX,PY+PH);ctx.closePath();
  ctx.fillStyle='#8a5a2b';ctx.fill();
  ctx.strokeStyle=UI.grass;ctx.lineWidth=3;ctx.beginPath();
  for(let i=0;i<=PW;i++){const wx=P.x-BEHIND+(AHEAD+BEHIND)*i/PW;
    const yy=py(wx); if(i===0)ctx.moveTo(PX,yy);else ctx.lineTo(PX+i,yy);}
  ctx.stroke();
  for(const j of jumps){
    if(j.x<P.x-BEHIND||j.x>P.x+AHEAD)continue;
    const px=PX+PW*(j.x-(P.x-BEHIND))/(AHEAD+BEHIND);
    ctx.fillStyle={s:'#6dbf5c',m:'#e8c14a',l:'#e88a3c',p:'#e8566c',d:'#9f7cf0',j:'#5fd0e8',k:'#5fd0e8',u:'#f0c24a',w:'#49c8f0',g:'#d0d6de'}[j.kind];
    ctx.strokeStyle=UI.ink;ctx.lineWidth=1.5;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(px,py(j.x)-6);ctx.lineTo(px-4,py(j.x)-13);
    ctx.lineTo(px+4,py(j.x)-13);ctx.closePath();ctx.fill();ctx.stroke();
  }
  const mx=PX+PW*BEHIND/(AHEAD+BEHIND);
  ctx.fillStyle='#ff8a4c';ctx.strokeStyle=UI.ink;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(mx,py(P.x)-4,4,0,6.3);ctx.fill();ctx.stroke();
  ctx.restore();

  if(P.won){
    ctx.fillStyle='rgba(20,40,30,.45)';ctx.fillRect(0,0,W,H);
    panel(W/2-190,H/2-110,380,220);
    card(W/2-176,H/2-96,352,54,UI.grass,UI.grassDk,10);
    ctx.textAlign='center';
    txt('FINISHED!',W/2,H/2-84,26,'#ff8a5c','#3a2a1a',5);
    const ws=P.won/60;
    card(W/2-176,H/2-32,170,54,UI.card.y,UI.wood);  t('TIME',W/2-91,H/2-24,UI.wood,9);  t(Math.floor(ws/60)+':'+String(Math.floor(ws%60)).padStart(2,'0'),W/2-91,H/2-10,UI.ink,18);
    card(W/2+6,H/2-32,170,54,UI.card.g,UI.wood);    t('TOP SPEED',W/2+91,H/2-24,UI.wood,9); t(P.best.toFixed(1),W/2+91,H/2-10,UI.ink,18);
    t('attempts  '+attempts,W/2,H/2+30,attempts>1?'#d94f3d':UI.wood,11);
    button(W/2-120,H/2+56,240,38,'PRESS R TO RIDE AGAIN');
    ctx.textAlign='left';ctx.textBaseline='top';}
}

let acc=0,last=performance.now();
function loop(now){acc+=Math.min(100,now-last);last=now;
  while(acc>=16.6667){step();acc-=16.6667;}
  draw();requestAnimationFrame(loop);}
reset();buildDecor();requestAnimationFrame(loop);
})();
</script>
